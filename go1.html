<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script>
  /* 初回読み込み時に必ず最上部から表示（スクロール演出の起点を固定） */
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  window.addEventListener("load", function(){ window.scrollTo(0, 0); });
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="robots" content="noindex,nofollow">
<title>GO1 - AUTO RACE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root{
    /* ===== GO1 カラーテーマ（ヘッダー画像から抽出：黒・金・白） ===== */
    --bg:#000000;
    --gold-br:#ffdb5b;          /* 画像内の最も明るい金 */
    --gold-lt:#f3e3b8;          /* 淡金（白寄り） */
    --gold:#d9b45f;             /* 基準金 */
    --gold-dp:#8c6a2f;          /* 深金 */
    --wht:#ffffff;
    --txt:rgba(255,255,255,.92);
    --sub:rgba(255,255,255,.5);
    --faint:rgba(255,255,255,.3);
    --line:rgba(217,180,95,.16); /* 金を含んだヘアライン */
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{background:var(--bg);}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:'Noto Sans JP',sans-serif;
    min-height:100vh;
    overflow-x:clip;              /* スライドイン待機位置による横スクロールを抑止 */
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  #page{display:flex;flex-direction:column;min-height:100vh;}

  /* ===== ヘッダー画像（フェードイン） ===== */
  .g1-header{
    background:var(--bg);
    display:flex;justify-content:center;
    padding:max(6px, env(safe-area-inset-top)) 0 0;
  }
  .g1-header img{
    display:block;
    width:100%;max-width:860px;height:auto;
    opacity:0;
    transform:scale(1.012);
    transition:opacity 1.1s ease, transform 1.4s cubic-bezier(.22,1,.36,1);
  }
  .g1-header.loaded img{opacity:1;transform:none;}

  /* ===== メイン ===== */
  .g1-main{flex:1;background:var(--bg);}

  /* 今後のメインコンテンツ用の余白（ここに機能を追加していく） */
  .g1-slot{min-height:34vh;}
  .g1-slot-b{min-height:46vh;}

  /* ===== 見出し（スクロールで右から2段時間差スライドイン） ===== */
  .g1-hero{
    padding:0 16px;
    overflow:hidden;              /* 待機位置のはみ出しをクリップ */
  }
  .g1-line{
    opacity:0;
    transform:translate3d(72px,0,0);
    transition:opacity .82s cubic-bezier(.22,1,.36,1),
               transform .95s cubic-bezier(.22,1,.36,1);
    will-change:opacity,transform;
  }
  .g1-hero.in .g1-l1{opacity:1;transform:none;}
  .g1-hero.in .g1-l2{opacity:1;transform:none;transition-delay:.56s;}

  .g1-l1{
    font-family:'Noto Sans JP',sans-serif;
    font-weight:900;
    font-size:clamp(24px,8.2vw,54px);
    line-height:1.26;
    letter-spacing:.01em;
    color:var(--wht);
  }
  .g1-l1 .mk{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:.02em;
    padding-right:.12em;
    background:linear-gradient(100deg,var(--gold-dp) 0%,var(--gold) 34%,var(--gold-br) 62%,var(--gold-lt) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
  }
  .g1-l2{
    margin-top:clamp(24px,6.8vw,42px);
    font-family:'Oswald',sans-serif;
    font-weight:400;
    font-size:clamp(21px,6.4vw,36px);
    letter-spacing:.26em;
    background:linear-gradient(90deg,var(--gold) 0%,var(--gold-br) 46%,var(--gold-lt) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
  }

  /* ===== フッター（result.html db-footer をGO1配色で流用） ===== */
  .db-footer{
    background:var(--bg);
    border-top:1px solid var(--line);
    padding:22px 20px;
    padding-bottom:max(26px, env(safe-area-inset-bottom));
  }
  .db-footer .brand{
    text-align:center;
    font-family:'Oswald',sans-serif;font-size:15px;font-weight:400;
    letter-spacing:.06em;color:rgba(255,255,255,.78);
    margin-bottom:7px;padding-left:.06em;
  }
  .db-footer .brand::after{
    content:'';display:block;width:34px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--gold-dp) 0%,var(--gold) 46%,var(--gold-br) 78%,var(--gold-lt) 100%);
    margin:8px auto 0;opacity:.95;
  }
  .db-divider{height:1px;background:rgba(217,180,95,.14);margin:0 0 16px;}

  .db-nav{
    display:flex;justify-content:center;align-items:center;
    gap:20px;margin-bottom:16px;
  }
  .db-nav a{
    display:inline-flex;align-items:center;gap:6px;
    font-family:'Oswald',sans-serif;font-size:13px;font-weight:400;letter-spacing:.05em;
    color:rgba(255,255,255,.62);text-decoration:none;
    transition:color .2s;
  }
  .db-nav a svg{width:11px;height:11px;fill:currentColor;flex:0 0 11px;opacity:.85;}
  .db-nav a:hover,.db-nav a:focus-visible{color:var(--gold-lt);}
  .db-nav .x-mark{
    font-family:'Oswald',sans-serif;font-size:12px;
    color:var(--gold);opacity:.7;user-select:none;
  }

  .db-copy{
    text-align:center;font-size:10px;letter-spacing:.05em;
    color:rgba(255,255,255,.35);
  }

  /* ===== アクセシビリティ ===== */
  a:focus-visible{outline:1px solid var(--gold);outline-offset:3px;border-radius:2px;}

  @media (prefers-reduced-motion:reduce){
    .g1-header img,.g1-line{transition:none;}
    .g1-header img{opacity:1;transform:none;}
    .g1-line{opacity:1;transform:none;}
  }
</style>
</head>
<body>

<div id="page">

  <header class="g1-header" id="g1Header">
    <img id="g1HeaderImg" src="go1header.webp" alt="GO1" width="1380" height="960" decoding="async">
  </header>

  <main class="g1-main">
    <!-- 今後のメインコンテンツ挿入位置（現状は余白） -->
    <div class="g1-slot"></div>

    <section class="g1-hero" id="g1Hero">
      <h1 class="g1-line g1-l1"><span class="mk">GO1</span>オートレース予想</h1>
      <p class="g1-line g1-l2">COMING SOON</p>
    </section>

    <div class="g1-slot-b"></div>
  </main>

  <footer class="db-footer">
    <div class="brand">GO1 - AUTO RACE</div>
    <div class="db-divider"></div>
    <nav class="db-nav">
      <a href="https://x.com/gouwan17?s=21" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-7.4 8.5L23 22h-6.3l-4.9-6.4L6.2 22H3l7.7-8.8L2.4 2h6.4l4.6 6.1L18.9 2Zm-1.1 18h1.7L7.3 3.8H5.5L17.8 20Z"/></svg>
        GO1
      </a>
      <span class="x-mark">×</span>
      <a href="https://x.com/brainkeirin?s=11" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-7.4 8.5L23 22h-6.3l-4.9-6.4L6.2 22H3l7.7-8.8L2.4 2h6.4l4.6 6.1L18.9 2Zm-1.1 18h1.7L7.3 3.8H5.5L17.8 20Z"/></svg>
        Brain
      </a>
    </nav>
    <div class="db-copy">GO1 - AUTO RACE &copy;Brain 2026</div>
  </footer>

</div>

<script>
(function(){
  'use strict';

  /* ===== ヘッダー画像フェードイン ===== */
  var head = document.getElementById('g1Header');
  var img  = document.getElementById('g1HeaderImg');
  function showHeader(){ if(head) head.classList.add('loaded'); }
  if(img){
    if(img.complete && img.naturalWidth > 0){
      requestAnimationFrame(showHeader);
    }else{
      img.addEventListener('load', showHeader);
      img.addEventListener('error', showHeader);   /* 読み込み失敗でも枠は表示 */
    }
  }else{
    showHeader();
  }

  /* ===== 見出し：スクロールで右から2段時間差スライドイン =====
     見出しを上部寄りに置くと初期表示で画面内に入り得るため、
     「画面内に入った」かつ「実際にスクロールされた」の両方を発火条件にする。
     ページが1画面に収まりスクロール不可の場合のみ、フォールバックで自動表示。 */
  var hero = document.getElementById('g1Hero');
  if(hero){
    if('IntersectionObserver' in window){
      var inView = false, done = false;
      var SCROLL_GATE = 24;   /* px：これ以上スクロールされたら発火 */

      function reveal(){
        if(done) return;
        done = true;
        hero.classList.add('in');
        io.unobserve(hero);
        window.removeEventListener('scroll', onScroll);
      }
      function onScroll(){
        if(inView && window.pageYOffset > SCROLL_GATE) reveal();
      }
      var io = new IntersectionObserver(function(entries){
        for(var i=0;i<entries.length;i++){
          if(entries[i].isIntersecting){
            inView = true;
            onScroll();   /* すでにスクロール済みなら即発火 */
          }
        }
      }, { threshold:0, rootMargin:'0px 0px -12% 0px' });
      io.observe(hero);
      window.addEventListener('scroll', onScroll, { passive:true });

      /* スクロール不可レイアウト時の保険 */
      setTimeout(function(){
        var doc = document.documentElement;
        if(!done && doc.scrollHeight - window.innerHeight <= SCROLL_GATE) reveal();
      }, 900);
    }else{
      hero.classList.add('in');  /* 非対応環境は即表示 */
    }
  }
})();
</script>

</body>
</html>
