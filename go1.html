<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script>
  /* 初回読み込み時に必ず最上部から表示（スクロール演出の起点を固定） */
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  window.addEventListener("load", function(){ window.scrollTo(0, 0); });
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="robots" content="noindex,nofollow">
<title>GO1 - AUTO RACE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root{
    /* ===== GO1 カラーテーマ（ヘッダー画像から抽出：黒・金・白） ===== */
    --bg:#000000;
    --gold-br:#ffdb5b;          /* 画像内の最も明るい金 */
    --gold-lt:#f3e3b8;          /* 淡金（白寄り） */
    --gold:#d9b45f;             /* 基準金 */
    --gold-dp:#8c6a2f;          /* 深金 */
    --wht:#ffffff;
    --txt:rgba(255,255,255,.92);
    --sub:rgba(255,255,255,.5);
    --faint:rgba(255,255,255,.3);
    --line:rgba(217,180,95,.16); /* 金を含んだヘアライン */
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{background:var(--bg);}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:'Noto Sans JP',sans-serif;
    min-height:100vh;
    overflow-x:clip;              /* スライドイン待機位置による横スクロールを抑止 */
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  #page{display:flex;flex-direction:column;min-height:100vh;}

  /* ===== ステージ（ヘッダー画像＋見出し＋スパークル層の共通座標系） ===== */
  .g1-stage{position:relative;background:var(--bg);}

  /* ===== ヘッダー画像（フェードイン） ===== */
  .g1-header{
    display:flex;justify-content:center;
    padding:max(6px, env(safe-area-inset-top)) 0 0;
  }
  .g1-header img{
    display:block;
    width:100%;max-width:860px;height:auto;
    opacity:0;
    transform:scale(1.012);
    transition:opacity 1.1s ease, transform 1.4s cubic-bezier(.22,1,.36,1);
  }
  .g1-stage.loaded .g1-header img{opacity:1;transform:none;}

  /* ===== スパークル層（ヘッダー画像より前面。画像の明部を発生源に降下） ===== */
  .g1-sparkle{
    position:absolute;left:0;top:0;
    width:100%;height:100%;
    z-index:3;
    pointer-events:none;
    opacity:0;
    transition:opacity 1.8s ease .4s;
  }
  .g1-stage.loaded .g1-sparkle{opacity:1;}

  /* ヘッダー画像と見出しの間隔（画像側へ寄せる） */
  .g1-gap{min-height:clamp(10px,4.4vh,40px);}

  /* ===== 見出し（スクロールで右から2段時間差スライドイン） ===== */
  .g1-hero{
    position:relative;z-index:2;
    padding:0 16px;
    overflow:hidden;              /* 待機位置のはみ出しをクリップ */
  }
  .g1-line{
    opacity:0;
    transform:translate3d(72px,0,0);
    transition:opacity .82s cubic-bezier(.22,1,.36,1),
               transform .95s cubic-bezier(.22,1,.36,1);
    will-change:opacity,transform;
  }
  .g1-hero.in .g1-l1{opacity:1;transform:none;}
  .g1-hero.in .g1-l2{opacity:1;transform:none;transition-delay:.56s;}

  .g1-l1{
    font-family:'Noto Sans JP',sans-serif;
    font-weight:900;
    font-size:clamp(24px,8.2vw,54px);
    line-height:1.26;
    letter-spacing:.01em;
    color:var(--wht);
  }
  .g1-l1 .mk{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:.02em;
    padding-right:.12em;
    background:linear-gradient(100deg,var(--gold-dp) 0%,var(--gold) 34%,var(--gold-br) 62%,var(--gold-lt) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
  }
  .g1-l2{
    margin-top:clamp(24px,6.8vw,42px);
    font-family:'Oswald',sans-serif;
    font-weight:400;
    font-size:clamp(21px,6.4vw,36px);
    letter-spacing:.26em;
    background:linear-gradient(90deg,var(--gold) 0%,var(--gold-br) 46%,var(--gold-lt) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
  }

  /* 今後のメインコンテンツ用の余白（見出しの下に確保） */
  .g1-slot{min-height:62vh;}

  .g1-main{flex:1;background:var(--bg);}

  /* ===== フッター（result.html db-footer をGO1配色で流用） ===== */
  .db-footer{
    background:var(--bg);
    border-top:1px solid var(--line);
    padding:22px 20px;
    padding-bottom:max(26px, env(safe-area-inset-bottom));
  }
  .db-footer .brand{
    text-align:center;
    font-family:'Oswald',sans-serif;font-size:15px;font-weight:400;
    letter-spacing:.06em;color:rgba(255,255,255,.78);
    margin-bottom:7px;padding-left:.06em;
  }
  .db-footer .brand::after{
    content:'';display:block;width:34px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--gold-dp) 0%,var(--gold) 46%,var(--gold-br) 78%,var(--gold-lt) 100%);
    margin:8px auto 0;opacity:.95;
  }
  .db-divider{height:1px;background:rgba(217,180,95,.14);margin:0 0 16px;}

  .db-nav{
    display:flex;justify-content:center;align-items:center;
    gap:20px;margin-bottom:16px;
  }
  .db-nav a{
    display:inline-flex;align-items:center;gap:6px;
    font-family:'Oswald',sans-serif;font-size:13px;font-weight:400;letter-spacing:.05em;
    color:rgba(255,255,255,.62);text-decoration:none;
    transition:color .2s;
  }
  .db-nav a svg{width:11px;height:11px;fill:currentColor;flex:0 0 11px;opacity:.85;}
  .db-nav a:hover,.db-nav a:focus-visible{color:var(--gold-lt);}
  .db-nav .x-mark{
    font-family:'Oswald',sans-serif;font-size:12px;
    color:var(--gold);opacity:.7;user-select:none;
  }

  .db-copy{
    text-align:center;font-size:10px;letter-spacing:.05em;
    color:rgba(255,255,255,.35);
  }

  /* ===== アクセシビリティ ===== */
  a:focus-visible{outline:1px solid var(--gold);outline-offset:3px;border-radius:2px;}

  @media (prefers-reduced-motion:reduce){
    .g1-header img,.g1-line,.g1-sparkle{transition:none;}
    .g1-header img{opacity:1;transform:none;}
    .g1-line{opacity:1;transform:none;}
    .g1-sparkle{opacity:1;}
  }
</style>
</head>
<body>

<div id="page">

  <div class="g1-stage" id="g1Stage">

    <canvas class="g1-sparkle" id="g1Sparkle" aria-hidden="true"></canvas>

    <header class="g1-header">
      <img id="g1HeaderImg" src="go1header.webp" alt="GO1" width="1380" height="960" decoding="async">
    </header>

    <div class="g1-gap"></div>

    <section class="g1-hero" id="g1Hero">
      <h1 class="g1-line g1-l1"><span class="mk">GO1</span>オートレース予想</h1>
      <p class="g1-line g1-l2">COMING SOON</p>
    </section>

  </div>

  <main class="g1-main">
    <!-- 今後のメインコンテンツ挿入位置（現状は余白） -->
    <div class="g1-slot"></div>
  </main>

  <footer class="db-footer">
    <div class="brand">GO1 - AUTO RACE</div>
    <div class="db-divider"></div>
    <nav class="db-nav">
      <a href="https://x.com/gouwan17?s=21" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-7.4 8.5L23 22h-6.3l-4.9-6.4L6.2 22H3l7.7-8.8L2.4 2h6.4l4.6 6.1L18.9 2Zm-1.1 18h1.7L7.3 3.8H5.5L17.8 20Z"/></svg>
        GO1
      </a>
      <span class="x-mark">×</span>
      <a href="https://x.com/brainkeirin?s=11" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-7.4 8.5L23 22h-6.3l-4.9-6.4L6.2 22H3l7.7-8.8L2.4 2h6.4l4.6 6.1L18.9 2Zm-1.1 18h1.7L7.3 3.8H5.5L17.8 20Z"/></svg>
        Brain
      </a>
    </nav>
    <div class="db-copy">GO1 - AUTO RACE &copy;Brain 2026</div>
  </footer>

</div>

<script>
(function(){
  'use strict';

  var stage = document.getElementById('g1Stage');
  var img   = document.getElementById('g1HeaderImg');
  var hero  = document.getElementById('g1Hero');
  var cv    = document.getElementById('g1Sparkle');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* =========================================================
     1. ヘッダー画像フェードイン
     ========================================================= */
  function onImgReady(){
    if(stage) stage.classList.add('loaded');
    initSparkle();
  }
  if(img){
    if(img.complete && img.naturalWidth > 0){
      requestAnimationFrame(onImgReady);
    }else{
      img.addEventListener('load', onImgReady);
      img.addEventListener('error', onImgReady);   /* 読み込み失敗でも枠は表示 */
    }
  }else{
    onImgReady();
  }

  /* =========================================================
     2. 見出し：スクロールで右から2段時間差スライドイン
        「画面内に入った」かつ「実際にスクロールされた」の複合条件。
        1画面に収まりスクロール不可の場合のみフォールバックで自動表示。
     ========================================================= */
  if(hero){
    if('IntersectionObserver' in window){
      var inView = false, done = false;
      var SCROLL_GATE = 24;   /* px：これ以上スクロールされたら発火 */

      var reveal = function(){
        if(done) return;
        done = true;
        hero.classList.add('in');
        io.unobserve(hero);
        window.removeEventListener('scroll', onScroll);
      };
      var onScroll = function(){
        if(inView && window.pageYOffset > SCROLL_GATE) reveal();
      };
      var io = new IntersectionObserver(function(entries){
        for(var i=0;i<entries.length;i++){
          if(entries[i].isIntersecting){
            inView = true;
            onScroll();   /* すでにスクロール済みなら即発火 */
          }
        }
      }, { threshold:0, rootMargin:'0px 0px -12% 0px' });
      io.observe(hero);
      window.addEventListener('scroll', onScroll, { passive:true });

      /* スクロール不可レイアウト時の保険 */
      setTimeout(function(){
        var doc = document.documentElement;
        if(!done && doc.scrollHeight - window.innerHeight <= SCROLL_GATE) reveal();
      }, 900);
    }else{
      hero.classList.add('in');  /* 非対応環境は即表示 */
    }
  }

  /* =========================================================
     3. スパークル
        ヘッダー画像の明部ピクセルを実サンプリングして発生源にする。
        金の飛沫→金の粒／白の飛沫→白の粒／暗部の粒→濃いグレーの粒。
        画像から離れるほど淡くなり、見出しの位置で溶けて消える。
     ========================================================= */
  var PALETTE = {
    gold : ['#ffdb5b','#d9b45f','#f3e3b8'],   /* 画像から抽出した金 */
    white: ['#ffffff','#f4f4f4'],
    grey : ['#50525a','#3d3f45']              /* 濃いグレー */
  };

  var ctx = null, DPR = 1;
  var W = 0, H = 0;
  var imgBox = { x:0, y:0, w:0, h:0 };
  var seeds  = [];       /* 発生源：画像ボックス内の正規化座標 */
  var sprites = { gold:[], white:[], grey:[] };
  var parts = [];
  var running = false, rafId = 0, lastT = 0, inited = false;

  function hexToRgb(h){
    return [parseInt(h.substr(1,2),16), parseInt(h.substr(3,2),16), parseInt(h.substr(5,2),16)];
  }
  function rgba(h,a){
    var c = hexToRgb(h);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }

  /* 超微細に見せるため、芯を極小・外周を淡いハローにしたスプライトを事前生成 */
  function makeSprite(hex){
    var S = 24;
    var c = document.createElement('canvas');
    c.width = c.height = S;
    var g = c.getContext('2d');
    var rg = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
    rg.addColorStop(0,    rgba(hex,1));
    rg.addColorStop(0.16, rgba(hex,0.92));
    rg.addColorStop(0.42, rgba(hex,0.22));
    rg.addColorStop(1,    rgba(hex,0));
    g.fillStyle = rg;
    g.beginPath(); g.arc(S/2, S/2, S/2, 0, Math.PI*2); g.fill();
    return c;
  }
  function buildSprites(){
    for(var k in PALETTE){
      if(!Object.prototype.hasOwnProperty.call(PALETTE,k)) continue;
      sprites[k] = [];
      for(var i=0;i<PALETTE[k].length;i++) sprites[k].push(makeSprite(PALETTE[k][i]));
    }
  }

  function fallbackSeeds(){
    seeds.length = 0;
    for(var k=0;k<180;k++){
      seeds.push({
        nx: Math.random(),
        ny: Math.random()*0.9,
        t : (k%3===0) ? 'gold' : ((k%3===1) ? 'white' : 'grey')
      });
    }
  }

  function buildSeeds(){
    seeds.length = 0;
    try{
      if(!img || !img.naturalWidth) throw new Error('no image');
      var SW = 140;
      var SH = Math.max(1, Math.round(SW * img.naturalHeight / img.naturalWidth));
      var oc = document.createElement('canvas');
      oc.width = SW; oc.height = SH;
      var octx = oc.getContext('2d', { willReadFrequently:true });
      octx.drawImage(img, 0, 0, SW, SH);
      var d = octx.getImageData(0, 0, SW, SH).data;

      for(var y=0;y<SH;y++){
        for(var x=0;x<SW;x++){
          var i = (y*SW + x) * 4;
          var r = d[i], g = d[i+1], b = d[i+2];
          var lum = 0.299*r + 0.587*g + 0.114*b;
          if(lum < 26) continue;                      /* 黒背景は発生源にしない */
          /* 明るい画素ほど採用率を上げる＝飛沫の濃い所から多く降る */
          if(Math.random() > Math.min(1, lum/200)) continue;
          var t;
          if(r - b > 34 && r > 88)      t = 'gold';   /* 金の飛沫 */
          else if(lum > 148)            t = 'white';  /* 白の飛沫 */
          else                          t = 'grey';   /* 暗部の粒＝濃いグレー */
          var sd = { nx:(x+0.5)/SW, ny:(y+0.5)/SH, t:t };
          seeds.push(sd);
          /* 画像は白の飛沫が約63%・金が約11%。そのままだと金がほぼ出ないため
             金のシードのみ重み付け（実測比 金11.5%→約28%）して見え方を整える */
          if(t === 'gold'){ seeds.push(sd); seeds.push(sd); }
        }
      }
    }catch(e){
      seeds.length = 0;   /* CORS等で読み取れない場合 */
    }
    if(seeds.length < 40) fallbackSeeds();
  }

  function spawn(p, initial){
    var s = seeds[(Math.random()*seeds.length)|0];
    var list = sprites[s.t];
    p.t   = s.t;
    p.spr = list[(Math.random()*list.length)|0];
    p.x   = imgBox.x + s.nx*imgBox.w + (Math.random()-0.5)*6;
    p.y0  = imgBox.y + s.ny*imgBox.h;
    p.y   = initial ? (p.y0 + Math.random()*Math.max(1, H - p.y0)) : (p.y0 - Math.random()*10);
    /* 表示サイズ。芯は約16%なので実視認は0.4〜0.8px相当＝超微細 */
    p.sz  = (s.t === 'gold' ? 2.0 : 1.7) + Math.random()*(s.t === 'gold' ? 2.9 : 2.1);
    p.vy  = 7 + Math.random()*16 + p.sz*1.5;       /* px/秒：ゆっくり降る */
    p.amp = 3 + Math.random()*9;                   /* 横揺れ幅 */
    p.spd = 0.22 + Math.random()*0.5;              /* 横揺れ速度 */
    p.ph  = Math.random()*Math.PI*2;
    p.tw  = 0.6 + Math.random()*1.9;               /* 明滅速度 */
    p.base = (s.t === 'grey') ? (0.48 + Math.random()*0.42)
                              : (0.32 + Math.random()*0.48);
  }

  function measure(){
    if(!stage || !ctx) return;
    W = stage.clientWidth;
    H = stage.clientHeight;
    cv.width  = Math.max(1, Math.round(W*DPR));
    cv.height = Math.max(1, Math.round(H*DPR));
    cv.style.width  = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var ir = img ? img.getBoundingClientRect() : null;
    var sr = stage.getBoundingClientRect();
    if(ir && ir.width > 0){
      imgBox = { x: ir.left - sr.left, y: ir.top - sr.top, w: ir.width, h: ir.height };
    }else{
      imgBox = { x:0, y:0, w:W, h:Math.max(1, H*0.45) };
    }
  }

  function populate(){
    var n = Math.round(Math.max(55, Math.min(150, (W*H)/2400)));
    parts.length = 0;
    for(var i=0;i<n;i++){
      var p = {};
      spawn(p, true);
      parts.push(p);
    }
  }

  function frame(now){
    var dt = (now - lastT) / 1000;
    if(!(dt > 0) || dt > 0.05) dt = 0.016;
    lastT = now;

    ctx.clearRect(0, 0, W, H);
    var tsec = now / 1000;

    for(var i=0;i<parts.length;i++){
      var p = parts[i];
      p.y += p.vy * dt;
      if(p.y > H + 8){ spawn(p, false); continue; }

      var sx = Math.sin(tsec*p.spd + p.ph) * p.amp;
      /* 画像から離れるほど淡く＝画像と地の黒を自然につなぐ */
      var span  = Math.max(1, H - p.y0);
      var k     = (p.y - p.y0) / span;
      if(k < 0) k = 0; else if(k > 1) k = 1;
      var depth = 1 - 0.86*k;
      var fin   = (p.y - p.y0 + 10) / 16;
      if(fin < 0) fin = 0; else if(fin > 1) fin = 1;
      var tw    = 0.6 + 0.4*Math.sin(tsec*p.tw + p.ph);

      var a = p.base * depth * fin * tw;
      if(a <= 0.004) continue;
      ctx.globalAlpha = a;
      ctx.drawImage(p.spr, p.x + sx - p.sz/2, p.y - p.sz/2, p.sz, p.sz);
    }
    ctx.globalAlpha = 1;
    if(running) rafId = requestAnimationFrame(frame);
  }

  function start(){
    if(running || !inited || reduce) return;
    running = true;
    lastT = performance.now();
    rafId = requestAnimationFrame(frame);
  }
  function stop(){
    running = false;
    if(rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }

  function initSparkle(){
    if(inited || !cv || !stage) return;
    if(!cv.getContext) return;
    ctx = cv.getContext('2d');
    if(!ctx) return;
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    buildSprites();
    buildSeeds();
    measure();
    populate();
    inited = true;

    if(reduce){
      /* 動きを抑える設定では静止した一枚だけ描く */
      frame(performance.now());
      return;
    }

    /* 画面外・非表示タブでは止める */
    if('IntersectionObserver' in window){
      var vio = new IntersectionObserver(function(es){
        for(var i=0;i<es.length;i++){
          if(es[i].isIntersecting) start(); else stop();
        }
      }, { threshold:0 });
      vio.observe(stage);
    }else{
      start();
    }
    document.addEventListener('visibilitychange', function(){
      if(document.hidden) stop(); else start();
    });

    var rt = 0;
    window.addEventListener('resize', function(){
      clearTimeout(rt);
      rt = setTimeout(function(){
        measure();
        populate();
        if(reduce) frame(performance.now());
      }, 180);
    });
  }
})();
</script>

</body>
</html>
