  /* =========================================================
     前5走成績（oddspark RaceList.do）

     winticket の出走表ページには前走以前の1走ごとの成績が無い。
     オッズパークの「レース別出走表」に 前走／前々走／3走前／4走前／5走前 が
     入っており、SSRで取得できることを実URLで確認済み。
       https://www.oddspark.com/autorace/RaceList.do?raceDy=YYYYMMDD&placeCd=NN&raceNo=N
     placeCd は VENUE[slug].cd（winticket の meetingId 下2桁と同じ）。
     ========================================================= */

  var PREV_CACHE = {};

  function oddsparkRaceListUrl(slug, ymd, raceNo){
    var cd = (VENUE[slug] && VENUE[slug].cd) || '';
    return 'https://www.oddspark.com/autorace/RaceList.do?raceDy=' + ymd +
           '&placeCd=' + cd + '&raceNo=' + raceNo;
  }

  /* 1走ぶんのテキストを分解
     例: 「8/12 浜松1R 湿 0m 1着 3.832 試3.48 ST0.20」 */
  function parseHist(t){
    var s2 = String(t).replace(/\s+/g, ' ').trim();
    var mDate = s2.match(/(\d{1,2}\/\d{1,2})\s*(\D+?)(\d{1,2})R/);
    var mCond = s2.match(/(良|湿|斑|荒|渇|重)/);
    var mHd   = s2.match(/(\d+)m/);
    var mRk   = s2.match(/(\d+)着/);
    var mNg   = s2.match(/(欠車|失格|落車|故障|除外|返還|中止)/);
    var mRT   = s2.match(/(\d\.\d{3})/);           /* 競走タイムは小数3桁 */
    var mST   = s2.match(/ST\s*(\d\.\d{2})/);
    var mTT   = s2.match(/(再?)試\s*(\d\.\d{2})/); /* 試走タイム。再試走は「再試」 */
    return {
      date : mDate ? mDate[1] : '',
      place: mDate ? mDate[2].replace(/\s/g,'') : '',
      race : mDate ? mDate[3] : '',
      cond : mCond ? mCond[1] : '',
      handi: mHd ? (mHd[1] + 'm') : '',
      rank : mRk ? Number(mRk[1]) : null,
      ng   : mNg ? mNg[1] : '',
      rt   : mRT ? mRT[1] : '',
      tt   : mTT ? ((mTT[1] ? '再試' : '試') + mTT[2]) : '',
      st   : mST ? mST[1] : ''
    };
  }

  function parsePrev5(html){
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var out = {}, tables = doc.querySelectorAll('table');
    for(var i=0;i<tables.length;i++){
      var tt = tables[i].textContent || '';
      if(tt.indexOf('前走') < 0 || tt.indexOf('5走前') < 0) continue;
      var body = tables[i].tBodies[0];
      if(!body) continue;
      for(var r=0;r<body.rows.length;r++){
        var row = body.rows[r];
        var first = txt(row.cells[0] || null);
        var m = first.match(/^(\d+)$/);
        if(!m) continue;
        var hist = [];
        for(var c=0;c<row.cells.length;c++){
          var ct = txt(row.cells[c]);
          /* 「日付＋場＋R」を含むセルだけを走歴とみなす。
             列位置に依存させないことで、オッズパークの列構成が変わっても壊れない */
          if(/\d{1,2}\/\d{1,2}/.test(ct) && /\d{1,2}R/.test(ct)) hist.push(parseHist(ct));
        }
        if(hist.length) out[Number(m[1])] = hist.slice(0, PREV_N);
      }
      if(Object.keys(out).length) break;
    }
    return out;
  }

  /* =========================================================
     1日出走表（oddspark OneDayRaceList.do）
     ★winticket の出走表ページには「他レースの発走時刻」が無い。
       このページに 全レースの 発走時間 と レース種別 が揃っているので、
       レースセレクターの締切表示はここから作る。
       https://www.oddspark.com/autorace/OneDayRaceList.do?raceDy=YYYYMMDD&placeCd=NN
     ========================================================= */
  var DAY_CACHE = {};
  /* ★取得中のキーを保持する。初期化時に route() が複数回走るため、
     キャッシュ確定前に同じリクエストが並走してしまう。 */
  var DAY_PENDING = {};

  function oddsparkOneDayUrl(slug, ymd){
    var cd = (VENUE[slug] && VENUE[slug].cd) || '';
    return 'https://www.oddspark.com/autorace/OneDayRaceList.do?raceDy=' + ymd + '&placeCd=' + cd;
  }

  function parseOneDay(html){
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var out = {};
    /* 「◯R ◯◯戦 …」のリンクと、その近傍の「発走時間 HH:MM」を対にする。
       DOM構造に依存しないよう、リンクの祖先ブロックのテキストから拾う。 */
    var links = doc.querySelectorAll('a[href*="RaceList.do"]');
    for(var i=0;i<links.length;i++){
      var a = links[i];
      var lt = (a.textContent || '').replace(/\s+/g, ' ').trim();
      var m = lt.match(/^(\d{1,2})R\s*(\S+?)\s/);
      if(!m) continue;
      var no = Number(m[1]);
      if(out[no]) continue;
      var box = a.parentElement;
      /* 発走時間を含む祖先まで最大4段さかのぼる */
      var t = '';
      for(var up=0; up<4 && box; up++){
        var bt = (box.textContent || '').replace(/\s+/g, ' ');
        var tm = bt.match(/発走時間\s*(\d{1,2}:\d{2})/);
        if(tm){ t = tm[1]; break; }
        box = box.parentElement;
      }
      out[no] = { cls: m[2], start: t };
    }
    return out;
  }

  function loadOneDay(slug, ymd, cb){
    var key = slug + '/' + ymd;
    if(DAY_CACHE[key]){ cb(null, DAY_CACHE[key]); return; }
    if(!ymd){ cb(new Error('開催日が不明です'), null); return; }
    /* 同じキーが取得中なら待ち行列に積むだけにする */
    if(DAY_PENDING[key]){ DAY_PENDING[key].push(cb); return; }
    DAY_PENDING[key] = [cb];

    var done = function(err, d){
      var qs = DAY_PENDING[key] || [];
      delete DAY_PENDING[key];
      for(var i=0;i<qs.length;i++) qs[i](err, d);
    };

    fetch(PROXY_URL + '?url=' + encodeURIComponent(oddsparkOneDayUrl(slug, ymd))).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function(html){
      var d = parseOneDay(html);
      if(!Object.keys(d).length) throw new Error('1日出走表を取得できませんでした');
      DAY_CACHE[key] = d;
      done(null, d);
    }).catch(function(e){
      console.error('1日出走表の取得に失敗:', e);
      done(e, null);
    });
  }

  function loadPrev5(slug, ymd, raceNo, cb){
    var key = slug + '/' + ymd + '/' + raceNo;
    if(PREV_CACHE[key]){ cb(null, PREV_CACHE[key]); return; }
    if(!ymd){ cb(new Error('開催日が不明です'), null); return; }
    var target = oddsparkRaceListUrl(slug, ymd, raceNo);
    fetch(PROXY_URL + '?url=' + encodeURIComponent(target)).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function(html){
      var p = parsePrev5(html);
      if(!Object.keys(p).length) throw new Error('前5走を取得できませんでした');
      PREV_CACHE[key] = p;
      cb(null, p);
    }).catch(function(e){
      console.error('前5走の取得に失敗:', e);
      cb(e, null);
    });
  }

  /* =========================================================
     選手コメント（winticket ?type=interview）
     SSRで取得できることを実URLで確認済み。
       /autorace/{slug}/racecard/{mid}/{day}/{race}?type=interview
     ========================================================= */
  var CM_CACHE = {};

  /* 選手見出しの形。「1且原朋弥39期 23歳 山陽 B-135」
     ★行全体に一致させる（anchored）ので、本文まで含む親要素は自然に弾かれる。 */
  var CM_HEAD_RE = /^(\d{1,2})\s*(\D+?)\s*(\d+期)\s*(\d+歳)\s*(\S+?)\s*([A-Z]+-\d+)?$/;

  function parseComments(html){
    var doc = new DOMParser().parseFromString(html, 'text/html');
    if(!doc.body) return { updated:'', players:{} };

    var upd = '';
    var um = (doc.body.textContent || '').match(/(\d{4}\/\d{1,2}\/\d{1,2}\s+\d{1,2}:\d{2})\s*更新/);
    if(um) upd = um[1];

    var els = Array.prototype.slice.call(doc.body.getElementsByTagName('*'));  /* 文書順 */
    var norm = function(e){ return (e.textContent || '').replace(/\s+/g, ' ').trim(); };

    /* --- 選手見出しを拾う --- */
    var heads = [];
    for(var i=0;i<els.length;i++){
      var t = norm(els[i]);
      if(t.length > 60) continue;                 /* 明らかに親要素 */
      var m = t.match(CM_HEAD_RE);
      if(!m) continue;
      /* 同じ見出しが入れ子で二重に取れることがあるので、直前と同じ内容なら深い方を残す */
      if(heads.length && heads[heads.length - 1].text === t &&
         heads[heads.length - 1].el.contains(els[i])){
        heads[heads.length - 1] = { el:els[i], idx:i, text:t, m:m };
        continue;
      }
      heads.push({ el:els[i], idx:i, text:t, m:m });
    }
    if(!heads.length) return { updated:upd, players:{} };

    /* --- コメント欄全体を囲む要素を求める（最後の選手の範囲を閉じるため）---
       これが無いと最後の選手の本文にフッターまで混ざる。 */
    var box = heads[0].el.parentElement;
    var last = heads[heads.length - 1].el;
    var guard = 0;
    while(box && !box.contains(last) && guard++ < 20) box = box.parentElement;
    if(!box) box = doc.body;

    /* --- 本文の候補（葉要素のみ）を文書順で --- */
    var leaves = [];
    var inner = box.getElementsByTagName('*');
    for(var k=0;k<inner.length;k++){
      var e = inner[k];
      if(e.children.length) continue;             /* 葉だけ */
      var tx = norm(e);
      if(!tx) continue;
      /* ★葉の tagName で判定すると、h4 の中が span のときに見出しを取り逃す。
         祖先に見出し要素があるかで判定する（closest を使う）。 */
      var hd = e.closest ? e.closest('h1,h2,h3,h4,h5,h6,dt') : null;
      leaves.push({ el:e, tag:(hd ? hd.tagName : e.tagName), isHead:!!hd, text:tx, headEl:hd });
    }

    var out = {};
    for(var hi=0; hi<heads.length; hi++){
      var head = heads[hi], nextEl = (hi + 1 < heads.length) ? heads[hi + 1].el : null;
      var mm = head.m;
      var rec = { no:Number(mm[1]), name:(mm[2] || '').trim(), ki:mm[3], age:mm[4],
                  belong:mm[5], rank:mm[6] || '', items:[] };

      var started = false, label = '';
      for(var li=0; li<leaves.length; li++){
        var lf = leaves[li];
        if(!started){
          /* 見出しを通過するまで読み飛ばす */
          if(head.el === lf.el || head.el.contains(lf.el)){ started = true; }
          continue;
        }
        if(nextEl && (nextEl === lf.el || nextEl.contains(lf.el))) break;   /* 次の選手へ */
        if(head.el.contains(lf.el)) continue;      /* 見出し自身の中身 */

        if(lf.isHead){
          label = (lf.headEl ? (lf.headEl.textContent || '') : lf.text).replace(/\s+/g,' ').trim();
        }else if(/^選手コメントはありません/.test(lf.text)){
          rec.items.push({ label:'', body:'', none:true });
        }else{
          rec.items.push({ label:label, body:lf.text, none:false });
          label = '';
        }
        continue;
      }
      /* 見出しが葉でない（子要素を持つ）場合、started が立たないことがあるので保険 */
      if(!rec.items.length && !started){
        var after = false;
        for(var li2=0; li2<leaves.length; li2++){
          var lf2 = leaves[li2];
          if(!after){
            if(head.el.compareDocumentPosition(lf2.el) & Node.DOCUMENT_POSITION_FOLLOWING) after = true;
            else continue;
          }
          if(nextEl && (nextEl === lf2.el || nextEl.contains(lf2.el))) break;
          if(head.el.contains(lf2.el)) continue;
          if(lf2.isHead){ label = (lf2.headEl ? (lf2.headEl.textContent || '') : lf2.text).replace(/\s+/g,' ').trim(); }
          else if(/^選手コメントはありません/.test(lf2.text)){ rec.items.push({ label:'', body:'', none:true }); }
          else { rec.items.push({ label:label, body:lf2.text, none:false }); label = ''; }
        }
      }
      out[rec.no] = rec;
    }
    return { updated:upd, players:out };
  }

  function loadComments(slug, mid, dayNum, raceNo, cb){
    var key = slug + '/' + mid + '/' + dayNum + '/' + raceNo;
    if(CM_CACHE[key]){ cb(null, CM_CACHE[key]); return; }
    var target = wtRacecardUrl(slug, mid, dayNum, raceNo) + '?type=interview';
    fetch(PROXY_URL + '?url=' + encodeURIComponent(target)).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function(html){
      var c = parseComments(html);
      if(!Object.keys(c.players).length) throw new Error('選手コメントを取得できませんでした');
      CM_CACHE[key] = c;
      cb(null, c);
    }).catch(function(e){
      console.error('選手コメントの取得に失敗:', e);
      cb(e, null);
    });
  }

  function cmHTML(d, c){
    var h = '<div class="rc-cm">';
    if(c.updated) h += '<div class="rc-cm-upd">' + esc(c.updated) + ' 更新</div>';
    for(var i=0;i<d.racers.length;i++){
      var r = d.racers[i];
      var p = c.players[r.no];
      var meta = p ? [p.ki, p.age, p.belong].filter(Boolean).join(' ')
                   : [r.ki, r.age, r.belong].filter(Boolean).join(' ');
      var rank = (p && p.rank) || r.rank || '';
      h += '<div class="rc-cm-item">' +
             '<div class="rc-cm-head">' + numChip(r.no) +
               '<span class="rc-cm-name">' + esc((p && p.name) || r.name) + '</span>' +
               '<span class="rc-cm-meta">' + esc(meta) + '</span>' +
               (rank ? '<span class="rc-cm-rank">' + esc(rank) + '</span>' : '') +
             '</div>' +
             '<div class="rc-cm-line"></div>';
      var items = (p && p.items) || [];
      if(!items.length){
        h += '<div class="rc-cm-none">選手コメントはありません</div>';
      }else{
        for(var j=0;j<items.length;j++){
          if(items[j].none){
            h += '<div class="rc-cm-none">選手コメントはありません</div>';
          }else{
            h += (items[j].label ? '<div class="rc-cm-label">' + esc(items[j].label) + '</div>' : '') +
                 '<div class="rc-cm-body">' + esc(items[j].body) + '</div>';
          }
        }
      }
      h += '</div>';
    }
    return h + '</div>';
  }

  /* =========================================================
     基本情報タブ
     ウィンチケットの出走表と同じく「1枚の横長テーブル」。
     近90日・近180日は選手1人につき2行（1行目=連対率 / 2行目=着別度数）。
     ========================================================= */
  function shisoInner(r){
    var v = String(r.shiso || '');
    var re = /^再/.test(v);
    return '<span class="rc-hs">' +
      (re ? '<span class="re">' + esc(v) + '</span>' : esc(v)) +
      '<em>' + esc(r.hensa || '') + '</em></span>';
  }

  function tblBasic(d){
    var h =
      '<table class="rc-t"><thead>' +
      '<tr>' +
        '<th class="cno" rowspan="2">車</th>' +
        '<th class="cnm" rowspan="2">選手名</th>' +
        '<th rowspan="2">ハンデ<br>ST</th>' +
        /* 試走Tは直前に更新されるので、見出しセル内に再取得ボタンを置く */
        '<th class="rc-th-shiso gsep cts" rowspan="2"><span class="in">' +
          '<span class="lbl">試走T<br>偏差</span>' +
          '<button class="rc-rfbtn" id="rcRfBtn" type="button" ' +
          'title="試走Tを再取得" aria-label="試走Tを再取得">' +
            '<svg viewBox="0 0 24 24" aria-hidden="true">' +
              '<path d="M20 12a8 8 0 1 1-2.34-5.66" stroke-linecap="round"/>' +
              '<path d="M20 4v5h-5" stroke-linecap="round" stroke-linejoin="round"/>' +
            '</svg></button></span></th>' +
        '<th class="gsep" rowspan="2">審査P<br>現ランク(前)</th>' +
        '<th class="gsep" colspan="4">前10走</th>' +
        '<th class="gsep" colspan="3">良10走</th>' +
        '<th class="gsep" colspan="2">近90日成績</th>' +
        '<th class="gsep" colspan="2">近180日成績(良)</th>' +
        '<th class="gsep" colspan="2">近180日成績(湿)</th>' +
        '<th class="gsep" rowspan="2">優出<br>今年V/通算V</th>' +
        '<th class="gsep" rowspan="2">車名(車級)</th>' +
      '</tr>' +
      '<tr>' +
        '<th class="gsep">1</th><th>2</th><th>3</th><th>外</th>' +
        '<th class="gsep">平均<br>試走T</th><th>平均<br>競走T</th><th>最高<br>競走T</th>' +
        '<th class="gsep">2連対率</th><th>3連対率</th>' +
        '<th class="gsep">2連対率</th><th>3連対率</th>' +
        '<th class="gsep">2連対率</th><th>3連対率</th>' +
      '</tr>' +
      '</thead><tbody>';

    for(var i=0;i<d.racers.length;i++){
      var r = d.racers[i];
      /* 選手名の直下は「期別 年齢 所属」。ハンデ/ST は独立列（ウィンチケット準拠） */
      var kia = [r.ki, r.age, r.belong].filter(Boolean).join(' ');
      /* 偶数車は行背景を薄グレーに（1選手＝2行なので両方に付ける） */
      var alt = (r.no % 2 === 0) ? ' alt' : '';
      h += '<tr class="rowA' + alt + '">' +
        '<td class="cno" rowspan="2">' + numChip(r.no) + '</td>' +
        '<td class="cnm" rowspan="2"><div class="rc-nm">' + esc(r.name) + '</div>' +
          (kia ? '<div class="rc-sub">' + esc(kia) + '</div>' : '') + '</td>' +
        '<td rowspan="2"><span class="rc-hs">' + esc(r.handi) +
          '<em>' + esc(r.st) + '</em></span></td>' +
        '<td class="rc-shiso gsep cts" data-no="' + r.no + '" data-v="' + esc(r.shiso + '|' + r.hensa) +
          '" rowspan="2">' + shisoInner(r) + '</td>' +
        '<td class="gsep" rowspan="2"><span class="rc-rank">' + esc(r.p) + '<em>' + esc(r.rank) +
          (r.prev ? '(' + esc(r.prev) + ')' : '') + '</em></span></td>' +
        '<td class="rc-pct gsep" rowspan="2">' + esc(r.z10[0]) + '</td>' +
        '<td class="rc-pct" rowspan="2">' + esc(r.z10[1]) + '</td>' +
        '<td class="rc-pct" rowspan="2">' + esc(r.z10[2]) + '</td>' +
        '<td class="rc-pct" rowspan="2">' + esc(r.z10[3]) + '</td>' +
        '<td class="rc-pct gsep" rowspan="2">' + esc(r.avgS) + '</td>' +
        '<td class="rc-pct" rowspan="2">' + esc(r.avgR) + '</td>' +
        '<td class="rc-pct" rowspan="2">' + esc(r.bestR) + '</td>' +
        '<td class="rc-pct gsep r2a">' + esc(r.d90[0]) + '</td><td class="rc-pct r2a">' + esc(r.d90[1]) + '</td>' +
        '<td class="rc-pct gsep r2a">' + esc(r.dG[0])  + '</td><td class="rc-pct r2a">' + esc(r.dG[1])  + '</td>' +
        '<td class="rc-pct gsep r2a">' + esc(r.dW[0])  + '</td><td class="rc-pct r2a">' + esc(r.dW[1])  + '</td>' +
        '<td class="rc-pct gsep" rowspan="2">' + esc(r.yu) +
          (r.v ? '<br><span class="rc-cnt">' + esc(r.v) + '</span>' : '') + '</td>' +
        '<td class="rc-car gsep" rowspan="2">' + esc(r.car) +
          (r.cc ? '<br><em>(' + esc(r.cc) + ')</em>' : '') + '</td>' +
      '</tr>' +
      '<tr class="rowB' + alt + '">' +
        '<td class="rc-cnt gsep r2b" colspan="2">' + esc(r.d90[2]) + '</td>' +
        '<td class="rc-cnt gsep r2b" colspan="2">' + esc(r.dG[2])  + '</td>' +
        '<td class="rc-cnt gsep r2b" colspan="2">' + esc(r.dW[2])  + '</td>' +
      '</tr>';
    }
    return h + '</tbody></table>';
  }

  /* =========================================================
     前5走詳細タブ ＝ 前走〜5走前
     ========================================================= */
  /* ★取得元（oddspark レース別出走表）が持っているのは5走ぶん。
     それ以上は埋められないので、タブ名も「前5走詳細」に揃えてある。
     走数を増やす場合は取得元の追加が先。 */
  var PREV_LABEL = ['前走','前々走','3走前','4走前','5走前'];
  var PREV_N = PREV_LABEL.length;

  function condClass(c){
    if(c === '良') return 'ryo';
    if(c === '湿') return 'shitsu';
    return 'other';
  }
  function histCell(x){
    if(!x) return '<span class="rc-h none">—</span>';
    var rkCls = '';
    if(x.rank === 1) rkCls = ' p1'; else if(x.rank === 2) rkCls = ' p2'; else if(x.rank === 3) rkCls = ' p3';
    var rkTxt = x.ng ? x.ng : (x.rank ? x.rank + '着' : '—');
    return '<span class="rc-h">' +
      '<span class="d">' + esc(x.date) + ' ' + esc(x.place) + esc(x.race) + 'R</span>' +
      '<span class="m">' +
        (x.cond ? '<span class="cond ' + condClass(x.cond) + '">' + esc(x.cond) + '</span>' : '') +
        (x.handi ? '<span class="hd">' + esc(x.handi) + '</span>' : '') +
        '<span class="rk' + rkCls + '">' + esc(rkTxt) + '</span>' +
      '</span>' +
      '<span class="m t">' + esc(x.rt) +
        (x.tt ? '<em>' + esc(x.tt) + '</em>' : '') +
        (x.st ? '<em>ST' + esc(x.st) + '</em>' : '') +
      '</span>' +
    '</span>';
  }

  function tblPrev(d, prev){
    var h = '<table class="rc-t"><thead><tr>' +
      '<th class="cno">車</th><th class="cnm">選手名</th>';
    for(var k=0;k<PREV_LABEL.length;k++) h += '<th>' + PREV_LABEL[k] + '</th>';
    h += '</tr></thead><tbody>';

    for(var i=0;i<d.racers.length;i++){
      var r = d.racers[i];
      var list = (prev && prev[r.no]) || [];
      /* 選手名の直下は基本情報タブと同じ「期別 年齢 所属」 */
      var kia = [r.ki, r.age, r.belong].filter(Boolean).join(' ');
      h += '<tr class="' + (r.no % 2 === 0 ? 'alt' : '') + '">' +
        '<td class="cno">' + numChip(r.no) + '</td>' +
        '<td class="cnm"><div class="rc-nm">' + esc(r.name) + '</div>' +
          (kia ? '<div class="rc-sub">' + esc(kia) + '</div>' : '') + '</td>';
      for(var j=0;j<PREV_N;j++) h += '<td class="rc-hcell">' + histCell(list[j]) + '</td>';
      h += '</tr>';
    }
    return h + '</tbody></table>';
  }

  /* 車番チップ（出走表・オッズ・結果で共用）
     ★開催カード側とは別系統。カードCSSの差し替えで巻き添えにしないこと（12節 #5 と同じ轍） */
  function numChip(no){
    var c = NUMCOL[no] || ['#333','#fff'];
    return '<span class="rc-num' + (no === 1 ? ' n1' : '') +
           '" style="background:' + c[0] + ';color:' + c[1] + '">' + no + '</span>';
  }

  /* ---------- オッズ ---------- */
  function oddsOne(n, head){
    var h = '<table class="rc-o simple"><thead><tr><th>車</th><th>' + head + '</th></tr></thead><tbody>';
    for(var i=1;i<=n;i++){
      h += '<tr><th>' + numChip(i) + '</th><td><span class="od">-</span></td></tr>';
    }
    return h + '</tbody></table>';
  }
  function oddsMatrix(n, mode){
    var h = '<table class="rc-o"><thead><tr><th></th>';
    for(var c=1;c<=n;c++) h += '<th>' + c + '</th>';
    h += '</tr></thead><tbody>';
    for(var r=1;r<=n;r++){
      h += '<tr><th>' + r + '</th>';
      for(var c2=1;c2<=n;c2++){
        var ok = (mode === 'perm') ? (r !== c2) : (r < c2);
        h += ok ? '<td><span class="od">-</span></td>' : '<td class="na"></td>';
      }
      h += '</tr>';
    }
    return h + '</tbody></table>';
  }
  function oddsTri(n, axis, kind){
    var h = '<table class="rc-o"><thead><tr><th></th>';
    for(var c=1;c<=n;c++) h += '<th>' + c + '</th>';
    h += '</tr></thead><tbody>';
    for(var r=1;r<=n;r++){
      h += '<tr><th>' + r + '</th>';
      for(var c2=1;c2<=n;c2++){
        /* 3連単は順列（軸=1着）、3連複は 軸<2番目<3番目 の組合せ */
        var ok = (kind === 't3')
          ? (r !== axis && c2 !== axis && r !== c2)
          : (axis < r && r < c2);
        h += ok ? '<td><span class="od">-</span></td>' : '<td class="na"></td>';
      }
      h += '</tr>';
    }
    return h + '</tbody></table>';
  }
  function axisBar(n, axis, kind){
    /* 3連複は「軸 < 2番目 < 3番目」の最小番号なので、n-2 までしか成立しない */
    var last = (kind === 't3') ? n : Math.max(1, n - 2);
    var h = '<div class="rc-axis" id="rcAxis"><span class="lb">' +
            (kind === 't3' ? '1着' : '軸') + '</span>';
    for(var i=1;i<=last;i++){
      h += '<button class="rc-ax' + (i === axis ? ' on' : '') + '" type="button" data-ax="' + i + '">' + i + '</button>';
    }
    return h + '</div>';
  }
  function oddsHTML(n){
    var b = betOf(curBet), i;
    var h = '<div class="rc-bets" id="rcBets">';
    for(i=0;i<BETS.length;i++){
      h += '<button class="rc-bet' + (BETS[i].k === curBet ? ' on' : '') +
           '" type="button" data-bet="' + BETS[i].k + '">' + BETS[i].n + '</button>';
    }
    h += '</div>';

    if(b.type === 'one'){
      h += '<div class="rc-scroll">' + oddsOne(n, b.n + 'オッズ') + '</div>';
    }else if(b.type === 'tri'){
      if(curAxis > n) curAxis = 1;
      h += axisBar(n, curAxis, b.k) + '<div class="rc-scroll">' + oddsTri(n, curAxis, b.k) + '</div>';
    }else{
      h += '<div class="rc-scroll">' + oddsMatrix(n, b.type) + '</div>';
    }
    return h + noteHTML('オッズ');
  }

  /* ---------- 画面描画 ---------- */
  var curKey = '';

  /* 上部固定ゾーン：会場+R / 種別・日目・グレード / 発走・締切 / 区切り線 */
  function paintTitle(slug, d, mt, raceNo){
    var v = VENUE[slug] || { jp:slug, roma:slug.toUpperCase() };
    var el = $('rcTitle');
    if(!el) return;

    var day   = (mt && mt.day)   || '';
    var grade = (d && d.grade)   || (mt && mt.grade)   || '';
    var sess  = (d && d.session) || (mt && mt.session) || '';
    var cls   = (d && d.cls)     || '';

    var h = '<div class="rc-ttl-row">' +
      '<span class="rc-vr">' + esc(v.jp) + '<span class="rn">' + esc(raceNo) + 'R</span></span>' +
      (cls   ? '<span class="rc-cls">' + esc(cls) + '</span>' : '') +
      (day   ? '<span class="gc-b grade">' + esc(day) + '</span>' : '') +
      (grade ? '<span class="gc-b grade">' + esc(grade) + '</span>' : '') +
      (sess  ? '<span class="gc-b ' + sessionClass(sess) + '">' + esc(sess) + '</span>' : '') +
      '</div>';

    var start = (d && d.start) || (mt && mt.start) || '';
    var ci = closeInfo(start);
    var closeTxt = (d && d.close) || (ci ? ci.text : '');
    if(start || closeTxt){
      h += '<div class="rc-times">' +
        (start ? '<span><span class="lb">発走</span>' + esc(start) + '</span>' : '') +
        (closeTxt ? '<span class="close' + (ci ? (ci.ended ? ' ended' : (ci.near ? ' near' : '')) : '') + '">' +
                    '<span class="lb">締切</span>' + esc(closeTxt) +
                    (ci && ci.near ? '（あと' + ci.rest + '分）' : '') + '</span>' : '') +
        '</div>';
    }
    h += '<div class="rc-fixline"></div>';
    el.innerHTML = h;
  }

  /* 固定ゾーンの下（スクロールする情報帯）：カップ名 / 日付・走路 */
  function paintHead(slug, d, mt, raceNo){
    var head = $('rcHead');
    if(!head) return;
    var h = '';
    if(d && d.title) h += '<div class="rc-cupname">' + esc(d.title) + '</div>';
    if(d && (d.date || d.dist)){
      h += '<div class="rc-dist">' + esc(d.date) +
           (d.dist ? '　' + esc(d.dist) : '') +
           (d.laps ? '（' + esc(d.laps) + '）' : '') + '</div>';
    }
    h += condLine(d);
    /* 試走T更新の結果表示 */
    h += '<div class="rc-rfstat" id="rcRfAt"></div>';
    head.innerHTML = h;
  }

  /* レースセレクター
     Brain app.html の .rt-race-btn を踏襲：番号 / 締切 / レース種別 の3段。
     ★締切は oddspark の1日出走表（DAY_CACHE）から全レース分を出す。
       winticket 単体では他レースの発走時刻が取れないため。 */
  function paintChips(slug, mid, dayNum, raceNo, d, mt){
    var rnav = $('rcRnav');
    var day = (d && d.ymd) ? DAY_CACHE[slug + '/' + d.ymd] : null;
    var races = (day && Object.keys(day).length) ? 0 : ((d && d.races) || (mt && mt.races) || 12);
    if(day){ for(var k in day){ if(day.hasOwnProperty(k) && Number(k) > races) races = Number(k); } }
    var navCls = (d && d.raceClasses) || {};

    var html = '<div class="rc-rnav-inner">';
    for(var n=1;n<=races;n++){
      var info = day ? day[n] : null;
      var cls = (info && info.cls) || navCls[n] ||
                ((d && Number(raceNo) === n) ? d.cls : '') || '';

      /* 締切：1日出走表の発走時刻から。無ければ表示中レースの締切を使う */
      var ci = info ? closeInfo(info.start) : null;
      if(!ci && d && Number(raceNo) === n && d.close){
        var c2 = CARD_CACHE[slug + '/' + mid + '/' + dayNum + '/' + n];
        if(c2 && c2.start) ci = closeInfo(c2.start);
      }

      var dlText = '', dlCls = '';
      if(ci){
        if(ci.ended){ dlText = '終了'; dlCls = 'ended'; }
        else if(ci.near){ dlText = '締切' + ci.rest + '分前'; dlCls = 'countdown'; }
        else { dlText = '締切' + ci.text; }
      }

      html += '<button class="rc-rbtn' + (n === Number(raceNo) ? ' on' : '') +
              '" type="button" data-r="' + n + '">' +
                '<span class="rc-rbtn-num">' + n + 'R</span>' +
                (dlText ? '<span class="rc-rbtn-dl ' + dlCls + '">' + esc(dlText) + '</span>' : '') +
                (cls ? '<span class="rc-rbtn-cls">' + esc(cls) + '</span>' : '') +
              '</button>';
    }
    rnav.innerHTML = html + '</div>';

    rnav.onclick = function(e){
      var b = e.target.closest ? e.target.closest('.rc-rbtn') : null;
      if(!b) return;
      go(slug, mid, dayNum, b.getAttribute('data-r'), curTop);
    };
    var on = rnav.querySelector('.rc-rbtn.on');
    if(on && on.scrollIntoView) on.scrollIntoView({ block:'nearest', inline:'center' });
  }

  function paintTabs(slug, mid, dayNum, raceNo, hasCard){
    var tabs = $('rcTabs'), top = $('rcTop');
    var tt = top.querySelectorAll('.rc-ttab'), i;
    for(i=0;i<tt.length;i++) tt[i].classList.toggle('on', tt[i].getAttribute('data-top') === curTop);
    top.onclick = function(e){
      var b = e.target.closest ? e.target.closest('.rc-ttab') : null;
      if(!b) return;
      go(slug, mid, dayNum, raceNo, b.getAttribute('data-top'));
    };

    tabs.hidden = !(curTop === 'card' && hasCard);
    var tb = tabs.querySelectorAll('.rc-tab');
    for(i=0;i<tb.length;i++) tb[i].classList.toggle('on', tb[i].getAttribute('data-tab') === curTab);
    tabs.onclick = function(e){
      var b = e.target.closest ? e.target.closest('.rc-tab') : null;
      if(!b) return;
      curTab = b.getAttribute('data-tab');
      renderRace(slug, mid, dayNum, raceNo);
    };
  }

  /* 天候・気温・湿度・走路。カードではなく発走/日付と同じ横並びテキストで出す */
  function condLine(d){
    if(!d) return '';
    var parts = [];
    if(d.weather) parts.push('<span>' + esc(d.weather) + '</span>');
    if(d.temp)    parts.push('<span><span class="lb">気温</span>' + esc(d.temp) + '</span>');
    if(d.humid)   parts.push('<span><span class="lb">湿度</span>' + esc(d.humid) + '</span>');
    if(d.track)   parts.push('<span><span class="lb">走路</span>' + esc(d.track) +
                             (d.trackTemp ? ' / ' + esc(d.trackTemp) : '') + '</span>');
    if(!parts.length) return '';
    return '<div class="rc-cond-line">' + parts.join('') + '</div>';
  }

  function renderRace(slug, mid, dayNum, raceNo){
    var key = slug + '/' + mid + '/' + dayNum + '/' + raceNo;
    curKey = key;
    var body = $('rcBody');

    var mt = null;
    for(var i=0;i<MEETINGS.length;i++){
      if(MEETINGS[i].meetingId === mid && String(MEETINGS[i].dayNum) === String(dayNum)) mt = MEETINGS[i];
    }

    var cached = CARD_CACHE[key];
    paintTitle(slug, cached, mt, raceNo);
    paintHead(slug, cached, mt, raceNo);
    paintChips(slug, mid, dayNum, raceNo, cached, mt);
    paintTabs(slug, mid, dayNum, raceNo, !!cached);

    if(cached){
      paintBody(slug, mid, dayNum, raceNo, cached);
      ensureOneDay(slug, mid, dayNum, raceNo, cached, mt);
      return;
    }

    /* 読み込み中 */
    body.innerHTML = '<div class="g1-load" style="padding:14px 16px 0">' +
      '<div class="g1-skel" style="height:44px"></div>' +
      '<div class="g1-skel" style="height:200px;opacity:.7"></div></div>';

    loadRace(slug, mid, dayNum, raceNo, function(err, d){
      if(curKey !== key) return;   /* 表示が切り替わっていたら破棄 */
      if(err){
        $('rcBody').innerHTML =
          '<div class="rc-empty"><div class="t">ERROR</div>' +
          '<p>出走表を取得できませんでした。<br>通信状況を確認して再度お試しください。</p>' +
          '<button class="g1-retry" id="rcRetry" type="button">再読み込み</button></div>';
        var rb = $('rcRetry');
        if(rb) rb.addEventListener('click', function(){ renderRace(slug, mid, dayNum, raceNo); });
        return;
      }
      paintTitle(slug, d, mt, raceNo);
      paintHead(slug, d, mt, raceNo);
      paintChips(slug, mid, dayNum, raceNo, d, mt);
      paintTabs(slug, mid, dayNum, raceNo, true);
      paintBody(slug, mid, dayNum, raceNo, d);
      ensureOneDay(slug, mid, dayNum, raceNo, d, mt);
    });
  }

  /* =========================================================
     試走T の再取得
     テーブル全体を描き直さず、試走T/偏差のセルだけ差し替える。
     横スクロール位置と前後のタブ状態を保つのが目的。
     ========================================================= */
  function pad2(n){ return ('0' + n).slice(-2); }

  /* ★DOMのdisabledだけに頼らない。実行中にタブを切り替えるとボタンが
     再生成されて disabled が失われ、二重に走り得るため専用フラグで守る。 */
  var shisoBusy = false;

  function refreshShiso(slug, mid, dayNum, raceNo){
    if(shisoBusy) return;
    var btn = $('rcRfBtn'), at = $('rcRfAt');
    if(!btn || btn.disabled) return;
    var key = slug + '/' + mid + '/' + dayNum + '/' + raceNo;

    shisoBusy = true;
    btn.disabled = true;
    btn.classList.add('loading');
    if(at) at.textContent = '取得中…';

    /* ★キャッシュを必ず外す。試走Tは直前に更新されるので、
       古い応答を掴むとこの機能自体が意味を失う。 */
    var target = wtRacecardUrl(slug, mid, dayNum, raceNo);
    var u = PROXY_URL + '?url=' + encodeURIComponent(target) + '&_=' + Date.now();

    fetch(u, { cache:'no-store' }).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function(html){
      var d2 = parseRacecard(html, slug, mid, dayNum, raceNo);
      CARD_CACHE[key] = d2;

      /* 表示中のレースが変わっていたら反映しない */
      if(curKey !== key){ return; }

      var changed = 0;
      for(var i=0;i<d2.racers.length;i++){
        var r2 = d2.racers[i];
        var cell = document.querySelector('td.rc-shiso[data-no="' + r2.no + '"]');
        if(!cell) continue;
        var nv = (r2.shiso || '') + '|' + (r2.hensa || '');
        var ov = cell.getAttribute('data-v') || '';
        cell.innerHTML = shisoInner(r2);
        cell.setAttribute('data-v', nv);
        if(ov && ov !== nv){
          changed++;
          cell.classList.remove('flash');
          void cell.offsetWidth;          /* アニメを確実に再生させる */
          cell.classList.add('flash');
        }
      }

      /* 試走と同じタイミングで走路・気温も動くのでヘッダも更新する */
      var mt = null;
      for(var m2=0;m2<MEETINGS.length;m2++){
        if(MEETINGS[m2].meetingId === mid && String(MEETINGS[m2].dayNum) === String(dayNum)) mt = MEETINGS[m2];
      }
      paintTitle(slug, d2, mt, raceNo);
      paintHead(slug, d2, mt, raceNo);

      var now = new Date();
      var t = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
      var el = $('rcRfAt');
      if(el){
        el.innerHTML = changed
          ? '<b>' + changed + '件更新</b>　' + t + ' 時点'
          : '変更なし　' + t + ' 時点';
      }
    }).catch(function(e){
      console.error('試走Tの再取得に失敗:', e);
      var el2 = $('rcRfAt');
      if(el2) el2.innerHTML = '<i>取得失敗</i>　もう一度お試しください';
    }).then(function(){
      shisoBusy = false;
      var b2 = $('rcRfBtn');
      if(b2){ b2.disabled = false; b2.classList.remove('loading'); }
    });
  }

  /* 全レースの締切をセレクターに出すため、1日出走表を1回だけ取得して描き直す */
  function ensureOneDay(slug, mid, dayNum, raceNo, d, mt){
    if(!d || !d.ymd) return;
    var key = slug + '/' + d.ymd;
    if(DAY_CACHE[key] || DAY_PENDING[key]) return;   /* 取得済み・取得中なら何もしない */
    var myKey = curKey;
    loadOneDay(slug, d.ymd, function(err){
      if(err) return;                    /* 失敗しても表示中レースの締切は出ているので黙って諦める */
      if(curKey !== myKey) return;
      paintChips(slug, mid, dayNum, raceNo, d, mt);
    });
  }

  function paintBody(slug, mid, dayNum, raceNo, d){
    var body = $('rcBody');
    var key = slug + '/' + mid + '/' + dayNum + '/' + raceNo;
    if(curTop === 'card'){
      if(curTab === 'basic'){
        body.innerHTML = '<div class="rc-scroll">' + tblBasic(d) + '</div>';
        var rf = $('rcRfBtn');
        if(rf) rf.addEventListener('click', function(){
          refreshShiso(slug, mid, dayNum, raceNo);
        });
      }else if(curTab === 'comment'){
        /* 選手コメント。開いたときだけ取得する */
        var ck = slug + '/' + mid + '/' + dayNum + '/' + raceNo;
        if(CM_CACHE[ck]){
          body.innerHTML = cmHTML(d, CM_CACHE[ck]);
        }else{
          body.innerHTML = '<div class="g1-load" style="padding:14px 16px 0">' +
            '<div class="g1-skel" style="height:150px"></div></div>';
          loadComments(slug, mid, dayNum, raceNo, function(err, c){
            if(curKey !== key || curTop !== 'card' || curTab !== 'comment') return;
            if(err){
              $('rcBody').innerHTML =
                '<div class="rc-empty"><div class="t">ERROR</div>' +
                '<p>選手コメントを取得できませんでした。<br>通信状況を確認して再度お試しください。</p>' +
                '<button class="g1-retry" id="cmRetry" type="button">再読み込み</button></div>';
              var cb2 = $('cmRetry');
              if(cb2) cb2.addEventListener('click', function(){ paintBody(slug, mid, dayNum, raceNo, d); });
              return;
            }
            $('rcBody').innerHTML = cmHTML(d, c);
          });
        }
      }else{
        /* 前5走詳細はオッズパークから別途取得する（開いたときだけ） */
        var pk = slug + '/' + d.ymd + '/' + raceNo;
        var cachedP = PREV_CACHE[pk];
        if(cachedP){
          body.innerHTML = '<div class="rc-scroll">' + tblPrev(d, cachedP) + '</div>';
        }else{
          body.innerHTML = '<div class="g1-load" style="padding:14px 16px 0">' +
            '<div class="g1-skel" style="height:200px"></div></div>';
          loadPrev5(slug, d.ymd, raceNo, function(err, p){
            /* 応答が返るまでに表示中のレース・タブが変わっていたら破棄する */
            if(curKey !== key || curTop !== 'card' || curTab !== 'detail') return;
            if(err){
              $('rcBody').innerHTML =
                '<div class="rc-empty"><div class="t">ERROR</div>' +
                '<p>前走成績を取得できませんでした。<br>通信状況を確認して再度お試しください。</p>' +
                '<button class="g1-retry" id="pvRetry" type="button">再読み込み</button></div>';
              var pb = $('pvRetry');
              if(pb) pb.addEventListener('click', function(){ paintBody(slug, mid, dayNum, raceNo, d); });
              return;
            }
            $('rcBody').innerHTML = '<div class="rc-scroll">' + tblPrev(d, p) + '</div>';
          });
        }
      }
    }else if(curTop === 'odds'){
      body.innerHTML = oddsHTML(d.racers.length);
      var bets = $('rcBets');
      if(bets) bets.onclick = function(e){
        var b = e.target.closest ? e.target.closest('.rc-bet') : null;
        if(!b) return;
        curBet = b.getAttribute('data-bet'); curAxis = 1;
        renderRace(slug, mid, dayNum, raceNo);
      };
      var ax = $('rcAxis');
      if(ax) ax.onclick = function(e){
        var b = e.target.closest ? e.target.closest('.rc-ax') : null;
        if(!b) return;
        curAxis = Number(b.getAttribute('data-ax'));
        renderRace(slug, mid, dayNum, raceNo);
      };
    }else{
      body.innerHTML = noteHTML('着順・払戻');
    }
  }

  function go(slug, mid, dayNum, raceNo, tab){
    location.hash = '#/race/' + slug + '/' + mid + '/' + dayNum + '/' + raceNo +
                    (tab && tab !== 'card' ? '/' + tab : '');
  }

  /* =========================================================
     ルーター（ハッシュ方式。静的ホスティングで直リンクが壊れない）
     ========================================================= */
  var vHome = $('viewHome'), vRace = $('viewRace');

  function showHome(){
    vRace.classList.remove('shown');
    vRace.hidden = true;
    vHome.hidden = false;
    vHome.classList.remove('leaving');
    window.scrollTo(0, 0);
    /* 出走表表示中にリサイズされていた場合、ステージが0幅で計測されている
       可能性があるためスパークル側に再計測を促す */
    try{ window.dispatchEvent(new Event('resize')); }catch(e){}

    /* タップ演出で退避したカードを元に戻す。
       これを忘れるとホームに戻ったとき他カードが消えたままになる */
    var cs = document.querySelectorAll('.g1-card');
    for(var i=0;i<cs.length;i++){
      cs[i].classList.remove('slide-out','shimmer','tapped');
    }
    isTransitioning = false;

    /* ★ホームへ戻るたびに開催一覧を取り直す。
       出走表を見ている間に締切を過ぎて次レースへ繰り上がっていることがあるため。
       初回描画前（MEETINGS空）はここでは走らせない（起動時の loadMeetings に任せる）。 */
    if(MEETINGS.length) loadMeetings(true);
  }
  function showRace(parts){
    vHome.hidden = true;
    vRace.hidden = false;
    window.scrollTo(0, 0);
    renderRace(parts[0], parts[1], parts[2], parts[3]);
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ vRace.classList.add('shown'); });
    });
  }
  function route(){
    var h = location.hash || '';
    var m = h.match(/^#\/race\/([^/]+)\/([^/]+)\/([^/]+)\/([^/]+)(?:\/(card|odds|result))?$/);
    if(m){
      curTop = m[5] || 'card';
      showRace([m[1], m[2], m[3], m[4]]);
    }else{
      showHome();
    }
  }

  var back = $('rcBack');
  if(back) back.addEventListener('click', function(){
    /* ラベルが「開催一覧」なので必ずホームへ戻す。
       history.back() だとレース番号を切り替えた後に前のレースへ戻ってしまう */
    location.hash = '#/';
  });

  /* カードのタップ（イベント委譲。カードは再描画されるため） */
  var cardBox = $('g1Cards');
  if(cardBox) cardBox.addEventListener('click', function(e){
    var c = e.target.closest ? e.target.closest('.g1-card') : null;
    if(c) selectMeeting(c, e);
  });

  /* 画面に復帰したときも取り直す（バックグラウンドで時間が進んでいるため） */
  document.addEventListener('visibilitychange', function(){
    if(document.hidden) return;
    if(location.hash && location.hash.indexOf('#/race/') === 0) return;
    if(MEETINGS.length) loadMeetings(true);
  });

  window.addEventListener('hashchange', route);
  route();
  loadMeetings();
})();
</script>

</body>
</html>
