<style>
  :root{
    /* ===== GO1 カラーテーマ（ヘッダー画像から抽出：黒・金・白） ===== */
    --bg:#000000;
    --gold-br:#ffdb5b;          /* 画像内の最も明るい金 */
    --gold-lt:#f3e3b8;          /* 淡金（白寄り） */
    --gold:#d9b45f;             /* 基準金 */
    --gold-dp:#8c6a2f;          /* 深金 */
    --wht:#ffffff;
    --txt:rgba(255,255,255,.92);
    --sub:rgba(255,255,255,.5);
    --faint:rgba(255,255,255,.3);
    --line:rgba(217,180,95,.16); /* 金を含んだヘアライン */
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{background:var(--bg);}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:'Noto Sans JP',sans-serif;
    min-height:100vh;
    overflow-x:clip;              /* スライドイン待機位置による横スクロールを抑止 */
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  #page{display:flex;flex-direction:column;min-height:100vh;}

  /* ===== ステージ（ヘッダー画像＋見出し＋スパークル層の共通座標系） ===== */
  .g1-stage{position:relative;background:var(--bg);}

  /* ===== ヘッダー画像（フェードイン） ===== */
  .g1-header{
    display:flex;justify-content:center;
    padding:max(6px, env(safe-area-inset-top)) 0 0;
  }
  .g1-header img{
    display:block;
    width:100%;max-width:860px;height:auto;
    opacity:0;
    transform:scale(1.012);
    transition:opacity 1.1s ease, transform 1.4s cubic-bezier(.22,1,.36,1);
  }
  .g1-stage.loaded .g1-header img{opacity:1;transform:none;}

  /* ===== スパークル層（ヘッダー画像より前面。画像の明部を発生源に降下） ===== */
  .g1-sparkle{
    position:absolute;left:0;top:0;
    width:100%;height:100%;
    z-index:3;
    pointer-events:none;
    opacity:0;
    transition:opacity 1.8s ease .4s;
  }
  .g1-stage.loaded .g1-sparkle{opacity:1;}

  /* ヘッダー画像と見出しの間隔（画像側へ寄せる） */
  .g1-gap{min-height:clamp(10px,4.4vh,40px);}

  /* ===== 見出し（スクロールで右から2段時間差スライドイン） ===== */
  .g1-hero{
    position:relative;z-index:2;
    padding:0 16px;
    overflow:hidden;              /* 待機位置のはみ出しをクリップ */
  }
  .g1-line{
    opacity:0;
    transform:translate3d(72px,0,0);
    transition:opacity .82s cubic-bezier(.22,1,.36,1),
               transform .95s cubic-bezier(.22,1,.36,1);
    will-change:opacity,transform;
  }
  /* ★1段目だけスクロール非依存。読み込み後に少し置いて自動フェードイン
     （スライドはしない）。2・3段目は従来どおりスクロールで右からスライドイン。 */
  .g1-l1{
    opacity:0;transform:none;
    transition:opacity 1.25s ease;
    will-change:opacity;
  }
  .g1-l1.shown{opacity:1;}
  .g1-hero.in .g1-l2{opacity:1;transform:none;transition-delay:.14s;}
  .g1-hero.in .g1-l3{opacity:1;transform:none;transition-delay:.6s;}

  .g1-l1{
    font-family:'Noto Sans JP',sans-serif;
    font-weight:900;
    font-size:clamp(24px,8.2vw,54px);
    line-height:1.26;
    letter-spacing:.01em;
    color:var(--wht);
  }
  .g1-l1 .mk{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:.02em;
    padding-right:.12em;
    background:linear-gradient(100deg,var(--gold-dp) 0%,var(--gold) 34%,var(--gold-br) 62%,var(--gold-lt) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
  }
  .g1-l2{
    margin-top:clamp(24px,6.8vw,42px);
    font-family:'Oswald',sans-serif;
    font-weight:400;
    font-size:clamp(21px,6.4vw,36px);
    letter-spacing:.26em;
    background:linear-gradient(90deg,var(--gold) 0%,var(--gold-br) 46%,var(--gold-lt) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
  }

  /* 3段目：構築中の注記。1〜2段目と同じ .g1-line で文字群ごとスライドインさせる */
  .g1-l3{
    margin-top:clamp(20px,5.6vw,34px);
    font-family:'Noto Sans JP',sans-serif;
    font-weight:400;
    font-size:clamp(14px,4.3vw,21px);
    line-height:1.95;
    letter-spacing:.04em;
    color:rgba(255,255,255,.52);
  }

  /* 今後のメインコンテンツ用の余白（見出しの下に確保） */
  .g1-slot{min-height:0;}

  .g1-main{flex:1;background:var(--bg);}

  /* ===== フッター（result.html db-footer をGO1配色で流用） ===== */
  .db-footer{
    background:var(--bg);
    border-top:1px solid var(--line);
    padding:22px 20px;
    padding-bottom:max(26px, env(safe-area-inset-bottom));
  }
  .db-footer .brand{
    text-align:center;
    font-family:'Oswald',sans-serif;font-size:15px;font-weight:400;
    letter-spacing:.06em;color:rgba(255,255,255,.78);
    margin-bottom:7px;padding-left:.06em;
  }
  .db-footer .brand::after{
    content:'';display:block;width:34px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--gold-dp) 0%,var(--gold) 46%,var(--gold-br) 78%,var(--gold-lt) 100%);
    margin:8px auto 0;opacity:.95;
  }
  .db-divider{height:1px;background:rgba(217,180,95,.14);margin:0 0 16px;}

  .db-nav{
    display:flex;justify-content:center;align-items:center;
    gap:20px;margin-bottom:16px;
  }
  .db-nav a{
    display:inline-flex;align-items:center;gap:6px;
    font-family:'Oswald',sans-serif;font-size:13px;font-weight:400;letter-spacing:.05em;
    color:rgba(255,255,255,.62);text-decoration:none;
    transition:color .2s;
  }
  .db-nav a svg{width:11px;height:11px;fill:currentColor;flex:0 0 11px;opacity:.85;}
  .db-nav a:hover,.db-nav a:focus-visible{color:var(--gold-lt);}
  .db-nav .x-mark{
    font-family:'Oswald',sans-serif;font-size:12px;
    color:var(--gold);opacity:.7;user-select:none;
  }

  .db-copy{
    text-align:center;font-size:10px;letter-spacing:.05em;
    color:rgba(255,255,255,.35);
  }

  /* ===== アクセシビリティ ===== */
  a:focus-visible{outline:1px solid var(--gold);outline-offset:3px;border-radius:2px;}

  @media (prefers-reduced-motion:reduce){
    .g1-header img,.g1-line,.g1-l1,.g1-sparkle{transition:none;}
    .g1-l1{opacity:1;}
    .g1-header img{opacity:1;transform:none;}
    .g1-line{opacity:1;transform:none;}
    .g1-sparkle{opacity:1;}
  }

  /* =========================================================
     ビュー切替（ホーム / 出走表）
     ========================================================= */
  .view{display:block;}
  .view[hidden]{display:none;}
  #viewRace{
    opacity:0;transform:translate3d(28px,0,0);
    transition:opacity .34s ease, transform .42s cubic-bezier(.22,1,.36,1);
  }
  #viewRace.shown{opacity:1;transform:none;}
  #viewHome.leaving{opacity:0;transition:opacity .2s ease;}

  /* =========================================================
     セクション見出し
     ========================================================= */
  .g1-sec{padding:48px 16px 0;margin-bottom:14px;}   /* 上=金バーとの余白 */
  .g1-sec h2{
    font-family:'Noto Sans JP',sans-serif;font-weight:900;
    font-size:clamp(21px,5.8vw,30px);letter-spacing:.02em;color:var(--wht);
    display:flex;align-items:baseline;gap:10px;
  }
  .g1-sec h2::before{
    content:'';width:3px;height:1em;border-radius:2px;flex:0 0 3px;
    background:linear-gradient(180deg,var(--gold-br),var(--gold-dp));
    transform:translateY(.08em);
  }
  .g1-sec .sub{
    display:block;margin:6px 0 0 13px;
    font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.16em;
    color:rgba(255,255,255,.36);
  }

  /* =========================================================
     開催カード
     Brain app.html の .venue-card の構造・配置・挙動を踏襲し、
     ダークガラス＋GO1配色（黒・金・白）に置き換えたもの。

     Brainからそのまま引き継いだ設計：
       ・1行目に「会場名 + R番号」→ グレードバッジ → 時間帯アイコン を横並び
       ・その下に開催日（2日目・最終日など）
       ・右側に締切／発走／終了を右寄せ配置
       ・締切25分前を切ったらカウントダウン（ドット明滅）に切り替え
       ・カード全体で1つの押せる面。区切り線を持たない1ブロック構成
       ・出現は translateY(30px) → 0
       ・待機時は shadowFloat で影がゆっくり呼吸する
       ・:active で scale(.96) して影を縮める
       ・上のカードほど z-index を高くして影が下のカードに負けないようにする
     ========================================================= */
  .g1-cards{padding:0 16px 40px;}

  .g1-card{
    position:relative;display:block;width:100%;text-align:left;
    border:0;font:inherit;color:inherit;cursor:pointer;
    padding:18px;margin-bottom:18px;min-height:80px;
    border-radius:16px;
    -webkit-tap-highlight-color:transparent;

    /* ガラス感：背面を透過させつつ、白のごく淡いフィルムを重ねる */
    background:linear-gradient(145deg, rgba(30,30,32,.62) 0%, rgba(12,12,13,.58) 100%);
    backdrop-filter:blur(14px) saturate(130%);
    -webkit-backdrop-filter:blur(14px) saturate(130%);
    border:1px solid rgba(217,180,95,.16);

    /* 背面影＋内側の縁取り（Brainの4段構成をダーク用に反転） */
    box-shadow:
      0 4px 14px rgba(0,0,0,.55),
      0 2px 6px rgba(0,0,0,.4),
      inset 0 1px 0 rgba(255,255,255,.07),
      inset 0 -1px 0 rgba(0,0,0,.5);

    opacity:0;transform:translateY(30px);
    transition:opacity .5s ease, transform .5s cubic-bezier(.22,1,.36,1), box-shadow .2s;
    overflow:hidden;
  }
  /* 上のカードを前面に（影が下のカードを隠さないように） */
  .g1-card:nth-child(1){z-index:20;}
  .g1-card:nth-child(2){z-index:19;}
  .g1-card:nth-child(3){z-index:18;}
  .g1-card:nth-child(4){z-index:17;}
  .g1-card:nth-child(5){z-index:16;}
  .g1-card:nth-child(6){z-index:15;}
  .g1-card:nth-child(n+7){z-index:10;}

  /* 上半分のガラス光沢 */
  .g1-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:50%;
    background:linear-gradient(180deg, rgba(255,255,255,.055) 0%, rgba(255,255,255,0) 100%);
    border-radius:16px 16px 0 0;pointer-events:none;
  }
  /* 斜めの微光沢（金を薄く走らせる） */
  .g1-card::after{
    content:'';position:absolute;inset:0;border-radius:16px;pointer-events:none;
    background:linear-gradient(112deg,
      rgba(255,255,255,0) 34%,
      rgba(243,227,184,.05) 48%,
      rgba(255,255,255,0) 61%);
  }

  .g1-card.in{
    opacity:1;transform:translateY(0);
    animation:g1ShadowFloat 4s ease-in-out infinite;
  }
  @keyframes g1ShadowFloat{
    0%,100%{box-shadow:0 4px 14px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07),inset 0 -1px 0 rgba(0,0,0,.5);}
    50%    {box-shadow:0 8px 22px rgba(0,0,0,.62),0 3px 9px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07),inset 0 -1px 0 rgba(0,0,0,.5);}
  }
  .g1-card:active{
    animation:none;
    transform:scale(.96);
    background:linear-gradient(145deg, rgba(42,38,28,.7) 0%, rgba(18,16,12,.66) 100%);
    border-color:rgba(217,180,95,.3);
    box-shadow:
      0 2px 8px rgba(0,0,0,.5),
      0 1px 3px rgba(0,0,0,.35),
      inset 0 1px 0 rgba(255,255,255,.05);
    transition:transform .1s ease, background .1s ease;
  }
  .g1-card.finished{opacity:.5;}
  .g1-card.finished.in{animation:none;}

  /* ---- 内部レイアウト（Brainと同一構成） ---- */
  .gc-main{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .gc-left{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .gc-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

  .gc-name{
    font-family:'Noto Sans JP',sans-serif;
    font-size:22px;font-weight:700;letter-spacing:.02em;
    color:#fff;
  }
  .gc-name .r{
    font-family:'Oswald',sans-serif;font-weight:500;
    background:linear-gradient(100deg,var(--gold) 0%,var(--gold-br) 55%,var(--gold-lt) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    margin-left:.32em;
  }

  /* グレードバッジ：Brainの立体バッジをそのままの作りで金基調に */
  .gc-grade{
    display:inline-flex;align-items:center;justify-content:center;
    padding:1px 6px;border-radius:3px;
    font-family:'Noto Sans JP',sans-serif;
    font-size:12px;font-weight:900;color:#fff;letter-spacing:.04em;
    -webkit-text-stroke:.3px rgba(0,0,0,.2);
    text-shadow:0 -1px 1px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.2);
    box-shadow:0 2px 4px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.3);
  }
  /* オートレースのグレード体系 */
  .grade-normal{background:linear-gradient(180deg,#5a5d68 0%,#3c3f48 50%,#2c2f36 100%);}
  .grade-g3{background:linear-gradient(180deg,#4caf50 0%,#2e8b32 50%,#1b6e20 100%);}
  .grade-g2{background:linear-gradient(180deg,#b040c8 0%,#8e24aa 50%,#6a1b80 100%);}
  .grade-g1{background:linear-gradient(180deg,#ef4444 0%,#c62828 50%,#a01e1e 100%);}
  .grade-sg{background:linear-gradient(180deg,#ffd700 0%,#d4a800 50%,#b08e00 100%);color:#0f0f0f;text-shadow:0 1px 0 rgba(255,255,255,.3),0 -1px 1px rgba(0,0,0,.15);}

  .gc-slot{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;}
  .gc-slot svg{width:16px;height:16px;}

  .gc-day{
    font-family:'Noto Sans JP',sans-serif;
    font-size:12px;font-weight:500;color:rgba(255,255,255,.42);
  }

  .gc-right{
    text-align:right;display:flex;flex-direction:column;
    align-items:flex-end;justify-content:center;flex:0 0 auto;
  }
  .gc-start{
    font-family:'Oswald',sans-serif;
    font-size:14px;font-weight:500;letter-spacing:.03em;
    color:rgba(255,255,255,.78);
  }
  .gc-start-label{
    font-family:'Noto Sans JP',sans-serif;
    font-size:10px;color:rgba(255,255,255,.36);margin-right:4px;letter-spacing:0;
  }

  /* 締切間際：Brainは赤。ダーク＋金基調に合わせて輝金にする */
  .gc-count{
    display:flex;align-items:center;gap:5px;
    font-family:'Noto Sans JP',sans-serif;
    font-size:13px;font-weight:700;color:var(--gold-br);
    text-shadow:0 0 12px rgba(255,219,91,.35);
  }
  .gc-count-dot{
    width:6px;height:6px;border-radius:50%;background:var(--gold-br);
    box-shadow:0 0 7px rgba(255,219,91,.8);
    animation:g1Pulse 1s ease infinite;
  }
  @keyframes g1Pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

  .gc-fin{
    font-family:'Noto Sans JP',sans-serif;
    font-size:13px;font-weight:600;color:rgba(255,255,255,.34);
  }

  /* ---- レース画面ヘッダのバッジ（開催カードとは別系統） ---- */
  .gc-b{
    font-family:'Noto Sans JP',sans-serif;font-size:10px;font-weight:500;
    line-height:1;padding:4px 7px;border-radius:4px;letter-spacing:.02em;
    border:1px solid rgba(217,180,95,.34);color:var(--gold-lt);
    background:rgba(217,180,95,.07);white-space:nowrap;
  }
  .gc-b.night{border-color:rgba(120,160,235,.36);color:#a9c2f2;background:rgba(120,160,235,.08);}
  .gc-b.mid{border-color:rgba(150,130,215,.38);color:#bcaef0;background:rgba(150,130,215,.09);}
  .gc-b.morn{border-color:rgba(255,179,0,.36);color:#ffcf6b;background:rgba(255,179,0,.08);}
  .gc-b.grade{border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.62);background:rgba(255,255,255,.03);}

  /* =========================================================
     サイト下部の理念テキスト
     主張しすぎないよう、小さめ・低コントラスト・広めの行間で置く
     ========================================================= */
  /* 出走表タイトル下の金バー（.rc-fixline）と同じもの。ホーム用に左右余白付き */
  .g1-bar{
    height:1px;margin:30px 16px 0;   /* 既定。設置箇所ごとに下で上書き */
    background:linear-gradient(90deg,
      rgba(217,180,95,.42) 0%, rgba(217,180,95,.16) 46%, rgba(255,255,255,0) 100%);
  }

  /* 1本目：構築中コメントとの間を広く */
  .g1-bar.b-top{margin-top:46px;}
  /* 2本目：開催カードとの間は狭く */
  .g1-bar.b-credo{margin-top:16px;}

  .g1-credo{
    padding:44px 18px 0;   /* バーとの間を広げ、フッターとの間は詰める */
    text-align:left;
  }
  .g1-credo .cg{
    font-family:'Noto Sans JP',sans-serif;font-weight:400;
    font-size:clamp(12.5px,3.5vw,15.5px);
    line-height:1.95;letter-spacing:.05em;
    color:rgba(255,255,255,.47);
    margin:0 0 25px;
    opacity:0;transform:translateY(14px);
    transition:opacity .95s ease, transform .95s cubic-bezier(.22,1,.36,1);
  }
  .g1-credo .cg:last-child{margin-bottom:0;}
  .g1-credo .cg.in{opacity:1;transform:none;}
  /* 群ごとにわずかな時間差 */
  .g1-credo .cg:nth-child(1).in{transition-delay:0s;}
  .g1-credo .cg:nth-child(2).in{transition-delay:.22s;}
  .g1-credo .cg:nth-child(3).in{transition-delay:.44s;}
  .g1-credo .cg:nth-child(4).in{transition-delay:.66s;}
  .g1-credo .em{color:rgba(243,227,184,.66);letter-spacing:.04em;}

  @media (prefers-reduced-motion:reduce){
    .g1-credo .cg{transition:none;opacity:1;transform:none;}
  }

  /* =========================================================
     出走表画面
     ========================================================= */
  .rc-wrap{padding:0 0 6px;}
  .rc-bar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:10px;
    padding:max(10px, env(safe-area-inset-top)) 14px 10px;
    background:linear-gradient(180deg,rgba(0,0,0,.96) 62%,rgba(0,0,0,0) 100%);
    backdrop-filter:saturate(140%) blur(6px);
    -webkit-backdrop-filter:saturate(140%) blur(6px);
  }
  .rc-back{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.045);border:1px solid rgba(217,180,95,.2);
    color:rgba(255,255,255,.8);border-radius:999px;
    padding:5px 11px 5px 9px;font:inherit;
    font-family:'Noto Sans JP',sans-serif;font-size:11px;font-weight:500;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:border-color .2s,color .2s,background .2s;
  }
  .rc-back:active{background:rgba(217,180,95,.1);border-color:rgba(217,180,95,.4);color:var(--gold-lt);}
  .rc-back i{
    width:5px;height:5px;border-left:1.4px solid currentColor;border-bottom:1.4px solid currentColor;
    transform:rotate(45deg);display:block;
  }

  .rc-head{padding:4px 16px 0;}
  .rc-vrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .rc-venue{font-family:'Noto Sans JP',sans-serif;font-weight:900;
    font-size:clamp(20px,5.6vw,28px);color:var(--wht);line-height:1.1;}
  .rc-title{
    margin-top:9px;font-size:12px;line-height:1.55;color:rgba(255,255,255,.56);
    font-weight:400;letter-spacing:.01em;
  }
  .rc-line{height:1px;margin:13px 0 12px;background:linear-gradient(90deg,
      rgba(217,180,95,.26) 0%, rgba(217,180,95,.08) 46%, rgba(255,255,255,0) 100%);}
  .rc-now{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;}
  .rc-rno{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:clamp(28px,8vw,42px);line-height:1;
    background:linear-gradient(100deg,var(--gold-dp) 0%,var(--gold) 32%,var(--gold-br) 66%,var(--gold-lt) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
  }
  .rc-cls{font-size:13px;font-weight:700;color:rgba(255,255,255,.78);}
  .rc-meta{
    margin-top:11px;display:flex;flex-wrap:wrap;gap:6px 16px;
    font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:.04em;
    color:rgba(255,255,255,.62);
  }
  .rc-meta .lb{font-family:'Noto Sans JP',sans-serif;font-size:10px;color:rgba(255,255,255,.34);margin-right:4px;letter-spacing:0;}
  .rc-meta .st{color:var(--gold-lt);font-family:'Noto Sans JP',sans-serif;font-size:11px;font-weight:500;}
  .rc-dist{margin-top:7px;font-family:'Oswald',sans-serif;font-size:11.5px;letter-spacing:.05em;color:rgba(255,255,255,.38);}

  /* タブ */
  .rc-tabs{
    display:flex;gap:0;margin:16px 16px 0;
    border-bottom:1px solid rgba(255,255,255,.09);
  }
  /* ★display を指定した要素は hidden 属性の既定 display:none を上書きしてしまう。
     hidden を効かせるには明示的に打ち消すこと（12節 #24） */
  .rc-tabs[hidden]{display:none;}
  .rc-tab{
    position:relative;flex:1;background:none;border:0;cursor:pointer;
    font-family:'Noto Sans JP',sans-serif;font-size:12.5px;font-weight:500;
    color:rgba(255,255,255,.42);padding:11px 4px 12px;
    -webkit-tap-highlight-color:transparent;transition:color .2s;
  }
  .rc-tab.on{color:var(--gold-lt);}
  .rc-tab::after{
    content:'';position:absolute;left:12%;right:12%;bottom:-1px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--gold-dp),var(--gold-br),var(--gold-lt));
    transform:scaleX(0);transform-origin:center;transition:transform .28s cubic-bezier(.22,1,.36,1);
  }
  .rc-tab.on::after{transform:scaleX(1);}

  /* テーブル */

  /* =========================================================
     レースセレクター（Brain app.html の .rt-race-btn を踏襲・ダーク版）
     72×70px / 番号・締切・レース種別の3段構成
     ========================================================= */
  .rc-rnav{
    padding:20px 0 14px;
    overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
    border-bottom:1px solid rgba(217,180,95,.14);
  }
  .rc-rnav::-webkit-scrollbar{display:none;}
  .rc-rnav-inner{display:flex;gap:10px;padding:0 16px;min-width:max-content;}

  .rc-rbtn{
    flex-shrink:0;width:72px;height:70px;padding:4px 4px 8px;
    border:1px solid rgba(255,255,255,.1);border-radius:14px;
    background:linear-gradient(180deg,#181818 0%,#111111 50%,#0a0a0a 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.055), 0 2px 6px rgba(0,0,0,.6);
    font-family:inherit;cursor:pointer;transition:all .15s;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.5px;
    position:relative;overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  .rc-rbtn:active{transform:scale(.95);}
  .rc-rbtn.on{
    border-color:rgba(217,180,95,.55);border-width:1.5px;
    background:linear-gradient(180deg,#1f1b12 0%,#161208 50%,#0d0a05 100%);
    box-shadow:0 3px 10px rgba(217,180,95,.32), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .rc-rbtn-num{
    font-family:'Oswald',sans-serif;font-size:17px;font-weight:600;line-height:1.1;
    color:rgba(255,255,255,.8);letter-spacing:.02em;
  }
  .rc-rbtn.on .rc-rbtn-num{
    background:linear-gradient(100deg,var(--gold) 0%,var(--gold-br) 55%,var(--gold-lt) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
  }
  .rc-rbtn-dl{
    font-family:'Noto Sans JP',sans-serif;font-size:9.5px;font-weight:500;
    color:rgba(255,255,255,.38);white-space:nowrap;line-height:1.1;
  }
  .rc-rbtn-dl.countdown{color:var(--gold-br);font-weight:700;}
  .rc-rbtn-dl.ended{color:rgba(255,255,255,.28);}
  .rc-rbtn-cls{
    font-family:'Noto Sans JP',sans-serif;font-size:9px;font-weight:500;
    color:rgba(255,255,255,.42);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:100%;line-height:1.1;margin-top:1px;
  }

  /* =========================================================
     出走表テーブル（ライトモード／ウィンチケット準拠）
     ★ここだけ配色を反転させている。フォントもサイト共通のOswald等ではなく
       ウィンチケットに合わせたシステムサンセリフを使う。
     ========================================================= */
  .rc-scroll{
    margin:14px 0 4px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;
    background:#ffffff;
    scrollbar-width:thin;
  }
  .rc-scroll::-webkit-scrollbar{height:6px;}
  .rc-scroll::-webkit-scrollbar-thumb{background:#c3c7cf;border-radius:3px;}
  .rc-scroll::-webkit-scrollbar-track{background:#eef0f3;}

  table.rc-t{
    border-collapse:collapse;
    width:max-content;min-width:100%;
    background:#ffffff;
    font-family:-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN',
                'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif;
    white-space:nowrap;
  }
  table.rc-t thead tr{background:#eef0f3;}
  table.rc-t thead th{
    font-size:10px;font-weight:700;color:#6b7078;
    padding:6px 5px;text-align:center;white-space:nowrap;
    border-right:1px solid #dfe2e7;
    border-bottom:2px solid #c9ccd4;
    letter-spacing:0;
  }
  /* 行の背景色は変数で持つ。偶数車は薄グレー、flash の戻り先もこれを使う */
  table.rc-t tbody tr{--rowbg:#ffffff;}
  table.rc-t tbody tr.alt{--rowbg:#f3f5f8;}

  table.rc-t tbody td{
    padding:4px 6px;text-align:center;white-space:nowrap;
    font-size:13px;color:#1c1e22;
    border-right:1px solid #e6e8ec;
    border-bottom:1px solid #e6e8ec;
    background:var(--rowbg);
  }
  /* ★2段構成（連対率／着別度数）の縦余白を詰める。
     rowspan=2 のセルは自動的にこの2行の合計高さに揃うので、
     ここを詰めることで表全体の行高が縮む。 */
  table.rc-t tbody td.r2a{padding-top:4px;padding-bottom:1px;}
  table.rc-t tbody td.r2b{padding-top:0;padding-bottom:4px;}
  /* 2段の境目に線を出さない（1選手で1ブロックに見せる） */
  table.rc-t tbody tr.rowA td.r2a{border-bottom:0;}

  /* 固定列 */
  /* ★固定列の罫線は border ではなく inset box-shadow で描く。
     テーブルが border-collapse:collapse のため、border は隣接セルと共有され
     sticky 側に追従せず一緒にスクロールしてしまう（＝線が透けて下の列が覗く）。
     inset box-shadow はセルの背景と同じ扱いなので固定位置に貼り付く。
     border-right を 0 にして二重描画も防ぐこと。（12節 #19） */
  table.rc-t .cno{
    position:sticky;left:0;z-index:4;
    width:40px;min-width:40px;max-width:40px;padding:4px 2px;
    border-right:0;
    box-shadow:inset -1px 0 0 0 #e6e8ec;
  }
  table.rc-t .cnm{
    position:sticky;left:40px;z-index:4;vertical-align:middle;
    width:120px;min-width:120px;max-width:120px;
    text-align:left;padding-left:9px;
    border-right:0;
    box-shadow:inset -2px 0 0 0 #b9bec7;   /* 固定ゾーンの右端 */
  }
  table.rc-t thead .cno{box-shadow:inset -1px 0 0 0 #dfe2e7;}
  table.rc-t thead .cnm{box-shadow:inset -2px 0 0 0 #a9aeb8;}
  /* 試走T列は幅のみ指定（固定はしない） */
  table.rc-t .cts{width:96px;min-width:96px;max-width:96px;}
  table.rc-t thead .cno,table.rc-t thead .cnm{z-index:6;background:#eef0f3;}
  table.rc-t tbody .cno,table.rc-t tbody .cnm{background:var(--rowbg);}

  /* セル内表現
     ★セレクタは必ず `table.rc-t tbody td.xxx` の形で書くこと。
       `.rc-pct{...}` のような単独クラスだと `table.rc-t tbody td{font-size:13px}`
       （詳細度 0,1,3）に負けて効かない。実際に全セルが13pxで描画される不具合を出した（12節 #17）。 */
  .rc-num{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:4px;
    font-family:'Oswald',sans-serif;font-size:13px;font-weight:500;line-height:1;
  }
  /* 1番車は白地なので白背景に埋もれる。黒の極細線で縁取る */
  .rc-num.n1{box-shadow:inset 0 0 0 1px #1a1a1a;}
  table.rc-t tbody td .rc-nm{font-size:15px;font-weight:700;color:#14161a;letter-spacing:.01em;line-height:1.22;}
  table.rc-t tbody td .rc-sub{font-size:10px;color:#8a8f99;margin-top:0;font-weight:400;line-height:1.2;}
  table.rc-t tbody td .rc-hs{font-size:12.5px;color:#1c1e22;font-weight:500;line-height:1.2;}
  table.rc-t tbody td .rc-hs em{display:block;font-style:normal;font-size:11px;color:#8a8f99;margin-top:0;font-weight:400;line-height:1.2;}
  table.rc-t tbody td .rc-rank{font-size:12.5px;color:#1c1e22;font-weight:500;line-height:1.2;}
  table.rc-t tbody td .rc-rank em{display:block;font-style:normal;font-size:10.5px;color:#8a8f99;margin-top:0;font-weight:400;line-height:1.2;}
  table.rc-t tbody td.rc-pct{font-size:12.5px;color:#1c1e22;font-weight:500;line-height:1.2;}
  table.rc-t tbody td.rc-cnt{font-size:11px;color:#8a8f99;letter-spacing:.01em;line-height:1.2;}
  table.rc-t tbody td.rc-car{text-align:left;font-size:12px;color:#1c1e22;line-height:1.25;}
  table.rc-t tbody td.rc-car em{font-style:normal;color:#8a8f99;font-size:10.5px;}
  table.rc-t tbody td .rc-cnt{font-size:11px;color:#8a8f99;letter-spacing:.01em;}




  /* =========================================================
     レース画面 上部固定ゾーン
     戻る／会場+R+種別+日目+グレード／発走・締切／区切り線 までを sticky
     ========================================================= */
  .rc-fixed{
    position:sticky;top:0;z-index:40;
    background:rgba(0,0,0,.95);
    backdrop-filter:saturate(140%) blur(8px);
    -webkit-backdrop-filter:saturate(140%) blur(8px);
    padding-bottom:0;
  }
  .rc-fixed .rc-bar{
    position:static;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;
    /* 上へ寄せ、その分タイトルとの間に余白を作る */
    padding:max(4px, env(safe-area-inset-top)) 14px 20px;
  }

  .rc-ttl{padding:0 16px;}
  .rc-ttl-row{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 9px;}
  /* 会場名をR番号と同じ高さまで拡大 */
  .rc-vr{
    font-family:'Noto Sans JP',sans-serif;font-weight:900;
    font-size:clamp(26px,7.6vw,40px);line-height:1.05;color:var(--wht);
    letter-spacing:.01em;
  }
  .rc-vr .rn{
    font-family:'Oswald',sans-serif;font-weight:600;
    font-size:clamp(26px,7.6vw,40px);line-height:1.05;margin-left:.14em;
    background:linear-gradient(100deg,var(--gold-dp) 0%,var(--gold) 32%,var(--gold-br) 66%,var(--gold-lt) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
  }
  .rc-ttl-row .rc-cls{
    font-family:'Noto Sans JP',sans-serif;font-size:14px;font-weight:700;
    color:rgba(255,255,255,.8);
  }

  /* 発走・締切（サイズアップ） */
  .rc-times{
    margin-top:9px;display:flex;flex-wrap:wrap;gap:4px 20px;
    font-family:'Oswald',sans-serif;font-size:16px;font-weight:500;letter-spacing:.04em;
    color:rgba(255,255,255,.82);
  }
  .rc-times .lb{
    font-family:'Noto Sans JP',sans-serif;font-size:11px;font-weight:400;
    color:rgba(255,255,255,.4);margin-right:6px;letter-spacing:0;
  }
  /* 締切25分前から赤 */
  .rc-times .close.near{
    color:#ff5d5d;font-weight:600;
    text-shadow:0 0 14px rgba(255,93,93,.35);
  }
  .rc-times .close.near .lb{color:rgba(255,93,93,.7);}
  .rc-times .close.ended{color:rgba(255,255,255,.35);}

  .rc-fixline{
    height:1px;margin:12px 0 0;
    background:linear-gradient(90deg,
      rgba(217,180,95,.42) 0%, rgba(217,180,95,.16) 46%, rgba(255,255,255,0) 100%);
  }

  /* 固定ゾーンの下（スクロールする情報帯）
     ★かつて .rc-sub にしていたが、テーブルの選手名サブ行と同名で衝突していた（12節 #18）。
       .rc-sub は table 側専用。ここは .rc-info を使うこと。 */
  .rc-info{padding:13px 16px 0;}
  .rc-cupname{
    font-family:'Noto Sans JP',sans-serif;font-size:12.5px;line-height:1.55;
    color:rgba(255,255,255,.6);
  }

  /* レースセレクターの締切：25分前から赤 */
  .rc-rbtn-dl.countdown{color:#ff5d5d;font-weight:700;}
  .rc-rbtn.on .rc-rbtn-dl.countdown{color:#ff6f6f;}

  /* =========================================================
     大項目の区切り（縦の濃い線）
     ========================================================= */
  table.rc-t th.gsep,
  table.rc-t td.gsep{ border-left:2px solid #b9bec7 !important; }
  table.rc-t thead th.gsep{ border-left:2px solid #a9aeb8 !important; }

  /* ===== 試走T 更新ボタン（見出しセル内・ライトモード） ===== */
  table.rc-t th.rc-th-shiso{
    padding:4px 8px;
    vertical-align:middle;
  }
  /* ラベルとボタンを横並びに */
  .rc-th-shiso .in{
    display:flex;align-items:center;justify-content:center;gap:7px;
    white-space:nowrap;
  }
  .rc-th-shiso .lbl{display:block;line-height:1.35;}
  .rc-rfbtn{
    display:inline-flex;align-items:center;justify-content:center;
    width:23px;height:23px;flex:0 0 23px;margin-top:0;padding:0;
    border:1px solid #c3c8d1;border-radius:50%;
    background:linear-gradient(180deg,#ffffff,#eef0f4);
    box-shadow:0 1px 2px rgba(0,0,0,.1);
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:transform .12s, background .12s, border-color .12s;
  }
  .rc-rfbtn:active{transform:scale(.9);background:#e3e7ee;border-color:#9aa1ad;}
  .rc-rfbtn[disabled]{opacity:.5;pointer-events:none;}
  .rc-rfbtn svg{
    width:13px;height:13px;display:block;
    fill:none;stroke:#4d535c;stroke-width:2.3;
  }
  .rc-rfbtn.loading svg{animation:rcSpin .8s linear infinite;}
  @keyframes rcSpin{to{transform:rotate(360deg);}}

  /* 更新結果の文言はヘッダ（ダーク側）に出す */
  .rc-rfstat{
    margin-top:7px;
    font-family:'Noto Sans JP',sans-serif;font-size:10.5px;letter-spacing:.02em;
    color:rgba(255,255,255,.4);
  }
  .rc-rfstat:empty{display:none;}
  .rc-rfstat b{color:var(--gold-br);font-weight:700;}
  .rc-rfstat i{font-style:normal;color:#e39191;font-weight:700;}

  /* 更新で値が変わったセルを一時的に光らせる */
  table.rc-t td.rc-shiso.flash{animation:rcFlash 2.2s ease forwards;}
  @keyframes rcFlash{
    0%{background:#fff2b8;}
    55%{background:#fff2b8;}
    100%{background:var(--rowbg);}
  }
  /* 再試走が入った値を強調 */
  .rc-hs .re{color:#c04a4a;font-weight:700;}

  /* 前5走セル（ライトモード） */
  .rc-h{
    display:block;text-align:left;line-height:1.45;
    font-size:11px;color:#1c1e22;white-space:nowrap;
  }
  /* ★3行構成にするため必ず block。span のままだと1行に潰れる */
  .rc-h .d{display:block;color:#8a8f99;font-size:10px;}
  .rc-h .m{display:block;margin-top:1px;}
  .rc-h .cond{
    display:inline-block;min-width:16px;text-align:center;
    font-size:9.5px;font-weight:700;border-radius:3px;padding:0 3px;margin-right:4px;
    border:1px solid transparent;
  }
  .rc-h .cond.ryo{background:#fdf1e3;border-color:#f0d3ac;color:#a96a1c;}
  .rc-h .cond.shitsu{background:#e8f0fd;border-color:#bcd2f2;color:#2a5fa8;}
  .rc-h .cond.other{background:#f0f1f3;border-color:#dcdee3;color:#71767f;}
  .rc-h .hd{color:#5a5f68;font-size:10.5px;margin-right:4px;}
  .rc-h .rk{font-weight:700;font-size:12px;color:#1c1e22;}
  .rc-h .rk.p1{color:#b8860b;}
  .rc-h .rk.p2{color:#6b7078;}
  .rc-h .rk.p3{color:#a2643a;}
  .rc-h .t{color:#4a4f58;font-size:10.5px;}
  .rc-h .t em{font-style:normal;color:#8a8f99;margin-left:5px;}
  table.rc-t td.rc-hcell{text-align:left;padding:7px 8px;vertical-align:top;}
  .rc-h.none{color:#b6bac1;font-size:11px;}

  /* 発走・締切・日付・天候の横並びテキスト */
  .rc-cond-line{
    margin-top:3px;
    display:flex;flex-wrap:wrap;gap:4px 14px;
    font-family:'Oswald',sans-serif;font-size:11.5px;letter-spacing:.05em;
    color:rgba(255,255,255,.38);
  }
  .rc-cond-line .lb{
    font-family:'Noto Sans JP',sans-serif;font-size:10px;
    color:rgba(255,255,255,.28);margin-right:4px;letter-spacing:0;
  }

  /* データ未接続 */
  .rc-empty{
    margin:26px 16px;padding:24px 18px;border-radius:12px;text-align:center;
    border:1px dashed rgba(217,180,95,.22);background:rgba(255,255,255,.015);
  }
  .rc-empty p{font-size:12.5px;color:rgba(255,255,255,.5);line-height:1.8;}
  .rc-empty .t{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.14em;color:var(--gold);margin-bottom:8px;}

  @media (prefers-reduced-motion:reduce){
    .g1-card,#viewRace{transition:none;}
    .g1-card{opacity:1;transform:none;animation:none;}
    .g1-card.in{animation:none;}
    .gc-count-dot{animation:none;}
    #viewRace{opacity:1;transform:none;}

  /* ===== 券種チップ ===== */

  /* ===== 軸セレクタ ===== */
  .rc-axis{

  /* ===== タップ演出（Brain app.html の venue-card 演出を踏襲） ===== */
  /* キラーン */
  .g1-card.shimmer{ animation:g1Shimmer .6s ease-out forwards !important; }
  @keyframes g1Shimmer{
    0%{  box-shadow:0 4px 14px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07),
                    0 0 0 0 rgba(243,227,184,0), 0 0 0 0 rgba(255,219,91,0); }
    30%{ box-shadow:0 4px 14px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07),

    100%{box-shadow:0 4px 14px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07),
                    0 0 0 12px rgba(243,227,184,0), 0 0 32px 15px rgba(255,219,91,0); }
  }
  /* 他カードのスライドアウト */
  .g1-card.slide-out{ animation:g1SlideOut .2s ease-in forwards !important; pointer-events:none; }
  @keyframes g1SlideOut{

  /* タップ位置から弾けるバースト */
  @keyframes g1TapBurst{

    100%{transform:translate(-50%,-50%) scale(2.5);opacity:0;}
  }
  .g1-card.tapped::after{

  .g1-skel{

    background-size:220% 100%;
    border:1px solid rgba(217,180,95,.08);

  }
  @keyframes g1Skel{0%{background-position:120% 0;}100%{background-position:-120% 0;}}

  .g1-msg{
    margin:4px 16px 0;padding:20px 16px;border-radius:14px;text-align:center;

  }

  .g1-retry{

    font-family:'Noto Sans JP',sans-serif;font-size:12px;font-weight:500;color:var(--gold-lt);
    -webkit-tap-highlight-color:transparent;
  }
  .g1-retry:active{background:rgba(217,180,95,.2);}

  @media (prefers-reduced-motion:reduce){
    .g1-skel{animation:none;}
  }
</style>

<script>
(function(){
  'use strict';

  var stage = document.getElementById('g1Stage');
  var img   = document.getElementById('g1HeaderImg');
  var hero  = document.getElementById('g1Hero');
  var cv    = document.getElementById('g1Sparkle');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* =========================================================
     1. ヘッダー画像フェードイン
     ========================================================= */
  function onImgReady(){
    if(stage) stage.classList.add('loaded');
    initSparkle();
  }
  if(img){
    if(img.complete && img.naturalWidth > 0){
      requestAnimationFrame(onImgReady);
    }else{
      img.addEventListener('load', onImgReady);
      img.addEventListener('error', onImgReady);   /* 読み込み失敗でも枠は表示 */
    }
  }else{
    onImgReady();
  }

  /* =========================================================
     1-b. 見出し1段目：読み込み後ワンテンポおいて自動フェードイン
          （スクロールに依存しない）
     ========================================================= */
  (function(){
    var l1 = document.querySelector('.g1-l1');
    if(!l1) return;
    var show = function(){ l1.classList.add('shown'); };
    if(reduce){ show(); return; }
    /* 画像フェードインと重ならないよう少し遅らせる */
    setTimeout(function(){ requestAnimationFrame(show); }, 900);
  })();

  /* =========================================================
     1-c. サイト下部の理念テキスト：下方スクロールで群ごとに時間差フェードイン
     ========================================================= */
  (function(){
    var credo = document.getElementById('g1Credo');
    if(!credo) return;
    var groups = credo.querySelectorAll('.cg');
    var showAll = function(){
      for(var i=0;i<groups.length;i++) groups[i].classList.add('in');
    };
    if(reduce || !('IntersectionObserver' in window)){ showAll(); return; }
    var io = new IntersectionObserver(function(es){
      for(var i=0;i<es.length;i++){
        if(es[i].isIntersecting){ showAll(); io.disconnect(); }
      }
    }, { threshold:0, rootMargin:'0px 0px -12% 0px' });
    io.observe(credo);
  })();

  /* =========================================================
     2. 見出し：スクロールで右から2段時間差スライドイン
        「画面内に入った」かつ「実際にスクロールされた」の複合条件。
        1画面に収まりスクロール不可の場合のみフォールバックで自動表示。
     ========================================================= */
  if(hero){
    if('IntersectionObserver' in window){
      var inView = false, done = false;
      var SCROLL_GATE = 24;   /* px：これ以上スクロールされたら発火 */

      var reveal = function(){
        if(done) return;
        done = true;
        hero.classList.add('in');
        io.unobserve(hero);
        window.removeEventListener('scroll', onScroll);
      };
      var onScroll = function(){
        if(inView && window.pageYOffset > SCROLL_GATE) reveal();
      };
      var io = new IntersectionObserver(function(entries){
        for(var i=0;i<entries.length;i++){
          if(entries[i].isIntersecting){
            inView = true;
            onScroll();   /* すでにスクロール済みなら即発火 */
          }
        }
      }, { threshold:0, rootMargin:'0px 0px -12% 0px' });
      io.observe(hero);
      window.addEventListener('scroll', onScroll, { passive:true });

      /* スクロール不可レイアウト時の保険 */
      setTimeout(function(){
        var doc = document.documentElement;
        if(!done && doc.scrollHeight - window.innerHeight <= SCROLL_GATE) reveal();
      }, 900);
    }else{
      hero.classList.add('in');  /* 非対応環境は即表示 */
    }
  }

  /* =========================================================
     3. スパークル（噴射＋重力の物理モデル）

     ・ヘッダー画像内の Go1 の右下から、画像の右上角へ向けてランダムに噴射され、
       以後は重力と抗力だけで運動する。勢いのある粒はそのまま右上へ抜けて消える。
     ・抗力はストークス抗力を採用。粒子質量 m ∝ r^3、抗力係数 ∝ r より
       減速率 k = 6πμr/m ∝ 1/r^2。これを k = DRAG / r^2 として実装。
       この一本の式から以下が自動的に導かれる（個別に調整していない）：
         - 終端速度 v_t = G/k ∝ r^2  → 大粒ほど速く落ちる
         - 水平飛距離 ≒ v0x/k ∝ r^2  → 大粒ほど遠くまで飛ぶ
         - 小粒は減速が速く滞空する  → 寿命 life = LIFE/r で小粒ほど長く残す
     ・色は引き続きヘッダー画像の実サンプリング比率（金・白・濃いグレー）。
     ========================================================= */
  var PALETTE = {
    gold : ['#ffdb5b','#d9b45f','#f3e3b8'],   /* 画像から抽出した金 */
    white: ['#ffffff','#f4f4f4'],
    grey : ['#50525a','#3d3f45']              /* 濃いグレー */
  };

  /* ---- 物理定数 ---- */
  var G      = 105;      /* 重力加速度 px/s^2 */
  var DRAG   = 0.95;     /* 抗力スケール（k = DRAG / r^2 [1/s]） */
  var TURB   = 17;       /* 気流の強さ px/s^2（小粒ほど強く効く） */
  var V0MIN  = 300;      /* 噴射初速 下限 px/s */
  var V0MAX  = 760;      /* 噴射初速 上限 px/s */
  var SPREAD = 40 * Math.PI/180;    /* 噴射角のばらつき（狙いは画像の右上角） */
  var RMIN   = 0.45;     /* 粒径 下限 px */
  var RMAX   = 1.25;     /* 粒径 上限 px */
  var LIFE   = 6.0;      /* 寿命基準 秒（life = LIFE / r） */
  var SPR_K  = 3.4;      /* 描画倍率。芯は約16%なので実視認は r*0.54 px 相当 */

  /* 噴射口＝Go1の右下。ヘッダー画像の輝度>150の質量分布から実測した位置（画像内比率） */
  var EM_X0 = 0.40, EM_XW = 0.16;
  var EM_Y0 = 0.64, EM_YH = 0.22;

  var ctx = null, DPR = 1;
  var W = 0, H = 0;
  var imgBox = { x:0, y:0, w:0, h:0 };
  var types  = [];       /* 画像から得た色種の出現比率 */
  var sprites = { gold:[], white:[], grey:[] };
  var parts = [];
  var running = false, rafId = 0, lastT = 0, inited = false;

  function hexToRgb(h){
    return [parseInt(h.substr(1,2),16), parseInt(h.substr(3,2),16), parseInt(h.substr(5,2),16)];
  }
  function rgba(h,a){
    var c = hexToRgb(h);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }

  /* 超微細に見せるため、芯を極小・外周を淡いハローにしたスプライトを事前生成 */
  function makeSprite(hex){
    var S = 24;
    var c = document.createElement('canvas');
    c.width = c.height = S;
    var g = c.getContext('2d');
    var rg = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
    rg.addColorStop(0,    rgba(hex,1));
    rg.addColorStop(0.16, rgba(hex,0.92));
    rg.addColorStop(0.42, rgba(hex,0.22));
    rg.addColorStop(1,    rgba(hex,0));
    g.fillStyle = rg;
    g.beginPath(); g.arc(S/2, S/2, S/2, 0, Math.PI*2); g.fill();
    return c;
  }
  function buildSprites(){
    for(var k in PALETTE){
      if(!Object.prototype.hasOwnProperty.call(PALETTE,k)) continue;
      sprites[k] = [];
      for(var i=0;i<PALETTE[k].length;i++) sprites[k].push(makeSprite(PALETTE[k][i]));
    }
  }

  function fallbackTypes(){
    types.length = 0;
    for(var k=0;k<180;k++){
      types.push((k%3===0) ? 'gold' : ((k%3===1) ? 'white' : 'grey'));
    }
  }

  /* ヘッダー画像を実サンプリングして色種の出現比率を作る（画像との連動） */
  function buildTypes(){
    types.length = 0;
    try{
      if(!img || !img.naturalWidth) throw new Error('no image');
      var SW = 140;
      var SH = Math.max(1, Math.round(SW * img.naturalHeight / img.naturalWidth));
      var oc = document.createElement('canvas');
      oc.width = SW; oc.height = SH;
      var octx = oc.getContext('2d', { willReadFrequently:true });
      octx.drawImage(img, 0, 0, SW, SH);
      var d = octx.getImageData(0, 0, SW, SH).data;

      for(var y=0;y<SH;y++){
        for(var x=0;x<SW;x++){
          var i = (y*SW + x) * 4;
          var r = d[i], g = d[i+1], b = d[i+2];
          var lum = 0.299*r + 0.587*g + 0.114*b;
          if(lum < 26) continue;                      /* 黒背景は数えない */
          if(Math.random() > Math.min(1, lum/200)) continue;
          var t;
          if(r - b > 34 && r > 88)      t = 'gold';   /* 金の飛沫 */
          else if(lum > 148)            t = 'white';  /* 白の飛沫 */
          else                          t = 'grey';   /* 暗部の粒＝濃いグレー */
          types.push(t);
          /* 画像は白の飛沫が約63%・金が約11.5%。そのままでは金がほぼ出ないため
             金のみ重み付けし、実際の見え方を金・白・グレーで均衡させる */
          if(t === 'gold'){ types.push(t); types.push(t); types.push(t); }
        }
      }
    }catch(e){
      types.length = 0;   /* CORS等で読み取れない場合 */
    }
    if(types.length < 40) fallbackTypes();
  }

  /* 噴射：画面左下（＝画像の左下）から右上へ */
  function emit(p){
    var t    = types[(Math.random()*types.length)|0];
    var list = sprites[t];
    p.spr = list[(Math.random()*list.length)|0];

    /* 粒径は小さいものが圧倒的に多い分布にする（超微細さを保つ） */
    p.r  = RMIN + (RMAX - RMIN) * Math.pow(Math.random(), 2.2);
    p.k  = DRAG / (p.r * p.r);          /* ストークス抗力による減速率 [1/s] */
    p.sz = p.r * SPR_K;

    /* 噴射口：Go1 の右下 */
    p.x = imgBox.x + (EM_X0 + Math.random()*EM_XW) * imgBox.w;
    p.y = imgBox.y + (EM_Y0 + Math.random()*EM_YH) * imgBox.h;

    /* 狙いはヘッダー画像の右上角。噴射口から角へのベクトルを都度求めるので
       画像サイズが変わっても向きが崩れない */
    var base = Math.atan2(imgBox.y - p.y, (imgBox.x + imgBox.w) - p.x);
    var a  = base + (Math.random() - 0.5) * SPREAD;
    var v0 = V0MIN + Math.random()*(V0MAX - V0MIN);
    p.vx = Math.cos(a) * v0;
    p.vy = Math.sin(a) * v0;           /* 上向き＝負 */

    p.life = LIFE / p.r;               /* 小粒ほど長く漂う */
    p.age  = 0;
    p.ph   = Math.random()*Math.PI*2;
    p.ts   = 0.5 + Math.random()*1.5;  /* 気流の周期 */
    p.tw   = 0.6 + Math.random()*1.9;  /* 明滅速度 */
    p.base = (t === 'grey') ? (0.50 + Math.random()*0.42)
                            : (0.34 + Math.random()*0.50);
  }

  /* 運動方程式：重力＋線形抗力＋微弱な気流（半陰的オイラー法） */
  function step(p, dt, tsec){
    var turb = TURB * Math.sin(tsec*p.ts + p.ph) / p.r;   /* 小粒ほど流されやすい */
    p.vx += (turb - p.k * p.vx) * dt;
    p.vy += (G    - p.k * p.vy) * dt;
    p.x  += p.vx * dt;
    p.y  += p.vy * dt;
    p.age += dt;
  }

  function alphaOf(p, tsec){
    if(p.age >= p.life) return 0;
    var fi = p.age / 0.20;  if(fi > 1) fi = 1;
    var fo = 1 - (p.age - p.life*0.60) / (p.life*0.40);
    if(fo > 1) fo = 1; else if(fo < 0) fo = 0;
    var edge = (H - p.y) / 44;  if(edge > 1) edge = 1; else if(edge < 0) edge = 0;
    var tw = 0.62 + 0.38*Math.sin(tsec*p.tw + p.ph);
    return p.base * fi * fo * edge * tw;
  }

  function dead(p){
    /* y < -30 は画面上方への離脱。勢いのある粒はここから右上へ消えていく */
    return p.age >= p.life || p.y > H + 12 || p.y < -30 || p.x > W + 30 || p.x < -40;
  }

  function measure(){
    if(!stage || !ctx) return;
    /* ビュー切替で非表示のときは 0 になる。0のまま組むと粒子が壊れるので抜ける */
    if(stage.clientWidth < 1 || stage.clientHeight < 1) return;
    W = stage.clientWidth;
    H = stage.clientHeight;
    cv.width  = Math.max(1, Math.round(W*DPR));
    cv.height = Math.max(1, Math.round(H*DPR));
    cv.style.width  = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var ir = img ? img.getBoundingClientRect() : null;
    var sr = stage.getBoundingClientRect();
    if(ir && ir.width > 0){
      imgBox = { x: ir.left - sr.left, y: ir.top - sr.top, w: ir.width, h: ir.height };
    }else{
      imgBox = { x:0, y:0, w:W, h:Math.max(1, H*0.30) };
    }
  }

  function populate(){
    var n = Math.round(Math.max(150, Math.min(300, W*0.58)));
    parts.length = 0;
    for(var i=0;i<n;i++){
      var p = {};
      emit(p);
      /* 読み込み時点で噴射が定常状態になっているよう、ランダムに時間を進める */
      var adv = Math.random() * p.life;
      var h = 1/45, t0 = Math.random()*20;
      for(var e=0; e<adv; e+=h){
        step(p, h, t0 + e);
        if(dead(p)){ emit(p); break; }
      }
      parts.push(p);
    }
  }

  function frame(now){
    var dt = (now - lastT) / 1000;
    if(!(dt > 0) || dt > 0.05) dt = 0.016;
    lastT = now;

    ctx.clearRect(0, 0, W, H);
    var tsec = now / 1000;

    for(var i=0;i<parts.length;i++){
      var p = parts[i];
      step(p, dt, tsec);
      if(dead(p)){ emit(p); continue; }
      var a = alphaOf(p, tsec);
      if(a <= 0.004) continue;
      ctx.globalAlpha = a;
      ctx.drawImage(p.spr, p.x - p.sz/2, p.y - p.sz/2, p.sz, p.sz);
    }
    ctx.globalAlpha = 1;
    if(running) rafId = requestAnimationFrame(frame);
  }

  function start(){
    if(running || !inited || reduce) return;
    running = true;
    lastT = performance.now();
    rafId = requestAnimationFrame(frame);
  }
  function stop(){
    running = false;
    if(rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }

  function drawStatic(){
    ctx.clearRect(0, 0, W, H);
    var tsec = performance.now()/1000;
    for(var i=0;i<parts.length;i++){
      var p = parts[i];
      var a = alphaOf(p, tsec);
      if(a <= 0.004) continue;
      ctx.globalAlpha = a;
      ctx.drawImage(p.spr, p.x - p.sz/2, p.y - p.sz/2, p.sz, p.sz);
    }
    ctx.globalAlpha = 1;
  }

  function initSparkle(){
    if(inited || !cv || !stage) return;
    if(!cv.getContext) return;
    ctx = cv.getContext('2d');
    if(!ctx) return;
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    buildSprites();
    buildTypes();
    measure();
    populate();
    inited = true;

    /* リサイズ監視は動き抑制の有無に関わらず登録する
       （早期returnの後ろに置くと reduce 環境でキャンバスが追従しない） */
    var rt = 0;
    window.addEventListener('resize', function(){
      clearTimeout(rt);
      rt = setTimeout(function(){
        measure();
        populate();
        if(reduce) drawStatic();
      }, 180);
    });

    if(reduce){
      drawStatic();   /* 動きを抑える設定では静止した一枚だけ描く */
      return;
    }

    /* 画面外・非表示タブでは止める */
    if('IntersectionObserver' in window){
      var vio = new IntersectionObserver(function(es){
        for(var i=0;i<es.length;i++){
          if(es[i].isIntersecting) start(); else stop();
        }
      }, { threshold:0 });
      vio.observe(stage);
    }else{
      start();
    }
    document.addEventListener('visibilitychange', function(){
      if(document.hidden) stop(); else start();
    });
  }
})();
</script>

<script>
(function(){
  'use strict';

  /* =========================================================
     データ層（実接続）

     取得経路はすべて実URLで裏取り済み。
       開催一覧 https://www.winticket.jp/autorace          （SSR・○）
       出走表   /autorace/{venue}/racecard/{mid}/{day}/{race}（SSR・○）
       オッズ   https://sp.oddspark.com/autorace/SpOddsInfo.do（SSR・○）
       払戻     https://www.oddspark.com/autorace/RaceRefund.do（SSR・○）
     winticket の odds / raceresult はCSRで値が返らないため使わない。

     ★meetingId = 開催初日YYYYMMDD(8桁) + 場コード2桁
       場コードは oddspark の joCd と同一。両サイトを相互変換できる。
       例) 2026080602 = 2026-08-06初日・川口(02)
           2026080403 = 2026-08-04初日・伊勢崎(03)
           2026080506 = 2026-08-05初日・山陽(06)
     ========================================================= */

  var PROXY_URL = 'https://royal-mode-67a9.bomayekeirin.workers.dev';

  var VENUE = {
    kawaguchi:{ jp:'川口',   roma:'KAWAGUCHI', cd:'02' },
    isesaki  :{ jp:'伊勢崎', roma:'ISESAKI',   cd:'03' },
    hamamatsu:{ jp:'浜松',   roma:'HAMAMATSU', cd:'04' },
    iizuka   :{ jp:'飯塚',   roma:'IIZUKA',    cd:'05' },
    sanyo    :{ jp:'山陽',   roma:'SANYO',     cd:'06' }
  };
  /* 場コード → slug の逆引き（oddspark 側のURLから戻すとき用） */
  var CD2SLUG = {};
  (function(){ for(var k in VENUE){ if(VENUE.hasOwnProperty(k)) CD2SLUG[VENUE[k].cd] = k; } })();

  /* 車番色（オートレース標準） */
  var NUMCOL = {
    1:['#ffffff','#000000'], 2:['#111111','#ffffff'], 3:['#e2373b','#ffffff'],
    4:['#2a6fdb','#ffffff'], 5:['#f5d327','#000000'], 6:['#2fa84f','#ffffff'],
    7:['#f08a24','#000000'], 8:['#ec86b0','#000000']
  };

  var MEETINGS = [];        /* 本日の開催（実データ） */
  var isTransitioning = false;
  var refreshTimer = null;

  /* =========================================================
     ユーティリティ
     ========================================================= */
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }
  /* 発走時刻 → 締切(発走-5分)と残り分。日跨ぎ補正あり。
     ★締切25分前から赤（レースセレクター・出走表ヘッダで共通）
     ★ここはユーティリティ帯。描画関数のブロック置換に巻き込まれない位置に置くこと。 */
  var CLOSE_NEAR_MIN = 25;

  function closeInfo(start){
    if(!start) return null;
    var p = String(start).split(':');
    if(p.length !== 2) return null;
    var sm = Number(p[0]) * 60 + Number(p[1]);
    if(isNaN(sm)) return null;
    var cm = sm - 5;
    if(cm < 0) cm += 1440;
    var now = new Date();
    var rest = cm - (now.getHours() * 60 + now.getMinutes());
    if(rest < -720) rest += 1440;
    return {
      minutes: cm,
      text: ('0' + Math.floor(cm / 60)).slice(-2) + ':' + ('0' + (cm % 60)).slice(-2),
      rest: rest,
      near: (rest > 0 && rest <= CLOSE_NEAR_MIN),
      ended: (rest <= 0)
    };
  }

  function sessionClass(s){
    if(s === 'ナイター') return 'night';
    if(s === 'ミッドナイト') return 'mid';
    if(s === 'モーニング') return 'morn';
    return '';
  }

  /* winticket の racecard / raceresult URL を分解
     4セグメント形式 /{venue}/racecard/{mid}/{day}/{race} のみ「本日の出走可能レース」 */
  function parseWtUrl(href){
    if(!href) return null;
    var m = href.match(/\/autorace\/([a-z]+)\/(racecard|raceresult)\/(\d{10})\/(\d+)\/(\d+)/);
    if(m){
      return { slug:m[1], type:m[2], meetingId:m[3], dayNum:Number(m[4]), raceNo:Number(m[5]), full:true };
    }
    var m2 = href.match(/\/autorace\/([a-z]+)\/(racecard|raceresult)\/(\d{10})\/?\?index=(\d+)/);
    if(m2){
      return { slug:m2[1], type:m2[2], meetingId:m2[3], dayNum:Number(m2[4]), raceNo:null, full:false };
    }
    return null;
  }

  /* 発走時刻 → 締切（発走-5分）と残り分。日跨ぎ補正あり */
  function deadlineOf(start){
    if(!start || start === '--:--') return null;
    var p = String(start).split(':');
    if(p.length !== 2) return null;
    var sm = Number(p[0]) * 60 + Number(p[1]);
    if(isNaN(sm)) return null;
    var dm = sm - 5;
    if(dm < 0) dm += 1440;
    var now = new Date();
    var rest = dm - (now.getHours() * 60 + now.getMinutes());
    /* ミッドナイトなど日跨ぎ：大きく負なら翌日扱い */
    if(rest < -720) rest += 1440;
    return {
      minutes: dm,
      text: ('0' + Math.floor(dm / 60)).slice(-2) + ':' + ('0' + (dm % 60)).slice(-2),
      rest: rest
    };
  }

  /* =========================================================
     開催一覧の取得（winticket トップをパース）
     ========================================================= */
  function pickTodayScope(doc){
    /* 本日タブのパネルを優先。見つからない場合は文書全体にフォールバックし、
       「4セグメントのracecardリンクを持つ項目＝本日出走可能」で絞る。
       ★パネルIDに依存しきらないのは、IDが変わっても壊れないようにするため。 */
    var sel = ['#panel-autorace-race-today', '[id*="autorace-race-today"]', '[id*="race-today"]'];
    for(var i=0;i<sel.length;i++){
      var el = doc.querySelector(sel[i]);
      if(el) return { root:el, scoped:true };
    }
    return { root:doc, scoped:false };
  }

  function parseTop(html){
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var scope = pickTodayScope(doc);
    var items = scope.root.querySelectorAll('[class*="RecentRaceListItem___Wrapper"]');
    var out = [], seen = {};

    for(var i=0;i<items.length;i++){
      var el = items[i];

      /* リンク（出走可能なら racecard の4セグメント形式） */
      var a = el.querySelector('a[href*="/racecard/"]') || el.querySelector('a[href*="/raceresult/"]');
      if(!a) continue;
      var p = parseWtUrl(a.getAttribute('href'));
      if(!p) continue;

      /* 本日パネルが取れなかった場合は、4セグメント形式のものだけ採用する。
         昨日（終了）・明日（未定）は ?index= 形式なので自然に除外される。 */
      if(!scope.scoped && !p.full) continue;

      /* 同一開催の重複を除去（トップは同じカードが複数箇所に出ることがある） */
      var key = p.slug + '/' + p.meetingId + '/' + p.dayNum;
      if(seen[key]) continue;
      seen[key] = 1;

      var venueEl = el.querySelector('[class*="VenueName"]');
      if(!venueEl) continue;

      var gradeEl = el.querySelector('[class*="GradeIcon"]');
      var grade = (gradeEl && gradeEl.getAttribute('aria-label')) || '普通';

      /* 時間帯（CupIcon の title） */
      var session = '';
      /* CupIcon 直下の title。svgの入れ子が変わっても拾えるよう子孫指定にする */
      var cups = el.querySelectorAll('[class*="CupIcon"] title');
      if(!cups.length){
        /* aria-label にフォールバック（実サイトは span[aria-label] も持つ） */
        var al = el.querySelectorAll('[class*="CupIcon"][aria-label]');
        for(var q=0;q<al.length;q++){
          var v2 = al[q].getAttribute('aria-label');
          if(v2 === 'ナイター' || v2 === 'ミッドナイト' || v2 === 'モーニング') session = v2;
        }
      }
      for(var c=0;c<cups.length;c++){
        var lb = cups[c].textContent.trim();
        if(lb === 'ナイター' || lb === 'ミッドナイト' || lb === 'モーニング') session = lb;
      }

      /* 日目 */
      var dayEl = el.querySelector('[class*="RecentRaceListItem___Day"]');
      var day = dayEl ? dayEl.textContent.trim() : '';

      /* レース番号・発走時刻 */
      var rnoEl = el.querySelector('[class*="RaceNumber"]');
      var raceNo = p.raceNo;
      if(!raceNo && rnoEl){
        var rm = rnoEl.textContent.match(/(\d+)/);
        if(rm) raceNo = Number(rm[1]);
      }
      var timeEl = el.querySelector('time[class*="TimeText"]');
      var start = timeEl ? timeEl.textContent.trim() : '';

      /* 終了判定：raceresult リンク、または本文に「終了」 */
      var txt = el.textContent || '';
      var finished = (p.type === 'raceresult') || (!p.full && txt.indexOf('終了') >= 0);

      out.push({
        slug: p.slug,
        meetingId: p.meetingId,
        dayNum: p.dayNum,
        nextRace: raceNo || 1,
        start: start || null,
        grade: grade,
        session: session,
        day: day,
        status: finished ? 'done' : (start ? 'open' : 'tbd'),
        races: null   /* レース数は出走表側で確定する */
      });
    }
    return out;
  }

  /* 締切が近い順。終了した開催は末尾（Brainの並びと同じ考え方） */
  function sortMeetings(list){
    return list.slice().sort(function(a,b){
      var af = (a.status === 'done'), bf = (b.status === 'done');
      if(af && !bf) return 1;
      if(bf && !af) return -1;
      var ad = deadlineOf(a.start), bd = deadlineOf(b.start);
      var ar = ad ? ad.rest : 99999;
      var br = bd ? bd.rest : 99999;
      /* 締切を過ぎたものは、まだ先のものより後ろへ */
      if(ar < 0 && br >= 0) return 1;
      if(br < 0 && ar >= 0) return -1;
      return ar - br;
    });
  }

  /* 締切（発走-5分）到達までの残りミリ秒。秒精度で求める。
     ★deadlineOf の rest は分単位なので、発火タイミングの計算には使わない。 */
  function msUntilClose(start){
    var ci = closeInfo(start);
    if(!ci) return null;
    var now = new Date();
    var t = new Date(now.getTime());
    t.setHours(Math.floor(ci.minutes / 60), ci.minutes % 60, 0, 0);
    var ms = t.getTime() - now.getTime();
    if(ms < -12 * 3600 * 1000) ms += 24 * 3600 * 1000;   /* 日跨ぎ */
    return ms;
  }

  function showSkeleton(){
    var box = $('g1Cards');
    if(!box) return;
    box.innerHTML = '<div class="g1-load"><div class="g1-skel"></div>' +
                    '<div class="g1-skel" style="opacity:.7"></div>' +
                    '<div class="g1-skel" style="opacity:.45"></div></div>';
  }
  function showMsg(title, body, retry){
    var box = $('g1Cards');
    if(!box) return;
    box.innerHTML = '<div class="g1-msg"><div class="t">' + esc(title) + '</div><p>' + body + '</p>' +
      (retry ? '<button class="g1-retry" id="g1Retry" type="button">再読み込み</button>' : '') + '</div>';
    var r = $('g1Retry');
    if(r) r.addEventListener('click', function(){ loadMeetings(); });
  }

  var meetLoading = false;

  /* silent=true のときはスケルトンを出さず、既存カードを保ったまま裏で取り直す */
  function loadMeetings(silent){
    if(meetLoading) return;
    meetLoading = true;
    if(!silent) showSkeleton();

    /* ★キャッシュを外す。次のレースへ繰り上がったかを見るのが目的なので、
       古い応答を掴むとこの仕組み自体が意味を失う。 */
    var url = PROXY_URL + '?url=' + encodeURIComponent('https://www.winticket.jp/autorace') +
              '&_=' + Date.now();
    fetch(url, { cache:'no-store' }).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function(html){
      var list = parseTop(html);
      if(!list.length){
        MEETINGS = [];
        showMsg('NO RACE', '本日の開催はありません。', true);
        return;
      }
      MEETINGS = sortMeetings(list);
      renderCards(!!silent);
      startRefresh();
      scheduleAdvance();
      /* 直リンクで出走表を開いていた場合、開催情報が揃った時点でヘッダを描き直す */
      if(typeof route === 'function' && location.hash.indexOf('#/race/') === 0) route();
    }).catch(function(e){
      console.error('開催一覧の取得に失敗:', e);
      /* silent の場合は既存表示を壊さない */
      if(!silent){
        showMsg('ERROR', '開催情報を取得できませんでした。<br>通信状況を確認して再度お試しください。', true);
      }
    }).then(function(){
      meetLoading = false;
    });
  }

  /* ★次に締切を迎えるレースの「その瞬間」に取り直す。
     winticket のトップは締切を過ぎると次レースへ繰り上がるので、
     そのタイミングを狙って取り直せば表示が直ちに切り替わる。
     60秒ポーリングだけだと最大60秒ずれる。 */
  var advTimer = null;

  function scheduleAdvance(){
    if(advTimer){ clearTimeout(advTimer); advTimer = null; }
    var soonest = null;
    for(var i=0;i<MEETINGS.length;i++){
      var m = MEETINGS[i];
      if(m.status !== 'open' || !m.start) continue;
      var ms = msUntilClose(m.start);
      if(ms === null) continue;
      if(ms > 0 && (soonest === null || ms < soonest)) soonest = ms;
    }
    if(soonest === null) return;
    /* 締切到達の少し後に取りに行く（配信側の反映待ち） */
    var wait = soonest + 8000;
    if(wait > 30 * 60 * 1000) wait = 30 * 60 * 1000;   /* 遠すぎる場合は30分で一度見直す */
    advTimer = setTimeout(function(){
      advTimer = null;
      loadMeetings(true);
    }, wait);
  }

  /* 1分ごとに並べ替え＋再描画（アニメーションなし）。Brainと同じ間隔。 */
  /* 1分ごとに並べ替え＋再描画（カウントダウン表示の更新用）。
     ★これは表示の更新だけで、繰り上がりの検知は scheduleAdvance が担う。
       締切を過ぎたレースを抱えている場合は保険として取り直す。 */
  function startRefresh(){
    if(refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(function(){
      if(isTransitioning) return;
      if(location.hash && location.hash.indexOf('#/race/') === 0) return;  /* 出走表表示中は触らない */

      var stale = false;
      for(var i=0;i<MEETINGS.length;i++){
        var m = MEETINGS[i];
        if(m.status !== 'open' || !m.start) continue;
        var ci = closeInfo(m.start);
        if(ci && ci.ended){ stale = true; break; }
      }
      if(stale){ loadMeetings(true); return; }

      MEETINGS = sortMeetings(MEETINGS);
      renderCards(true);
    }, 60000);
  }

  /* =========================================================
     ホーム：開催カード
     Brain app.html の renderVenueCards / selectVenue の流れを踏襲。
     ========================================================= */

  var SLOT_ICON = {
    day:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" fill="#F4792A"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="#F4792A" stroke-width="2" stroke-linecap="round"/></svg>',
    morning:'<svg viewBox="0 0 24 24" fill="none"><defs><clipPath id="g1hz"><rect x="0" y="0" width="24" height="16"/></clipPath></defs><g clip-path="url(#g1hz)"><circle cx="12" cy="16" r="7" fill="#FFB300"/></g><path d="M12 2v3M4.22 6.22l2.12 2.12M19.78 6.22l-2.12 2.12M2 14h3M19 14h3" stroke="#FFB300" stroke-width="2" stroke-linecap="round"/><path d="M3 20h18" stroke="#FFB300" stroke-width="2" stroke-linecap="round"/></svg>',
    nighter:'<svg viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" fill="#8BB8E8"/></svg>',
    midnight:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 2l1.09 3.36h3.53l-2.86 2.08 1.09 3.36L12 8.72l-2.85 2.08 1.09-3.36-2.86-2.08h3.53L12 2z" fill="#8E7BD6"/><path d="M5 10l.65 2h2.1l-1.7 1.24.65 2L5 14.02l-1.7 1.22.65-2-1.7-1.24h2.1L5 10z" fill="#8E7BD6"/><path d="M19 15l.52 1.6h1.68l-1.36 1 .52 1.6-1.36-.98-1.36.98.52-1.6-1.36-1h1.68L19 15z" fill="#8E7BD6"/></svg>'
  };
  function slotKey(s){
    if(s === 'ナイター') return 'nighter';
    if(s === 'ミッドナイト') return 'midnight';
    if(s === 'モーニング') return 'morning';
    return 'day';
  }
  function gradeKey(g){
    var t = String(g || '').replace(/\s/g,'');
    if(t === 'SG') return 'sg';
    if(t === 'GI'  || t === 'ＧⅠ') return 'g1';
    if(t === 'GII' || t === 'ＧⅡ') return 'g2';
    if(t === 'GIII'|| t === 'ＧⅢ') return 'g3';
    return 'normal';
  }

  function cardHTML(m, i){
    var v = VENUE[m.slug] || { jp:m.slug, roma:m.slug.toUpperCase() };
    var fin = (m.status === 'done');
    var raceNum = m.nextRace || 1;

    /* 右側の表示内容（Brainの topContent と同じ分岐） */
    var right;
    if(fin){
      right = '<span class="gc-fin">終了</span>';
    }else{
      var d = deadlineOf(m.start);
      if(d && d.rest <= 25 && d.rest > 0){
        right = '<span class="gc-count"><span class="gc-count-dot"></span>締切' + d.rest + '分前</span>';
      }else if(d && d.rest > 0){
        right = '<span class="gc-start"><span class="gc-start-label">締切</span>' + esc(d.text) + '</span>';
      }else{
        right = '<span class="gc-start"><span class="gc-start-label">発走</span>' +
                esc(m.start || '--:--') + '</span>';
      }
    }

    return '<button class="g1-card' + (fin ? ' finished' : '') + '" type="button"' +
             ' data-idx="' + i + '"' +
             ' style="transition-delay:' + (i * 70) + 'ms">' +
             '<div class="gc-main">' +
               '<div class="gc-left">' +
                 '<div class="gc-name-row">' +
                   '<span class="gc-name">' + esc(v.jp) + '<span class="r">' + esc(raceNum) + 'R</span></span>' +
                   '<span class="gc-grade grade-' + gradeKey(m.grade) + '">' + esc(m.grade) + '</span>' +
                   '<span class="gc-slot">' + SLOT_ICON[slotKey(m.session)] + '</span>' +
                 '</div>' +
                 '<span class="gc-day">' + esc(m.day || '') + '</span>' +
               '</div>' +
               '<div class="gc-right">' + right + '</div>' +
             '</div>' +
           '</button>';
  }

  function renderCards(noAnim){
    var box = $('g1Cards');
    if(!box) return;
    var html = '';
    for(var i=0;i<MEETINGS.length;i++) html += cardHTML(MEETINGS[i], i);
    box.innerHTML = html;

    var cards = box.querySelectorAll('.g1-card');
    var k;
    if(noAnim){
      for(k=0;k<cards.length;k++){ cards[k].style.transitionDelay = '0ms'; cards[k].classList.add('in'); }
    }else if('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(es){
        for(var j=0;j<es.length;j++){
          if(es[j].isIntersecting){ es[j].target.classList.add('in'); io.unobserve(es[j].target); }
        }
      }, { threshold:0.15, rootMargin:'0px 0px -6% 0px' });
      for(k=0;k<cards.length;k++) io.observe(cards[k]);
    }else{
      for(k=0;k<cards.length;k++) cards[k].classList.add('in');
    }
  }

  /* --- タップ：Brain の selectVenue と同じ演出順 --- */
  function selectMeeting(card, ev){
    if(isTransitioning) return;
    isTransitioning = true;

    var idx = Number(card.getAttribute('data-idx'));
    var m = MEETINGS[idx];
    if(!m){ isTransitioning = false; return; }

    /* 1. 選択したカード以外を下へスライドアウト */
    var all = document.querySelectorAll('.g1-card');
    for(var i=0;i<all.length;i++){
      if(all[i] !== card) all[i].classList.add('slide-out');
    }

    /* 2. タップ位置からバースト＋キラーン */
    if(ev && typeof ev.clientX === 'number'){
      var r = card.getBoundingClientRect();
      card.style.setProperty('--tap-x', (ev.clientX - r.left) + 'px');
      card.style.setProperty('--tap-y', (ev.clientY - r.top) + 'px');
      card.classList.add('tapped');
      setTimeout(function(){ card.classList.remove('tapped'); }, 400);
    }
    card.classList.add('shimmer');

    /* 3. スライドアウトが終わってから遷移 */
    setTimeout(function(){
      isTransitioning = false;
      location.hash = '#/race/' + m.slug + '/' + m.meetingId + '/' + m.dayNum + '/' + (m.nextRace || 1);
    }, 420);
  }

  /* =========================================================
     出走表 / オッズ / 結果 の描画
     ========================================================= */
  var curTab  = 'basic';  /* 出走表サブタブ basic|detail */
  var curTop  = 'card';   /* 上位タブ card|odds|result */
  var curBet  = 't3';     /* オッズ券種 */
  var curAxis = 1;        /* 3連単=1着 / 3連複=軸 */

  /* 発売券種7種。出走表ページ・結果ページの両方に出ていることを実URLで確認済み */
  var BETS = [
    { k:'t3',    n:'3連単',  type:'tri'  },
    { k:'f3',    n:'3連複',  type:'tri'  },
    { k:'t2',    n:'2連単',  type:'perm' },
    { k:'f2',    n:'2連複',  type:'comb' },
    { k:'win',   n:'単勝',   type:'one'  },
    { k:'place', n:'複勝',   type:'one'  },
    { k:'wide',  n:'ワイド', type:'comb' }
  ];
  function betOf(k){
    for(var i=0;i<BETS.length;i++){ if(BETS[i].k === k) return BETS[i]; }
    return BETS[0];
  }

  /* =========================================================
     出走表の取得＋パース（winticket・SSR）

     ★セレクタをクラス名に依存させていない。
       winticket のクラス名はハッシュ付き（例 RecentRaceListItem___Wrapper-sc-eeb4a825-0）で
       ビルドのたびに変わり得るため、出走表側は
         「テーブルの見出し文字列から列位置を求める」
       方式にしてある。列の並びが変わっても追従する。
     ========================================================= */

  var CARD_CACHE = {};   /* key: slug/mid/day/race → パース済みデータ */

  function wtRacecardUrl(slug, mid, dayNum, raceNo){
    return 'https://www.winticket.jp/autorace/' + slug + '/racecard/' + mid + '/' + dayNum + '/' + raceNo;
  }

  /* thead の colspan/rowspan を展開して、列ごとの「親見出し／子見出し」を得る */
  function headerMap(table){
    var head = table.tHead;
    if(!head || !head.rows.length) return null;
    var grid = [], r, c, i, dr, dc;
    for(r=0;r<head.rows.length;r++) grid[r] = [];
    for(r=0;r<head.rows.length;r++){
      c = 0;
      for(i=0;i<head.rows[r].cells.length;i++){
        while(grid[r][c] !== undefined) c++;
        var cell = head.rows[r].cells[i];
        var cs = cell.colSpan || 1, rs = cell.rowSpan || 1;
        var t = (cell.textContent || '').replace(/\s+/g, '');
        for(dr=0;dr<rs;dr++){
          if(!grid[r+dr]) grid[r+dr] = [];
          for(dc=0;dc<cs;dc++) grid[r+dr][c+dc] = t;
        }
        c += cs;
      }
    }
    var top = grid[0] || [];
    var leaf = grid[grid.length - 1] || [];
    return { top:top, leaf:leaf, n:Math.max(top.length, leaf.length) };
  }

  /* 親見出し・子見出しの部分一致で列番号を引く */
  function colOf(hm, topPat, leafPat){
    for(var c=0;c<hm.n;c++){
      var t = hm.top[c] || '', l = hm.leaf[c] || '';
      if(topPat && t.indexOf(topPat) < 0) continue;
      if(leafPat && l.indexOf(leafPat) < 0) continue;
      return c;
    }
    return -1;
  }

  /* セル内の「上下2段」を分解。要素で分かれていればそれを使い、
     つながっていた場合だけ正規表現で割る */
  function cellLines(td){
    if(!td) return [];
    var out = [], kids = td.children, i;
    for(i=0;i<kids.length;i++){
      var t = (kids[i].textContent || '').replace(/\s+/g, ' ').trim();
      if(t) out.push(t);
    }
    if(out.length >= 2) return out;
    var whole = (td.textContent || '').replace(/\s+/g, ' ').trim();
    return whole ? [whole] : [];
  }
  function txt(td){
    return td ? (td.textContent || '').replace(/\s+/g, ' ').trim() : '';
  }

  /* ヘッダ情報が入っている最小の要素を探す（クラス名に依存しないため） */
  function headerScope(doc){
    var best = null;
    var all = doc.querySelectorAll('h1, header, section, div');
    for(var i=0;i<all.length;i++){
      var t = all[i].textContent || '';
      if(t.indexOf('発走') >= 0 && t.indexOf('締切') >= 0 && t.indexOf('周)') >= 0){
        if(!best || t.length < (best.textContent || '').length) best = all[i];
      }
    }
    return best || doc.body;
  }

  var CLASS_WORDS = ['特別選抜戦','選抜戦','準決勝戦','優勝戦','一般戦','予選'];
  var GRADE_WORDS = ['SG','ＧⅠ','ＧⅡ','ＧⅢ','GI','GII','GIII','普通'];
  var SESSION_WORDS = ['ミッドナイト','ナイター','モーニング'];
  var TRACK_WORDS = ['良走路','湿走路','荒走路','渇走路','重走路','不良走路'];

  function pickWord(text, words){
    for(var i=0;i<words.length;i++){ if(text.indexOf(words[i]) >= 0) return words[i]; }
    return '';
  }

  function parseRacecard(html, slug, mid, dayNum, raceNo){
    var doc = new DOMParser().parseFromString(html, 'text/html');

    /* ---- レース情報 ---- */
    var hs = headerScope(doc);
    var ht = (hs.textContent || '').replace(/\s+/g, ' ');

    var mStart = ht.match(/発走\s*(\d{1,2}:\d{2})/);
    var mClose = ht.match(/締切\s*(\d{1,2}:\d{2})/);
    var mDate  = ht.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
    var mDist  = ht.match(/([\d,]+)\s*m\s*\(\s*(\d+)\s*周\s*\)/);
    var mTemp  = ht.match(/気温\s*([\d.]+)\s*℃/);
    var mHumid = ht.match(/湿度\s*([\d.]+)\s*[％%]/);
    var mTrack = ht.match(/(良走路|湿走路|荒走路|渇走路|重走路|不良走路)\s*\/\s*([\d.]+)\s*℃/);
    var mWx    = ht.match(/(晴|曇|雨|小雨|雪|霧)\s*(?:気温|\/|$|\s)/);

    /* レース名はタイトルから拾うのが最も安定 */
    var title = (doc.querySelector('title') || {}).textContent || '';
    var mName = title.match(/オートレース\s*(.+?)\s*[（(]\d{4}年\d{1,2}月\d{1,2}日[)）]/);

    /* ---- レース番号ナビ（レース数とレース種別） ---- */
    var navRaces = {}, maxR = Number(raceNo) || 1;
    var links = doc.querySelectorAll('a[href*="/racecard/"]');
    for(var i=0;i<links.length;i++){
      var hm2 = (links[i].getAttribute('href') || '').match(/\/racecard\/\d{10}\/\d+\/(\d+)(?:[?#]|$)/);
      if(!hm2) continue;
      var no = Number(hm2[1]);
      if(no > maxR) maxR = no;
      var lt = (links[i].textContent || '').replace(/\s+/g, ' ').trim();
      var cw = pickWord(lt, CLASS_WORDS);
      if(cw) navRaces[no] = cw;
    }

    /* ---- 出走表テーブル ---- */
    /* 見出しセルが最も多いテーブル＝全カラムを持つ本表 */
    var tables = doc.querySelectorAll('table'), table = null, bestN = 0;
    for(i=0;i<tables.length;i++){
      var hmX = headerMap(tables[i]);
      if(hmX && hmX.n > bestN){ bestN = hmX.n; table = tables[i]; }
    }
    if(!table) throw new Error('出走表テーブルが見つかりません');
    var hm = headerMap(table);

    var IX = {
      no    : colOf(hm, '車', null),
      name  : colOf(hm, '選手名', null),
      handi : colOf(hm, 'ハンデ', null),
      shiso : colOf(hm, '試走T', null),
      p     : colOf(hm, '審査P', null),
      hare  : colOf(hm, '予想', '晴'),
      ame   : colOf(hm, '予想', '雨'),
      z1    : colOf(hm, '前10走', '1'),
      z2    : colOf(hm, '前10走', '2'),
      z3    : colOf(hm, '前10走', '3'),
      zo    : colOf(hm, '前10走', '外'),
      avgS  : colOf(hm, '良10走', '平均試走'),
      avgR  : colOf(hm, '良10走', '平均競走'),
      bestR : colOf(hm, '良10走', '最高競走'),
      d90a  : colOf(hm, '近90日', '2連対率'),
      d90b  : colOf(hm, '近90日', '3連対率'),
      dGa   : colOf(hm, '(良)', '2連対率'),
      dGb   : colOf(hm, '(良)', '3連対率'),
      dWa   : colOf(hm, '(湿)', '2連対率'),
      dWb   : colOf(hm, '(湿)', '3連対率'),
      yu    : colOf(hm, '優出', null),
      car   : colOf(hm, '車名', null)
    };
    if(IX.no < 0 || IX.name < 0){
      throw new Error('出走表の列見出しを認識できません');
    }

    var body = table.tBodies[0];
    if(!body) throw new Error('出走表の中身がありません');

    var racers = [], rows = body.rows, ri = 0;
    while(ri < rows.length){
      var row = rows[ri];
      var cells = row.cells;
      /* 車番が数字でない行（着別度数の行など）は主行として扱わない */
      var noTxt = txt(cells[IX.no] || null);
      var nm = noTxt.match(/^(\d+)$/);
      if(!nm){ ri++; continue; }

      var get = function(idx){ return (idx >= 0 && cells[idx]) ? cells[idx] : null; };

      /* 選手名セル：リンクが選手名、残りが 期/年齢/所属 */
      var nameCell = get(IX.name);
      var a = nameCell ? nameCell.querySelector('a') : null;
      var pname = a ? (a.textContent || '').trim() : '';
      var attr = txt(nameCell);
      if(pname) attr = attr.replace(pname, '').trim();
      var am = attr.match(/(\d+期)\s*(\d+歳)\s*(\S+)/);
      var pid = '';
      if(a){
        var pm = (a.getAttribute('href') || '').match(/autoracer\/(\d+)/);
        if(pm) pid = pm[1];
      }
      if(!pname){
        /* リンクが無い場合は先頭の日本語名だけ取る */
        var fm = attr.match(/^(\D+?)(?=\d+期)/);
        pname = fm ? fm[1].trim() : attr;
      }

      /* ハンデ / ST */
      var hl = cellLines(get(IX.handi)), handi = '', st = '';
      if(hl.length >= 2){ handi = hl[0]; st = hl[1]; }
      else if(hl.length === 1){
        var hmm = hl[0].match(/^(\d+m)\s*([\d.]+)$/);
        if(hmm){ handi = hmm[1]; st = hmm[2]; } else { handi = hl[0]; }
      }

      /* 試走T / 偏差 */
      var sl = cellLines(get(IX.shiso)), shiso = '', hensa = '';
      if(sl.length >= 2){ shiso = sl[0]; hensa = sl[1]; }
      else if(sl.length === 1){
        /* ★試走Tは再試走時に「再」が付く（例: 再3.50）。
           これを見落とすと「再3.500.089」のまま桁が崩れる（12節 #11） */
        var smm = sl[0].match(/^(再?\s*\d+\.\d{2})(\d+\.\d+)$/);
        if(smm){ shiso = smm[1].replace(/\s+/g,''); hensa = smm[2]; } else { shiso = sl[0]; }
      }

      /* 審査P / 現ランク(前) */
      var pl = cellLines(get(IX.p)), pp = '', rank = '', prev = '';
      var rankRaw = '';
      if(pl.length >= 2){ pp = pl[0]; rankRaw = pl[1]; }
      else if(pl.length === 1){
        var pmm = pl[0].match(/^([\d.]+)([A-Z]+-.*)$/);
        if(pmm){ pp = pmm[1]; rankRaw = pmm[2]; } else { pp = pl[0]; }
      }
      var rm = rankRaw.match(/^([A-Z]+-\d+)\s*\(\s*(.+?)\s*\)$/);
      if(rm){ rank = rm[1]; prev = rm[2]; } else { rank = rankRaw; }

      /* 優出 / 今年V・通算V */
      var yl = cellLines(get(IX.yu)), yu = '', vv = '';
      if(yl.length >= 2){ yu = yl[0]; vv = yl[1]; }
      else if(yl.length === 1){
        var ymm = yl[0].match(/^(\d+回)\s*(\d+\/\d+)$/);
        if(ymm){ yu = ymm[1]; vv = ymm[2]; } else { yu = yl[0]; }
      }

      /* 車名(車級) */
      var carRaw = txt(get(IX.car)), car = carRaw, cc = '';
      var cm = carRaw.match(/^(.+?)\s*\(\s*(\S+?級)\s*\)$/);
      if(cm){ car = cm[1]; cc = cm[2]; }

      /* 次の行が着別度数（n-n-n-n が並ぶ行）なら取り込む */
      var counts = [];
      var nx = rows[ri + 1];
      if(nx){
        var nxNo = txt(nx.cells[IX.no] || null);
        if(!/^\d+$/.test(nxNo)){
          /* ★行全体でマッチさせるとセル間で数字が連結して誤分割するため、
             必ずセル単位で照合する（例: 2-3-1-35 と 0-2-0-47 が 2-3-1-350 になる） */
          for(var ci=0; ci<nx.cells.length; ci++){
            var t2 = txt(nx.cells[ci]);
            if(/^\d+-\d+-\d+-\d+$/.test(t2)) counts.push(t2);
          }
        }
      }

      racers.push({
        no: Number(nm[1]),
        pid: pid,
        name: pname,
        ki: am ? am[1] : '',
        age: am ? am[2] : '',
        belong: am ? am[3] : '',
        handi: handi, st: st,
        shiso: shiso, hensa: hensa,
        p: pp, rank: rank, prev: prev,
        hare: txt(get(IX.hare)), ame: txt(get(IX.ame)),
        z10: [txt(get(IX.z1)), txt(get(IX.z2)), txt(get(IX.z3)), txt(get(IX.zo))],
        avgS: txt(get(IX.avgS)), avgR: txt(get(IX.avgR)), bestR: txt(get(IX.bestR)),
        d90: [txt(get(IX.d90a)), txt(get(IX.d90b)), counts[0] || ''],
        dG : [txt(get(IX.dGa)),  txt(get(IX.dGb)),  counts[1] || ''],
        dW : [txt(get(IX.dWa)),  txt(get(IX.dWb)),  counts[2] || ''],
        yu: yu, v: vv,
        car: car, cc: cc
      });
      ri += (counts.length ? 2 : 1);
    }

    if(!racers.length) throw new Error('出走選手を取得できませんでした');

    return {
      slug: slug, meetingId: mid, dayNum: Number(dayNum), raceNo: Number(raceNo),
      races: maxR,
      raceClasses: navRaces,
      title: mName ? mName[1].replace(/\u3000/g, ' ').trim() : '',
      cls: pickWord(ht, CLASS_WORDS) || navRaces[Number(raceNo)] || '',
      grade: pickWord(ht, GRADE_WORDS) || '',
      session: pickWord(ht, SESSION_WORDS) || '',
      start: mStart ? mStart[1] : '',
      close: mClose ? mClose[1] : '',
      date: mDate ? (mDate[1] + '年' + Number(mDate[2]) + '月' + Number(mDate[3]) + '日') : '',
      ymd : mDate ? (mDate[1] + ('0'+mDate[2]).slice(-2) + ('0'+mDate[3]).slice(-2)) : '',
      dist: mDist ? (mDist[1] + 'm') : '',
      laps: mDist ? (mDist[2] + '周') : '',
      weather: mWx ? mWx[1] : '',
      temp: mTemp ? (mTemp[1] + '℃') : '',
      humid: mHumid ? (mHumid[1] + '%') : '',
      track: mTrack ? mTrack[1] : '',
      trackTemp: mTrack ? (mTrack[2] + '℃') : '',
      racers: racers
    };
  }

  function loadRace(slug, mid, dayNum, raceNo, cb){
    var key = slug + '/' + mid + '/' + dayNum + '/' + raceNo;
    if(CARD_CACHE[key]){ cb(null, CARD_CACHE[key]); return; }

  function noteHTML(what){

      'winticket の' + what + 'はサーバーレンダリングされておらず、HTML取得では値が返りません。' +
