<style>
  :root{
    /* ===== GO1 カラーテーマ（ヘッダー画像から抽出：黒・金・白） ===== */
    --bg:#000000;
    --gold-br:#ffdb5b;          /* 画像内の最も明るい金 */
    --gold-lt:#f3e3b8;          /* 淡金（白寄り） */
    --gold:#d9b45f;             /* 基準金 */
    --gold-dp:#8c6a2f;          /* 深金 */
    --wht:#ffffff;
    --txt:rgba(255,255,255,.92);
    --sub:rgba(255,255,255,.5);
    --faint:rgba(255,255,255,.3);
    --line:rgba(217,180,95,.16); /* 金を含んだヘアライン */
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{background:var(--bg);}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:'Noto Sans JP',sans-serif;
    min-height:100vh;
    overflow-x:clip;              /* スライドイン待機位置による横スクロールを抑止 */
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  #page{display:flex;flex-direction:column;min-height:100vh;}

  /* ===== ステージ（ヘッダー画像＋見出し＋スパークル層の共通座標系） ===== */
  .g1-stage{position:relative;background:var(--bg);}

  /* ===== ヘッダー画像（フェードイン） ===== */
  .g1-header{
    display:flex;justify-content:center;
    padding:max(6px, env(safe-area-inset-top)) 0 0;
  }
  .g1-header img{
    display:block;
    width:100%;max-width:860px;height:auto;
    opacity:0;
    transform:scale(1.012);
    transition:opacity 1.1s ease, transform 1.4s cubic-bezier(.22,1,.36,1);
  }
  .g1-stage.loaded .g1-header img{opacity:1;transform:none;}

  /* ===== スパークル層（ヘッダー画像より前面。画像の明部を発生源に降下） ===== */
  .g1-sparkle{
    position:absolute;left:0;top:0;
    width:100%;height:100%;
    z-index:3;
    pointer-events:none;
    opacity:0;
    transition:opacity 1.8s ease .4s;
  }
  .g1-stage.loaded .g1-sparkle{opacity:1;}

  /* ヘッダー画像と見出しの間隔（画像側へ寄せる） */
  .g1-gap{min-height:clamp(10px,4.4vh,40px);}

  /* ===== 見出し（スクロールで右から2段時間差スライドイン） ===== */
  .g1-hero{
    position:relative;z-index:2;
    padding:0 16px;
    overflow:hidden;              /* 待機位置のはみ出しをクリップ */
  }
  .g1-line{
    opacity:0;
    transform:translate3d(72px,0,0);
    transition:opacity .82s cubic-bezier(.22,1,.36,1),
               transform .95s cubic-bezier(.22,1,.36,1);
    will-change:opacity,transform;
  }
  .g1-hero.in .g1-l1{opacity:1;transform:none;}
  .g1-hero.in .g1-l2{opacity:1;transform:none;transition-delay:.56s;}
  .g1-hero.in .g1-l3{opacity:1;transform:none;transition-delay:1.02s;}

  .g1-l1{
    font-family:'Noto Sans JP',sans-serif;
    font-weight:900;
    font-size:clamp(24px,8.2vw,54px);
    line-height:1.26;
    letter-spacing:.01em;
    color:var(--wht);
  }
  .g1-l1 .mk{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:.02em;
    padding-right:.12em;
    background:linear-gradient(100deg,var(--gold-dp) 0%,var(--gold) 34%,var(--gold-br) 62%,var(--gold-lt) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
  }
  .g1-l2{
    margin-top:clamp(24px,6.8vw,42px);
    font-family:'Oswald',sans-serif;
    font-weight:400;
    font-size:clamp(21px,6.4vw,36px);
    letter-spacing:.26em;
    background:linear-gradient(90deg,var(--gold) 0%,var(--gold-br) 46%,var(--gold-lt) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
  }

  /* 3段目：構築中の注記。1〜2段目と同じ .g1-line で文字群ごとスライドインさせる */
  .g1-l3{
    margin-top:clamp(20px,5.6vw,34px);
    font-family:'Noto Sans JP',sans-serif;
    font-weight:400;
    font-size:clamp(14px,4.3vw,21px);
    line-height:1.95;
    letter-spacing:.04em;
    color:rgba(255,255,255,.52);
  }

  /* 今後のメインコンテンツ用の余白（見出しの下に確保） */
  .g1-slot{min-height:22vh;}

  .g1-main{flex:1;background:var(--bg);}

  /* ===== フッター（result.html db-footer をGO1配色で流用） ===== */
  .db-footer{
    background:var(--bg);
    border-top:1px solid var(--line);
    padding:22px 20px;
    padding-bottom:max(26px, env(safe-area-inset-bottom));
  }
  .db-footer .brand{
    text-align:center;
    font-family:'Oswald',sans-serif;font-size:15px;font-weight:400;
    letter-spacing:.06em;color:rgba(255,255,255,.78);
    margin-bottom:7px;padding-left:.06em;
  }
  .db-footer .brand::after{
    content:'';display:block;width:34px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--gold-dp) 0%,var(--gold) 46%,var(--gold-br) 78%,var(--gold-lt) 100%);
    margin:8px auto 0;opacity:.95;
  }
  .db-divider{height:1px;background:rgba(217,180,95,.14);margin:0 0 16px;}

  .db-nav{
    display:flex;justify-content:center;align-items:center;
    gap:20px;margin-bottom:16px;
  }
  .db-nav a{
    display:inline-flex;align-items:center;gap:6px;
    font-family:'Oswald',sans-serif;font-size:13px;font-weight:400;letter-spacing:.05em;
    color:rgba(255,255,255,.62);text-decoration:none;
    transition:color .2s;
  }
  .db-nav a svg{width:11px;height:11px;fill:currentColor;flex:0 0 11px;opacity:.85;}
  .db-nav a:hover,.db-nav a:focus-visible{color:var(--gold-lt);}
  .db-nav .x-mark{
    font-family:'Oswald',sans-serif;font-size:12px;
    color:var(--gold);opacity:.7;user-select:none;
  }

  .db-copy{
    text-align:center;font-size:10px;letter-spacing:.05em;
    color:rgba(255,255,255,.35);
  }

  /* ===== アクセシビリティ ===== */
  a:focus-visible{outline:1px solid var(--gold);outline-offset:3px;border-radius:2px;}

  @media (prefers-reduced-motion:reduce){
    .g1-header img,.g1-line,.g1-sparkle{transition:none;}
    .g1-header img{opacity:1;transform:none;}
    .g1-line{opacity:1;transform:none;}
    .g1-sparkle{opacity:1;}
  }

  /* =========================================================
     ビュー切替（ホーム / 出走表）
     ========================================================= */
  .view{display:block;}
  .view[hidden]{display:none;}
  #viewRace{
    opacity:0;transform:translate3d(28px,0,0);
    transition:opacity .34s ease, transform .42s cubic-bezier(.22,1,.36,1);
  }
  #viewRace.shown{opacity:1;transform:none;}
  #viewHome.leaving{opacity:0;transition:opacity .2s ease;}

  /* =========================================================
     セクション見出し
     ========================================================= */
  .g1-sec{padding:0 16px;margin-bottom:16px;}
  .g1-sec h2{
    font-family:'Noto Sans JP',sans-serif;font-weight:900;
    font-size:clamp(17px,4.6vw,24px);letter-spacing:.02em;color:var(--wht);
    display:flex;align-items:baseline;gap:10px;
  }
  .g1-sec h2::before{
    content:'';width:3px;height:1em;border-radius:2px;flex:0 0 3px;
    background:linear-gradient(180deg,var(--gold-br),var(--gold-dp));
    transform:translateY(.08em);
  }
  .g1-sec .sub{
    display:block;margin:6px 0 0 13px;
    font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.16em;
    color:rgba(255,255,255,.36);
  }

  /* =========================================================
     開催カード
     Brain app.html の .venue-card の構造・配置・挙動を踏襲し、
     ダークガラス＋GO1配色（黒・金・白）に置き換えたもの。

     Brainからそのまま引き継いだ設計：
       ・1行目に「会場名 + R番号」→ グレードバッジ → 時間帯アイコン を横並び
       ・その下に開催日（2日目・最終日など）
       ・右側に締切／発走／終了を右寄せ配置
       ・締切25分前を切ったらカウントダウン（ドット明滅）に切り替え
       ・カード全体で1つの押せる面。区切り線を持たない1ブロック構成
       ・出現は translateY(30px) → 0
       ・待機時は shadowFloat で影がゆっくり呼吸する
       ・:active で scale(.96) して影を縮める
       ・上のカードほど z-index を高くして影が下のカードに負けないようにする
     ========================================================= */
  .g1-cards{padding:0 16px 40px;}

  .g1-card{
    position:relative;display:block;width:100%;text-align:left;
    border:0;font:inherit;color:inherit;cursor:pointer;
    padding:18px;margin-bottom:18px;min-height:80px;
    border-radius:16px;
    -webkit-tap-highlight-color:transparent;

    /* ガラス感：背面を透過させつつ、白のごく淡いフィルムを重ねる */
    background:linear-gradient(145deg, rgba(30,30,32,.62) 0%, rgba(12,12,13,.58) 100%);
    backdrop-filter:blur(14px) saturate(130%);
    -webkit-backdrop-filter:blur(14px) saturate(130%);
    border:1px solid rgba(217,180,95,.16);

    /* 背面影＋内側の縁取り（Brainの4段構成をダーク用に反転） */
    box-shadow:
      0 4px 14px rgba(0,0,0,.55),
      0 2px 6px rgba(0,0,0,.4),
      inset 0 1px 0 rgba(255,255,255,.07),
      inset 0 -1px 0 rgba(0,0,0,.5);

    opacity:0;transform:translateY(30px);
    transition:opacity .5s ease, transform .5s cubic-bezier(.22,1,.36,1), box-shadow .2s;
    overflow:hidden;
  }
  /* 上のカードを前面に（影が下のカードを隠さないように） */
  .g1-card:nth-child(1){z-index:20;}
  .g1-card:nth-child(2){z-index:19;}
  .g1-card:nth-child(3){z-index:18;}
  .g1-card:nth-child(4){z-index:17;}
  .g1-card:nth-child(5){z-index:16;}
  .g1-card:nth-child(6){z-index:15;}
  .g1-card:nth-child(n+7){z-index:10;}

  /* 上半分のガラス光沢 */
  .g1-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:50%;
    background:linear-gradient(180deg, rgba(255,255,255,.055) 0%, rgba(255,255,255,0) 100%);
    border-radius:16px 16px 0 0;pointer-events:none;
  }
  /* 斜めの微光沢（金を薄く走らせる） */
  .g1-card::after{
    content:'';position:absolute;inset:0;border-radius:16px;pointer-events:none;
    background:linear-gradient(112deg,
      rgba(255,255,255,0) 34%,
      rgba(243,227,184,.05) 48%,
      rgba(255,255,255,0) 61%);
  }

  .g1-card.in{
    opacity:1;transform:translateY(0);
    animation:g1ShadowFloat 4s ease-in-out infinite;
  }
  @keyframes g1ShadowFloat{
    0%,100%{box-shadow:0 4px 14px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07),inset 0 -1px 0 rgba(0,0,0,.5);}
    50%    {box-shadow:0 8px 22px rgba(0,0,0,.62),0 3px 9px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07),inset 0 -1px 0 rgba(0,0,0,.5);}
  }
  .g1-card:active{
    animation:none;
    transform:scale(.96);
    background:linear-gradient(145deg, rgba(42,38,28,.7) 0%, rgba(18,16,12,.66) 100%);
    border-color:rgba(217,180,95,.3);
    box-shadow:
      0 2px 8px rgba(0,0,0,.5),
      0 1px 3px rgba(0,0,0,.35),
      inset 0 1px 0 rgba(255,255,255,.05);
    transition:transform .1s ease, background .1s ease;
  }
  .g1-card.finished{opacity:.5;}
  .g1-card.finished.in{animation:none;}

  /* ---- 内部レイアウト（Brainと同一構成） ---- */
  .gc-main{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .gc-left{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .gc-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

  .gc-name{
    font-family:'Noto Sans JP',sans-serif;
    font-size:22px;font-weight:700;letter-spacing:.02em;
    color:#fff;
  }
  .gc-name .r{
    font-family:'Oswald',sans-serif;font-weight:500;
    background:linear-gradient(100deg,var(--gold) 0%,var(--gold-br) 55%,var(--gold-lt) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    margin-left:.32em;
  }

  /* グレードバッジ：Brainの立体バッジをそのままの作りで金基調に */
  .gc-grade{
    display:inline-flex;align-items:center;justify-content:center;
    padding:1px 6px;border-radius:3px;
    font-family:'Noto Sans JP',sans-serif;
    font-size:12px;font-weight:900;color:#fff;letter-spacing:.04em;
    -webkit-text-stroke:.3px rgba(0,0,0,.2);
    text-shadow:0 -1px 1px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.2);
    box-shadow:0 2px 4px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.3);
  }
  /* オートレースのグレード体系 */
  .grade-normal{background:linear-gradient(180deg,#5a5d68 0%,#3c3f48 50%,#2c2f36 100%);}
  .grade-g3{background:linear-gradient(180deg,#4caf50 0%,#2e8b32 50%,#1b6e20 100%);}
  .grade-g2{background:linear-gradient(180deg,#b040c8 0%,#8e24aa 50%,#6a1b80 100%);}
  .grade-g1{background:linear-gradient(180deg,#ef4444 0%,#c62828 50%,#a01e1e 100%);}
  .grade-sg{background:linear-gradient(180deg,#ffd700 0%,#d4a800 50%,#b08e00 100%);color:#0f0f0f;text-shadow:0 1px 0 rgba(255,255,255,.3),0 -1px 1px rgba(0,0,0,.15);}

  .gc-slot{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;}
  .gc-slot svg{width:16px;height:16px;}

  .gc-day{
    font-family:'Noto Sans JP',sans-serif;
    font-size:12px;font-weight:500;color:rgba(255,255,255,.42);
  }

  .gc-right{
    text-align:right;display:flex;flex-direction:column;
    align-items:flex-end;justify-content:center;flex:0 0 auto;
  }
  .gc-start{
    font-family:'Oswald',sans-serif;
    font-size:14px;font-weight:500;letter-spacing:.03em;
    color:rgba(255,255,255,.78);
  }
  .gc-start-label{
    font-family:'Noto Sans JP',sans-serif;
    font-size:10px;color:rgba(255,255,255,.36);margin-right:4px;letter-spacing:0;
  }

  /* 締切間際：Brainは赤。ダーク＋金基調に合わせて輝金にする */
  .gc-count{
    display:flex;align-items:center;gap:5px;
    font-family:'Noto Sans JP',sans-serif;
    font-size:13px;font-weight:700;color:var(--gold-br);
    text-shadow:0 0 12px rgba(255,219,91,.35);
  }
  .gc-count-dot{
    width:6px;height:6px;border-radius:50%;background:var(--gold-br);
    box-shadow:0 0 7px rgba(255,219,91,.8);
    animation:g1Pulse 1s ease infinite;
  }
  @keyframes g1Pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

  .gc-fin{
    font-family:'Noto Sans JP',sans-serif;
    font-size:13px;font-weight:600;color:rgba(255,255,255,.34);
  }

  /* ---- レース画面ヘッダのバッジ（開催カードとは別系統） ---- */
  .gc-b{
    font-family:'Noto Sans JP',sans-serif;font-size:10px;font-weight:500;
    line-height:1;padding:4px 7px;border-radius:4px;letter-spacing:.02em;
    border:1px solid rgba(217,180,95,.34);color:var(--gold-lt);
    background:rgba(217,180,95,.07);white-space:nowrap;
  }
  .gc-b.night{border-color:rgba(120,160,235,.36);color:#a9c2f2;background:rgba(120,160,235,.08);}
  .gc-b.mid{border-color:rgba(150,130,215,.38);color:#bcaef0;background:rgba(150,130,215,.09);}
  .gc-b.grade{border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.62);background:rgba(255,255,255,.03);}

  /* =========================================================
     出走表画面
     ========================================================= */
  .rc-wrap{padding:0 0 6px;}
  .rc-bar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:10px;
    padding:max(10px, env(safe-area-inset-top)) 14px 10px;
    background:linear-gradient(180deg,rgba(0,0,0,.96) 62%,rgba(0,0,0,0) 100%);
    backdrop-filter:saturate(140%) blur(6px);
    -webkit-backdrop-filter:saturate(140%) blur(6px);
  }
  .rc-back{
    display:inline-flex;align-items:center;gap:7px;
    background:rgba(255,255,255,.045);border:1px solid rgba(217,180,95,.2);
    color:rgba(255,255,255,.8);border-radius:999px;
    padding:7px 13px 7px 10px;font:inherit;
    font-family:'Noto Sans JP',sans-serif;font-size:12px;font-weight:500;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:border-color .2s,color .2s,background .2s;
  }
  .rc-back:active{background:rgba(217,180,95,.1);border-color:rgba(217,180,95,.4);color:var(--gold-lt);}
  .rc-back i{
    width:6px;height:6px;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
    transform:rotate(45deg);display:block;
  }

  .rc-head{padding:4px 16px 0;}
  .rc-vrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .rc-venue{font-family:'Noto Sans JP',sans-serif;font-weight:900;
    font-size:clamp(20px,5.6vw,28px);color:var(--wht);line-height:1.1;}
  .rc-title{
    margin-top:9px;font-size:12px;line-height:1.55;color:rgba(255,255,255,.56);
    font-weight:400;letter-spacing:.01em;
  }
  .rc-line{height:1px;margin:13px 0 12px;background:linear-gradient(90deg,
      rgba(217,180,95,.26) 0%, rgba(217,180,95,.08) 46%, rgba(255,255,255,0) 100%);}
  .rc-now{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;}
  .rc-rno{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:clamp(28px,8vw,42px);line-height:1;
    background:linear-gradient(100deg,var(--gold-dp) 0%,var(--gold) 32%,var(--gold-br) 66%,var(--gold-lt) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
  }
  .rc-cls{font-size:13px;font-weight:700;color:rgba(255,255,255,.78);}
  .rc-meta{
    margin-top:11px;display:flex;flex-wrap:wrap;gap:6px 16px;
    font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:.04em;

  /* タップ位置から弾けるバースト */

  .g1-card.tapped::after{
    content:'';position:absolute;width:60px;height:60px;border-radius:50%;

    left:var(--tap-x,50%);top:var(--tap-y,50%);
    transform:translate(-50%,-50%) scale(0);
    animation:g1TapBurst .4s ease-out forwards;
    pointer-events:none;
  }

  /* ===== 読み込み・エラー ===== */
  .g1-load{ padding:6px 16px 0; }

    background-size:220% 100%;

    animation:g1Skel 1.4s ease-in-out infinite;

  @keyframes g1Skel{0%{background-position:120% 0;}100%{background-position:-120% 0;}}

  .g1-msg{

  @media (prefers-reduced-motion:reduce){
    .g1-skel{animation:none;}
  }
</style>

<script>
(function(){
  'use strict';

  var stage = document.getElementById('g1Stage');
  var img   = document.getElementById('g1HeaderImg');
  var hero  = document.getElementById('g1Hero');
  var cv    = document.getElementById('g1Sparkle');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* =========================================================
     1. ヘッダー画像フェードイン
     ========================================================= */
  function onImgReady(){
    if(stage) stage.classList.add('loaded');
    initSparkle();
  }
  if(img){
    if(img.complete && img.naturalWidth > 0){
      requestAnimationFrame(onImgReady);
    }else{
      img.addEventListener('load', onImgReady);
      img.addEventListener('error', onImgReady);   /* 読み込み失敗でも枠は表示 */
    }
  }else{
    onImgReady();
  }

  /* =========================================================
     2. 見出し：スクロールで右から2段時間差スライドイン
        「画面内に入った」かつ「実際にスクロールされた」の複合条件。
        1画面に収まりスクロール不可の場合のみフォールバックで自動表示。
     ========================================================= */
  if(hero){
    if('IntersectionObserver' in window){
      var inView = false, done = false;
      var SCROLL_GATE = 24;   /* px：これ以上スクロールされたら発火 */

      var reveal = function(){
        if(done) return;
        done = true;
        hero.classList.add('in');
        io.unobserve(hero);
        window.removeEventListener('scroll', onScroll);
      };
      var onScroll = function(){
        if(inView && window.pageYOffset > SCROLL_GATE) reveal();
      };
      var io = new IntersectionObserver(function(entries){
        for(var i=0;i<entries.length;i++){
          if(entries[i].isIntersecting){
            inView = true;
            onScroll();   /* すでにスクロール済みなら即発火 */
          }
        }
      }, { threshold:0, rootMargin:'0px 0px -12% 0px' });
      io.observe(hero);
      window.addEventListener('scroll', onScroll, { passive:true });

      /* スクロール不可レイアウト時の保険 */
      setTimeout(function(){
        var doc = document.documentElement;
        if(!done && doc.scrollHeight - window.innerHeight <= SCROLL_GATE) reveal();
      }, 900);
    }else{
      hero.classList.add('in');  /* 非対応環境は即表示 */
    }
  }

  /* =========================================================
     3. スパークル（噴射＋重力の物理モデル）

     ・ヘッダー画像内の Go1 の右下から、画像の右上角へ向けてランダムに噴射され、
       以後は重力と抗力だけで運動する。勢いのある粒はそのまま右上へ抜けて消える。
     ・抗力はストークス抗力を採用。粒子質量 m ∝ r^3、抗力係数 ∝ r より
       減速率 k = 6πμr/m ∝ 1/r^2。これを k = DRAG / r^2 として実装。
       この一本の式から以下が自動的に導かれる（個別に調整していない）：
         - 終端速度 v_t = G/k ∝ r^2  → 大粒ほど速く落ちる
         - 水平飛距離 ≒ v0x/k ∝ r^2  → 大粒ほど遠くまで飛ぶ
         - 小粒は減速が速く滞空する  → 寿命 life = LIFE/r で小粒ほど長く残す
     ・色は引き続きヘッダー画像の実サンプリング比率（金・白・濃いグレー）。
     ========================================================= */
  var PALETTE = {
    gold : ['#ffdb5b','#d9b45f','#f3e3b8'],   /* 画像から抽出した金 */
    white: ['#ffffff','#f4f4f4'],
    grey : ['#50525a','#3d3f45']              /* 濃いグレー */
  };

  /* ---- 物理定数 ---- */
  var G      = 105;      /* 重力加速度 px/s^2 */
  var DRAG   = 0.95;     /* 抗力スケール（k = DRAG / r^2 [1/s]） */
  var TURB   = 17;       /* 気流の強さ px/s^2（小粒ほど強く効く） */
  var V0MIN  = 300;      /* 噴射初速 下限 px/s */
  var V0MAX  = 760;      /* 噴射初速 上限 px/s */
  var SPREAD = 40 * Math.PI/180;    /* 噴射角のばらつき（狙いは画像の右上角） */
  var RMIN   = 0.45;     /* 粒径 下限 px */
  var RMAX   = 1.25;     /* 粒径 上限 px */
  var LIFE   = 6.0;      /* 寿命基準 秒（life = LIFE / r） */
  var SPR_K  = 3.4;      /* 描画倍率。芯は約16%なので実視認は r*0.54 px 相当 */

  /* 噴射口＝Go1の右下。ヘッダー画像の輝度>150の質量分布から実測した位置（画像内比率） */
  var EM_X0 = 0.40, EM_XW = 0.16;
  var EM_Y0 = 0.64, EM_YH = 0.22;

  var ctx = null, DPR = 1;
  var W = 0, H = 0;
  var imgBox = { x:0, y:0, w:0, h:0 };
  var types  = [];       /* 画像から得た色種の出現比率 */
  var sprites = { gold:[], white:[], grey:[] };
  var parts = [];
  var running = false, rafId = 0, lastT = 0, inited = false;

  function hexToRgb(h){
    return [parseInt(h.substr(1,2),16), parseInt(h.substr(3,2),16), parseInt(h.substr(5,2),16)];
  }
  function rgba(h,a){
    var c = hexToRgb(h);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }

  /* 超微細に見せるため、芯を極小・外周を淡いハローにしたスプライトを事前生成 */
  function makeSprite(hex){
    var S = 24;
    var c = document.createElement('canvas');
    c.width = c.height = S;
    var g = c.getContext('2d');
    var rg = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
    rg.addColorStop(0,    rgba(hex,1));
    rg.addColorStop(0.16, rgba(hex,0.92));
    rg.addColorStop(0.42, rgba(hex,0.22));
    rg.addColorStop(1,    rgba(hex,0));
    g.fillStyle = rg;
    g.beginPath(); g.arc(S/2, S/2, S/2, 0, Math.PI*2); g.fill();
    return c;
  }
  function buildSprites(){
    for(var k in PALETTE){
      if(!Object.prototype.hasOwnProperty.call(PALETTE,k)) continue;
      sprites[k] = [];
      for(var i=0;i<PALETTE[k].length;i++) sprites[k].push(makeSprite(PALETTE[k][i]));
    }
  }

  function fallbackTypes(){
    types.length = 0;
    for(var k=0;k<180;k++){
      types.push((k%3===0) ? 'gold' : ((k%3===1) ? 'white' : 'grey'));
    }
  }

  /* ヘッダー画像を実サンプリングして色種の出現比率を作る（画像との連動） */
  function buildTypes(){
    types.length = 0;
    try{
      if(!img || !img.naturalWidth) throw new Error('no image');
      var SW = 140;
      var SH = Math.max(1, Math.round(SW * img.naturalHeight / img.naturalWidth));
      var oc = document.createElement('canvas');
      oc.width = SW; oc.height = SH;
      var octx = oc.getContext('2d', { willReadFrequently:true });
      octx.drawImage(img, 0, 0, SW, SH);
      var d = octx.getImageData(0, 0, SW, SH).data;

      for(var y=0;y<SH;y++){
        for(var x=0;x<SW;x++){
          var i = (y*SW + x) * 4;
          var r = d[i], g = d[i+1], b = d[i+2];
          var lum = 0.299*r + 0.587*g + 0.114*b;
          if(lum < 26) continue;                      /* 黒背景は数えない */
          if(Math.random() > Math.min(1, lum/200)) continue;
          var t;
          if(r - b > 34 && r > 88)      t = 'gold';   /* 金の飛沫 */
          else if(lum > 148)            t = 'white';  /* 白の飛沫 */
          else                          t = 'grey';   /* 暗部の粒＝濃いグレー */
          types.push(t);
          /* 画像は白の飛沫が約63%・金が約11.5%。そのままでは金がほぼ出ないため
             金のみ重み付けし、実際の見え方を金・白・グレーで均衡させる */
          if(t === 'gold'){ types.push(t); types.push(t); types.push(t); }
        }
      }
    }catch(e){
      types.length = 0;   /* CORS等で読み取れない場合 */
    }
    if(types.length < 40) fallbackTypes();
  }

  /* 噴射：画面左下（＝画像の左下）から右上へ */
  function emit(p){
    var t    = types[(Math.random()*types.length)|0];
    var list = sprites[t];
    p.spr = list[(Math.random()*list.length)|0];

    /* 粒径は小さいものが圧倒的に多い分布にする（超微細さを保つ） */
    p.r  = RMIN + (RMAX - RMIN) * Math.pow(Math.random(), 2.2);
    p.k  = DRAG / (p.r * p.r);          /* ストークス抗力による減速率 [1/s] */
    p.sz = p.r * SPR_K;

    /* 噴射口：Go1 の右下 */
    p.x = imgBox.x + (EM_X0 + Math.random()*EM_XW) * imgBox.w;
    p.y = imgBox.y + (EM_Y0 + Math.random()*EM_YH) * imgBox.h;

    /* 狙いはヘッダー画像の右上角。噴射口から角へのベクトルを都度求めるので
       画像サイズが変わっても向きが崩れない */
    var base = Math.atan2(imgBox.y - p.y, (imgBox.x + imgBox.w) - p.x);
    var a  = base + (Math.random() - 0.5) * SPREAD;
    var v0 = V0MIN + Math.random()*(V0MAX - V0MIN);
    p.vx = Math.cos(a) * v0;
    p.vy = Math.sin(a) * v0;           /* 上向き＝負 */

    p.life = LIFE / p.r;               /* 小粒ほど長く漂う */
    p.age  = 0;
    p.ph   = Math.random()*Math.PI*2;
    p.ts   = 0.5 + Math.random()*1.5;  /* 気流の周期 */
    p.tw   = 0.6 + Math.random()*1.9;  /* 明滅速度 */
    p.base = (t === 'grey') ? (0.50 + Math.random()*0.42)
                            : (0.34 + Math.random()*0.50);
  }

  /* 運動方程式：重力＋線形抗力＋微弱な気流（半陰的オイラー法） */
  function step(p, dt, tsec){
    var turb = TURB * Math.sin(tsec*p.ts + p.ph) / p.r;   /* 小粒ほど流されやすい */
    p.vx += (turb - p.k * p.vx) * dt;
    p.vy += (G    - p.k * p.vy) * dt;
    p.x  += p.vx * dt;
    p.y  += p.vy * dt;
    p.age += dt;
  }

  function alphaOf(p, tsec){
    if(p.age >= p.life) return 0;
    var fi = p.age / 0.20;  if(fi > 1) fi = 1;
    var fo = 1 - (p.age - p.life*0.60) / (p.life*0.40);
    if(fo > 1) fo = 1; else if(fo < 0) fo = 0;
    var edge = (H - p.y) / 44;  if(edge > 1) edge = 1; else if(edge < 0) edge = 0;
    var tw = 0.62 + 0.38*Math.sin(tsec*p.tw + p.ph);
    return p.base * fi * fo * edge * tw;
  }

  function dead(p){
    /* y < -30 は画面上方への離脱。勢いのある粒はここから右上へ消えていく */
    return p.age >= p.life || p.y > H + 12 || p.y < -30 || p.x > W + 30 || p.x < -40;
  }

  function measure(){
    if(!stage || !ctx) return;
    /* ビュー切替で非表示のときは 0 になる。0のまま組むと粒子が壊れるので抜ける */
    if(stage.clientWidth < 1 || stage.clientHeight < 1) return;
    W = stage.clientWidth;
    H = stage.clientHeight;
    cv.width  = Math.max(1, Math.round(W*DPR));
    cv.height = Math.max(1, Math.round(H*DPR));
    cv.style.width  = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var ir = img ? img.getBoundingClientRect() : null;
    var sr = stage.getBoundingClientRect();
    if(ir && ir.width > 0){
      imgBox = { x: ir.left - sr.left, y: ir.top - sr.top, w: ir.width, h: ir.height };
    }else{
      imgBox = { x:0, y:0, w:W, h:Math.max(1, H*0.30) };
    }
  }

  function populate(){
    var n = Math.round(Math.max(150, Math.min(300, W*0.58)));
    parts.length = 0;
    for(var i=0;i<n;i++){
      var p = {};
      emit(p);
      /* 読み込み時点で噴射が定常状態になっているよう、ランダムに時間を進める */
      var adv = Math.random() * p.life;
      var h = 1/45, t0 = Math.random()*20;
      for(var e=0; e<adv; e+=h){
        step(p, h, t0 + e);
        if(dead(p)){ emit(p); break; }
      }
      parts.push(p);
    }
  }

  function frame(now){
    var dt = (now - lastT) / 1000;
    if(!(dt > 0) || dt > 0.05) dt = 0.016;
    lastT = now;

    ctx.clearRect(0, 0, W, H);
    var tsec = now / 1000;

    for(var i=0;i<parts.length;i++){
      var p = parts[i];
      step(p, dt, tsec);
      if(dead(p)){ emit(p); continue; }
      var a = alphaOf(p, tsec);
      if(a <= 0.004) continue;
      ctx.globalAlpha = a;
      ctx.drawImage(p.spr, p.x - p.sz/2, p.y - p.sz/2, p.sz, p.sz);
    }
    ctx.globalAlpha = 1;
    if(running) rafId = requestAnimationFrame(frame);
  }

  function start(){
    if(running || !inited || reduce) return;
    running = true;
    lastT = performance.now();
    rafId = requestAnimationFrame(frame);
  }
  function stop(){
    running = false;
    if(rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }

  function drawStatic(){
    ctx.clearRect(0, 0, W, H);
    var tsec = performance.now()/1000;
    for(var i=0;i<parts.length;i++){
      var p = parts[i];
      var a = alphaOf(p, tsec);
      if(a <= 0.004) continue;
      ctx.globalAlpha = a;
      ctx.drawImage(p.spr, p.x - p.sz/2, p.y - p.sz/2, p.sz, p.sz);
    }
    ctx.globalAlpha = 1;
  }

  function initSparkle(){
    if(inited || !cv || !stage) return;
    if(!cv.getContext) return;
    ctx = cv.getContext('2d');
    if(!ctx) return;
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    buildSprites();
    buildTypes();
    measure();
    populate();
    inited = true;

    /* リサイズ監視は動き抑制の有無に関わらず登録する
       （早期returnの後ろに置くと reduce 環境でキャンバスが追従しない） */
    var rt = 0;
    window.addEventListener('resize', function(){
      clearTimeout(rt);
      rt = setTimeout(function(){
        measure();
        populate();
        if(reduce) drawStatic();
      }, 180);
    });

    if(reduce){
      drawStatic();   /* 動きを抑える設定では静止した一枚だけ描く */
      return;
    }

    /* 画面外・非表示タブでは止める */
    if('IntersectionObserver' in window){
      var vio = new IntersectionObserver(function(es){
        for(var i=0;i<es.length;i++){
          if(es[i].isIntersecting) start(); else stop();
        }
      }, { threshold:0 });
      vio.observe(stage);
    }else{
      start();
    }
    document.addEventListener('visibilitychange', function(){
      if(document.hidden) stop(); else start();
    });
  }
})();
</script>

<script>
(function(){
  'use strict';

  /* =========================================================
     データ層（実接続）

     取得経路はすべて実URLで裏取り済み。
       開催一覧 https://www.winticket.jp/autorace          （SSR・○）
       出走表   /autorace/{venue}/racecard/{mid}/{day}/{race}（SSR・○）
       オッズ   https://sp.oddspark.com/autorace/SpOddsInfo.do（SSR・○）
       払戻     https://www.oddspark.com/autorace/RaceRefund.do（SSR・○）
     winticket の odds / raceresult はCSRで値が返らないため使わない。

     ★meetingId = 開催初日YYYYMMDD(8桁) + 場コード2桁
       場コードは oddspark の joCd と同一。両サイトを相互変換できる。
       例) 2026080602 = 2026-08-06初日・川口(02)
           2026080403 = 2026-08-04初日・伊勢崎(03)
           2026080506 = 2026-08-05初日・山陽(06)
     ========================================================= */

  var PROXY_URL = 'https://royal-mode-67a9.bomayekeirin.workers.dev';

  var VENUE = {
    kawaguchi:{ jp:'川口',   roma:'KAWAGUCHI', cd:'02' },
    isesaki  :{ jp:'伊勢崎', roma:'ISESAKI',   cd:'03' },
    hamamatsu:{ jp:'浜松',   roma:'HAMAMATSU', cd:'04' },
    iizuka   :{ jp:'飯塚',   roma:'IIZUKA',    cd:'05' },
    sanyo    :{ jp:'山陽',   roma:'SANYO',     cd:'06' }
  };
  /* 場コード → slug の逆引き（oddspark 側のURLから戻すとき用） */
  var CD2SLUG = {};
  (function(){ for(var k in VENUE){ if(VENUE.hasOwnProperty(k)) CD2SLUG[VENUE[k].cd] = k; } })();

  /* 車番色（オートレース標準） */
  var NUMCOL = {
    1:['#ffffff','#000000'], 2:['#111111','#ffffff'], 3:['#e2373b','#ffffff'],
    4:['#2a6fdb','#ffffff'], 5:['#f5d327','#000000'], 6:['#2fa84f','#ffffff'],
    7:['#f08a24','#000000'], 8:['#ec86b0','#000000']
  };

  var MEETINGS = [];        /* 本日の開催（実データ） */
  var isTransitioning = false;
  var refreshTimer = null;

  /* =========================================================
     ユーティリティ
     ========================================================= */
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }
  function sessionClass(s){
    if(s === 'ナイター') return 'night';
    if(s === 'ミッドナイト') return 'mid';
    return '';
  }

  /* winticket の racecard / raceresult URL を分解
     4セグメント形式 /{venue}/racecard/{mid}/{day}/{race} のみ「本日の出走可能レース」 */
  function parseWtUrl(href){
    if(!href) return null;
    var m = href.match(/\/autorace\/([a-z]+)\/(racecard|raceresult)\/(\d{10})\/(\d+)\/(\d+)/);
    if(m){
      return { slug:m[1], type:m[2], meetingId:m[3], dayNum:Number(m[4]), raceNo:Number(m[5]), full:true };
    }
    var m2 = href.match(/\/autorace\/([a-z]+)\/(racecard|raceresult)\/(\d{10})\/?\?index=(\d+)/);
    if(m2){
      return { slug:m2[1], type:m2[2], meetingId:m2[3], dayNum:Number(m2[4]), raceNo:null, full:false };
    }
    return null;
  }

  /* 発走時刻 → 締切（発走-5分）と残り分。日跨ぎ補正あり */
  function deadlineOf(start){
    if(!start || start === '--:--') return null;
    var p = String(start).split(':');
    if(p.length !== 2) return null;
    var sm = Number(p[0]) * 60 + Number(p[1]);
    if(isNaN(sm)) return null;
    var dm = sm - 5;
    if(dm < 0) dm += 1440;
    var now = new Date();
    var rest = dm - (now.getHours() * 60 + now.getMinutes());
    /* ミッドナイトなど日跨ぎ：大きく負なら翌日扱い */
    if(rest < -720) rest += 1440;
    return {
      minutes: dm,
      text: ('0' + Math.floor(dm / 60)).slice(-2) + ':' + ('0' + (dm % 60)).slice(-2),
      rest: rest
    };
  }

  /* =========================================================
     開催一覧の取得（winticket トップをパース）
     ========================================================= */
  function pickTodayScope(doc){
    /* 本日タブのパネルを優先。見つからない場合は文書全体にフォールバックし、
       「4セグメントのracecardリンクを持つ項目＝本日出走可能」で絞る。
       ★パネルIDに依存しきらないのは、IDが変わっても壊れないようにするため。 */
    var sel = ['#panel-autorace-race-today', '[id*="autorace-race-today"]', '[id*="race-today"]'];
    for(var i=0;i<sel.length;i++){
      var el = doc.querySelector(sel[i]);
      if(el) return { root:el, scoped:true };
    }
    return { root:doc, scoped:false };
  }

  function parseTop(html){
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var scope = pickTodayScope(doc);
    var items = scope.root.querySelectorAll('[class*="RecentRaceListItem___Wrapper"]');
    var out = [], seen = {};

    for(var i=0;i<items.length;i++){
      var el = items[i];

      /* リンク（出走可能なら racecard の4セグメント形式） */
      var a = el.querySelector('a[href*="/racecard/"]') || el.querySelector('a[href*="/raceresult/"]');
      if(!a) continue;
      var p = parseWtUrl(a.getAttribute('href'));
      if(!p) continue;

      /* 本日パネルが取れなかった場合は、4セグメント形式のものだけ採用する。
         昨日（終了）・明日（未定）は ?index= 形式なので自然に除外される。 */
      if(!scope.scoped && !p.full) continue;

      /* 同一開催の重複を除去（トップは同じカードが複数箇所に出ることがある） */
      var key = p.slug + '/' + p.meetingId + '/' + p.dayNum;
      if(seen[key]) continue;
      seen[key] = 1;

      var venueEl = el.querySelector('[class*="VenueName"]');
      if(!venueEl) continue;

      var gradeEl = el.querySelector('[class*="GradeIcon"]');
      var grade = (gradeEl && gradeEl.getAttribute('aria-label')) || '普通';

      /* 時間帯（CupIcon の title） */
      var session = '';
      /* CupIcon 直下の title。svgの入れ子が変わっても拾えるよう子孫指定にする */
      var cups = el.querySelectorAll('[class*="CupIcon"] title');
      if(!cups.length){
        /* aria-label にフォールバック（実サイトは span[aria-label] も持つ） */
        var al = el.querySelectorAll('[class*="CupIcon"][aria-label]');
        for(var q=0;q<al.length;q++){
          var v2 = al[q].getAttribute('aria-label');
          if(v2 === 'ナイター' || v2 === 'ミッドナイト' || v2 === 'モーニング') session = v2;
        }
      }
      for(var c=0;c<cups.length;c++){
        var lb = cups[c].textContent.trim();
        if(lb === 'ナイター' || lb === 'ミッドナイト' || lb === 'モーニング') session = lb;
      }

      /* 日目 */
      var dayEl = el.querySelector('[class*="RecentRaceListItem___Day"]');
      var day = dayEl ? dayEl.textContent.trim() : '';

      /* レース番号・発走時刻 */
      var rnoEl = el.querySelector('[class*="RaceNumber"]');
      var raceNo = p.raceNo;
      if(!raceNo && rnoEl){
        var rm = rnoEl.textContent.match(/(\d+)/);
        if(rm) raceNo = Number(rm[1]);
      }
      var timeEl = el.querySelector('time[class*="TimeText"]');
      var start = timeEl ? timeEl.textContent.trim() : '';

      /* 終了判定：raceresult リンク、または本文に「終了」 */
      var txt = el.textContent || '';
      var finished = (p.type === 'raceresult') || (!p.full && txt.indexOf('終了') >= 0);

      out.push({
        slug: p.slug,
        meetingId: p.meetingId,
        dayNum: p.dayNum,
        nextRace: raceNo || 1,
        start: start || null,
        grade: grade,
        session: session,
        day: day,
        status: finished ? 'done' : (start ? 'open' : 'tbd'),
        races: null   /* レース数は出走表側で確定する */
      });
    }
    return out;
  }

  /* 締切が近い順。終了した開催は末尾（Brainの並びと同じ考え方） */
  function sortMeetings(list){
    return list.slice().sort(function(a,b){
      var af = (a.status === 'done'), bf = (b.status === 'done');
      if(af && !bf) return 1;
      if(bf && !af) return -1;
      var ad = deadlineOf(a.start), bd = deadlineOf(b.start);
      var ar = ad ? ad.rest : 99999;
      var br = bd ? bd.rest : 99999;
      /* 締切を過ぎたものは、まだ先のものより後ろへ */
      if(ar < 0 && br >= 0) return 1;
      if(br < 0 && ar >= 0) return -1;
      return ar - br;
    });
  }

  function showSkeleton(){
    var box = $('g1Cards');
    if(!box) return;
    box.innerHTML = '<div class="g1-load"><div class="g1-skel"></div>' +
                    '<div class="g1-skel" style="opacity:.7"></div>' +
                    '<div class="g1-skel" style="opacity:.45"></div></div>';
  }
  function showMsg(title, body, retry){
    var box = $('g1Cards');
    if(!box) return;
    box.innerHTML = '<div class="g1-msg"><div class="t">' + esc(title) + '</div><p>' + body + '</p>' +
      (retry ? '<button class="g1-retry" id="g1Retry" type="button">再読み込み</button>' : '') + '</div>';
    var r = $('g1Retry');
    if(r) r.addEventListener('click', function(){ loadMeetings(); });
  }

  function loadMeetings(){
    showSkeleton();
    var url = PROXY_URL + '?url=' + encodeURIComponent('https://www.winticket.jp/autorace');
    fetch(url).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function(html){
      var list = parseTop(html);
      if(!list.length){
        showMsg('NO RACE', '本日の開催はありません。', true);
        MEETINGS = [];
        return;
      }
      MEETINGS = sortMeetings(list);
      renderCards();
      startRefresh();
      /* 直リンクで出走表を開いていた場合、開催情報が揃った時点でヘッダを描き直す */
      if(typeof route === 'function' && location.hash.indexOf('#/race/') === 0) route();
    }).catch(function(e){
      console.error('開催一覧の取得に失敗:', e);
      showMsg('ERROR', '開催情報を取得できませんでした。<br>通信状況を確認して再度お試しください。', true);
    });
  }

  /* 1分ごとに並べ替え＋再描画（アニメーションなし）。Brainと同じ間隔。 */
  function startRefresh(){
    if(refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(function(){
      if(isTransitioning) return;
      if(location.hash && location.hash.indexOf('#/race/') === 0) return;  /* 出走表表示中は触らない */
      MEETINGS = sortMeetings(MEETINGS);
      renderCards(true);
    }, 60000);
  }

  /* =========================================================
     ホーム：開催カード
     Brain app.html の renderVenueCards / selectVenue の流れを踏襲。
     ========================================================= */

  var SLOT_ICON = {
    day:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" fill="#F4792A"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="#F4792A" stroke-width="2" stroke-linecap="round"/></svg>',
    morning:'<svg viewBox="0 0 24 24" fill="none"><defs><clipPath id="g1hz"><rect x="0" y="0" width="24" height="16"/></clipPath></defs><g clip-path="url(#g1hz)"><circle cx="12" cy="16" r="7" fill="#FFB300"/></g><path d="M12 2v3M4.22 6.22l2.12 2.12M19.78 6.22l-2.12 2.12M2 14h3M19 14h3" stroke="#FFB300" stroke-width="2" stroke-linecap="round"/><path d="M3 20h18" stroke="#FFB300" stroke-width="2" stroke-linecap="round"/></svg>',
    nighter:'<svg viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" fill="#8BB8E8"/></svg>',
    midnight:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 2l1.09 3.36h3.53l-2.86 2.08 1.09 3.36L12 8.72l-2.85 2.08 1.09-3.36-2.86-2.08h3.53L12 2z" fill="#8E7BD6"/><path d="M5 10l.65 2h2.1l-1.7 1.24.65 2L5 14.02l-1.7 1.22.65-2-1.7-1.24h2.1L5 10z" fill="#8E7BD6"/><path d="M19 15l.52 1.6h1.68l-1.36 1 .52 1.6-1.36-.98-1.36.98.52-1.6-1.36-1h1.68L19 15z" fill="#8E7BD6"/></svg>'
  };
  function slotKey(s){
    if(s === 'ナイター') return 'nighter';
    if(s === 'ミッドナイト') return 'midnight';
    if(s === 'モーニング') return 'morning';
    return 'day';
  }
  function gradeKey(g){
    var t = String(g || '').replace(/\s/g,'');
    if(t === 'SG') return 'sg';
    if(t === 'GI'  || t === 'ＧⅠ') return 'g1';
    if(t === 'GII' || t === 'ＧⅡ') return 'g2';
    if(t === 'GIII'|| t === 'ＧⅢ') return 'g3';
    return 'normal';
  }

  function cardHTML(m, i){
    var v = VENUE[m.slug] || { jp:m.slug, roma:m.slug.toUpperCase() };
    var fin = (m.status === 'done');
    var raceNum = m.nextRace || 1;

    /* 右側の表示内容（Brainの topContent と同じ分岐） */
    var right;
    if(fin){
      right = '<span class="gc-fin">終了</span>';
    }else{
      var d = deadlineOf(m.start);
      if(d && d.rest <= 25 && d.rest > 0){
        right = '<span class="gc-count"><span class="gc-count-dot"></span>締切' + d.rest + '分前</span>';
      }else if(d && d.rest > 0){
        right = '<span class="gc-start"><span class="gc-start-label">締切</span>' + esc(d.text) + '</span>';
      }else{
        right = '<span class="gc-start"><span class="gc-start-label">発走</span>' +
                esc(m.start || '--:--') + '</span>';
      }
    }

    return '<button class="g1-card' + (fin ? ' finished' : '') + '" type="button"' +
             ' data-idx="' + i + '"' +
             ' style="transition-delay:' + (i * 70) + 'ms">' +
             '<div class="gc-main">' +
               '<div class="gc-left">' +
                 '<div class="gc-name-row">' +
                   '<span class="gc-name">' + esc(v.jp) + '<span class="r">' + esc(raceNum) + 'R</span></span>' +
                   '<span class="gc-grade grade-' + gradeKey(m.grade) + '">' + esc(m.grade) + '</span>' +
                   '<span class="gc-slot">' + SLOT_ICON[slotKey(m.session)] + '</span>' +
                 '</div>' +
                 '<span class="gc-day">' + esc(m.day || '') + '</span>' +
               '</div>' +
               '<div class="gc-right">' + right + '</div>' +
             '</div>' +
           '</button>';
  }

  function renderCards(noAnim){
    var box = $('g1Cards');
    if(!box) return;
    var html = '';
    for(var i=0;i<MEETINGS.length;i++) html += cardHTML(MEETINGS[i], i);
    box.innerHTML = html;

    var cards = box.querySelectorAll('.g1-card');
    var k;
    if(noAnim){
      for(k=0;k<cards.length;k++){ cards[k].style.transitionDelay = '0ms'; cards[k].classList.add('in'); }
    }else if('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(es){
        for(var j=0;j<es.length;j++){
          if(es[j].isIntersecting){ es[j].target.classList.add('in'); io.unobserve(es[j].target); }
        }
      }, { threshold:0.15, rootMargin:'0px 0px -6% 0px' });
      for(k=0;k<cards.length;k++) io.observe(cards[k]);
    }else{
      for(k=0;k<cards.length;k++) cards[k].classList.add('in');
    }
  }

  /* --- タップ：Brain の selectVenue と同じ演出順 --- */
  function selectMeeting(card, ev){
    if(isTransitioning) return;
    isTransitioning = true;

    var idx = Number(card.getAttribute('data-idx'));
    var m = MEETINGS[idx];
    if(!m){ isTransitioning = false; return; }

    /* 1. 選択したカード以外を下へスライドアウト */
    var all = document.querySelectorAll('.g1-card');
    for(var i=0;i<all.length;i++){
      if(all[i] !== card) all[i].classList.add('slide-out');
    }

    /* 2. タップ位置からバースト＋キラーン */
    if(ev && typeof ev.clientX === 'number'){
      var r = card.getBoundingClientRect();
      card.style.setProperty('--tap-x', (ev.clientX - r.left) + 'px');
      card.style.setProperty('--tap-y', (ev.clientY - r.top) + 'px');
      card.classList.add('tapped');
      setTimeout(function(){ card.classList.remove('tapped'); }, 400);
    }
    card.classList.add('shimmer');

    /* 3. スライドアウトが終わってから遷移 */
    setTimeout(function(){
      isTransitioning = false;
      location.hash = '#/race/' + m.slug + '/' + m.meetingId + '/' + m.dayNum + '/' + (m.nextRace || 1);
    }, 420);
  }

  /* =========================================================
     出走表 / オッズ / 結果 の描画
     ========================================================= */
  var curTab  = 'basic';  /* 出走表サブタブ basic|detail */
  var curTop  = 'card';   /* 上位タブ card|odds|result */
  var curBet  = 't3';     /* オッズ券種 */
  var curAxis = 1;        /* 3連単=1着 / 3連複=軸 */

  /* 発売券種7種。出走表ページ・結果ページの両方に出ていることを実URLで確認済み */
  var BETS = [
    { k:'t3',    n:'3連単',  type:'tri'  },
    { k:'f3',    n:'3連複',  type:'tri'  },
    { k:'t2',    n:'2連単',  type:'perm' },
    { k:'f2',    n:'2連複',  type:'comb' },
    { k:'win',   n:'単勝',   type:'one'  },
    { k:'place', n:'複勝',   type:'one'  },
    { k:'wide',  n:'ワイド', type:'comb' }
  ];
  function betOf(k){
    for(var i=0;i<BETS.length;i++){ if(BETS[i].k === k) return BETS[i]; }
    return BETS[0];
  }

  function noteHTML(what){
    return '<div class="rc-note"><b>' + what + 'は未接続です。</b><br>' +
      'winticket の' + what + 'はサーバーレンダリングされておらず、HTML取得では値が返らないことを' +
      '実URLで確認済み。取得経路の確定待ちのため、現在は枠のみ表示しています。</div>';
  }

  /* 車番チップ（出走表・オッズ・結果で共用）
     ★開催カード側とは別系統。カードCSSの差し替えで巻き添えにしないこと（12節 #5 と同じ轍） */
  function numChip(no){
    var c = NUMCOL[no] || ['#333','#fff'];
    return '<span class="rc-num" style="background:' + c[0] + ';color:' + c[1] + '">' + no + '</span>';
  }

  /* ---------- オッズ ---------- */
  function oddsOne(n, head){
    var h = '<table class="rc-o simple"><thead><tr><th>車</th><th>' + head + '</th></tr></thead><tbody>';
    for(var i=1;i<=n;i++){
      h += '<tr><th>' + numChip(i) + '</th><td><span class="od">-</span></td></tr>';
    }
    return h + '</tbody></table>';
  }
  function oddsMatrix(n, mode){
    var h = '<table class="rc-o"><thead><tr><th></th>';
    for(var c=1;c<=n;c++) h += '<th>' + c + '</th>';
    h += '</tr></thead><tbody>';
    for(var r=1;r<=n;r++){
      h += '<tr><th>' + r + '</th>';
      for(var c2=1;c2<=n;c2++){
        var ok = (mode === 'perm') ? (r !== c2) : (r < c2);
        h += ok ? '<td><span class="od">-</span></td>' : '<td class="na"></td>';
      }
      h += '</tr>';
    }
    return h + '</tbody></table>';
  }
  function oddsTri(n, axis, kind){
    var h = '<table class="rc-o"><thead><tr><th></th>';
    for(var c=1;c<=n;c++) h += '<th>' + c + '</th>';
    h += '</tr></thead><tbody>';
    for(var r=1;r<=n;r++){
      h += '<tr><th>' + r + '</th>';
      for(var c2=1;c2<=n;c2++){
        /* 3連単は順列（軸=1着）、3連複は 軸<2番目<3番目 の組合せ */
        var ok = (kind === 't3')
          ? (r !== axis && c2 !== axis && r !== c2)
          : (axis < r && r < c2);
        h += ok ? '<td><span class="od">-</span></td>' : '<td class="na"></td>';
      }
      h += '</tr>';
    }
    return h + '</tbody></table>';
  }
  function axisBar(n, axis, kind){
    /* 3連複は「軸 < 2番目 < 3番目」の最小番号なので、n-2 までしか成立しない */
    var last = (kind === 't3') ? n : Math.max(1, n - 2);
    var h = '<div class="rc-axis" id="rcAxis"><span class="lb">' +
            (kind === 't3' ? '1着' : '軸') + '</span>';
    for(var i=1;i<=last;i++){
      h += '<button class="rc-ax' + (i === axis ? ' on' : '') + '" type="button" data-ax="' + i + '">' + i + '</button>';
    }
    return h + '</div>';
  }
  function oddsHTML(n){
    var b = betOf(curBet), i;
    var h = '<div class="rc-bets" id="rcBets">';
    for(i=0;i<BETS.length;i++){
      h += '<button class="rc-bet' + (BETS[i].k === curBet ? ' on' : '') +
           '" type="button" data-bet="' + BETS[i].k + '">' + BETS[i].n + '</button>';
    }
    h += '</div>';

    if(b.type === 'one'){
      h += '<div class="rc-scroll">' + oddsOne(n, b.n + 'オッズ') + '</div>';
    }else if(b.type === 'tri'){
      if(curAxis > n) curAxis = 1;
      h += axisBar(n, curAxis, b.k) + '<div class="rc-scroll">' + oddsTri(n, curAxis, b.k) + '</div>';
    }else{
      h += '<div class="rc-scroll">' + oddsMatrix(n, b.type) + '</div>';
    }
    return h + noteHTML('オッズ');
  }

  /* ---------- 結果 ---------- */
  function condCell(k, v){
    return '<div class="rc-cd"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
  }
  function resultHTML(d, n){
    /* 結果ページのヘッダに 天候・気温・湿度・走路状況/走路温度 が出ることを実URLで確認済み */
    var h = '<div class="rc-cond">' +
      condCell('天候', '-') + condCell('気温', '-') +
      condCell('湿度', '-') + condCell('走路', '-') + '</div>';

    h += '<div class="rc-h3">着順</div><div class="rc-scroll"><table class="rc-t">' +
      '<thead><tr><th>着</th><th>車</th><th>選手名</th><th>車名</th><th>試走T</th><th>競走T</th></tr></thead><tbody>';
    if(d && d.racers){
      for(var i=0;i<d.racers.length;i++){
        var r = d.racers[i];
        h += '<tr><td><span class="rk">-</span></td>' +
             '<td>' + numChip(r.no) + '</td>' +
             '<td style="text-align:left"><span class="rc-nm">' + esc(r.name) + '</span></td>' +
             '<td class="rc-car">' + esc(r.car) + '</td>' +
             '<td class="rc-pct">-</td><td class="rc-pct">-</td></tr>';
      }
    }else{
      for(var j=1;j<=n;j++){
        h += '<tr><td><span class="rk">-</span></td><td>' + numChip(j) + '</td>' +
             '<td style="text-align:left">-</td><td class="rc-car">-</td>' +
             '<td class="rc-pct">-</td><td class="rc-pct">-</td></tr>';
      }
    }
    h += '</tbody></table></div>';

    h += '<div class="rc-h3">払戻金</div><div class="rc-scroll"><table class="rc-t">' +
      '<thead><tr><th>券種</th><th>組番</th><th>払戻金</th><th>人気</th></tr></thead><tbody>';
    for(var k=0;k<BETS.length;k++){
      h += '<tr><td style="text-align:left">' + BETS[k].n + '</td>' +
           '<td class="rc-pct">-</td><td class="rc-pct">-</td><td class="rc-pct">-</td></tr>';
    }
    h += '</tbody></table></div>';

    return h + noteHTML('結果');
  }

  /* ---------- 画面描画 ---------- */
  function renderRace(slug, mid, dayNum, raceNo){
    /* ★出走表の実データはまだ未接続。開催一覧から拾える情報だけで枠を描く。 */
    var d = null;
    var v = VENUE[slug] || { jp:slug, roma:slug.toUpperCase() };
    var head = $('rcHead'), rnav = $('rcRnav'), body = $('rcBody'),
        tabs = $('rcTabs'), top = $('rcTop');

    /* 開催一覧に該当があればヘッダの補足に使う */
    var mt = null;
    for(var i=0;i<MEETINGS.length;i++){
      if(MEETINGS[i].meetingId === mid && String(MEETINGS[i].dayNum) === String(dayNum)) mt = MEETINGS[i];
    }
    var races = (mt && mt.races) || 12;
    var cars = 8;

    /* --- ヘッダ --- */
    if(!d){
      var bg = '';
      if(mt){
        if(mt.day) bg += '<span class="gc-b grade">' + esc(mt.day) + '</span>';
        if(mt.grade) bg += '<span class="gc-b grade">' + esc(mt.grade) + '</span>';
        if(mt.session) bg += '<span class="gc-b ' + sessionClass(mt.session) + '">' + esc(mt.session) + '</span>';
      }
      head.innerHTML =
        '<div class="rc-vrow"><div class="rc-venue">' + esc(v.jp) + '</div>' + bg + '</div>' +
        '<div class="rc-line"></div>' +
        '<div class="rc-now"><span class="rc-rno">' + esc(raceNo) + 'R</span></div>' +
        (mt && mt.start ? '<div class="rc-meta"><span><span class="lb">発走</span>' + esc(mt.start) + '</span></div>' : '');
    }else{
      var badges = '<span class="gc-b grade">' + esc(d.grade) + '</span>';
      if(d.session) badges += '<span class="gc-b ' + sessionClass(d.session) + '">' + esc(d.session) + '</span>';
      head.innerHTML =
        '<div class="rc-vrow"><div class="rc-venue">' + esc(v.jp) + '</div>' +
          '<span class="gc-b grade">' + esc(d.day) + '</span>' + badges + '</div>' +
        '<div class="rc-title">' + esc(d.title) + '</div>' +
        '<div class="rc-line"></div>' +
        '<div class="rc-now"><span class="rc-rno">' + esc(d.raceNo) + 'R</span>' +
          '<span class="rc-cls">' + esc(d.cls) + '</span></div>' +
        '<div class="rc-meta">' +
          '<span><span class="lb">発走</span>' + esc(d.start) + '</span>' +
          '<span><span class="lb">締切</span>' + esc(d.close) + '</span>' +
          '<span class="st">' + esc(d.status) + '</span>' +
        '</div>' +
        '<div class="rc-dist">' + esc(d.date) + '　' + esc(d.dist) + '（' + esc(d.laps) + '）</div>';
    }

    /* --- 本体 --- */
    if(curTop === 'card'){
      tabs.hidden = !d;
      if(!d){
        body.innerHTML = '<div class="rc-empty"><div class="t">NO DATA</div>' +
          '<p>このレースの出走表はまだ接続されていません。<br>実データ接続後に表示されます。</p></div>';
      }else{
        body.innerHTML = '<div class="rc-scroll">' +
          (curTab === 'basic' ? tblBasic(d) : tblDetail(d)) + '</div>';
      }
    }else if(curTop === 'odds'){
      tabs.hidden = true;
      body.innerHTML = oddsHTML(cars);
    }else{
      tabs.hidden = true;
      body.innerHTML = resultHTML(d, cars);
    }

    /* --- レース番号チップ --- */
    var ch = '';
    for(var n=1;n<=races;n++){
      ch += '<button class="rc-chip' + (n === Number(raceNo) ? ' on' : '') +
            '" type="button" data-r="' + n + '">' + n + 'R</button>';
    }
    rnav.innerHTML = ch;
    rnav.onclick = function(e){
      var b = e.target.closest ? e.target.closest('.rc-chip') : null;
      if(!b) return;
      go(slug, mid, dayNum, b.getAttribute('data-r'), curTop);
    };
    var on = rnav.querySelector('.rc-chip.on');
    if(on && on.scrollIntoView) on.scrollIntoView({ block:'nearest', inline:'center' });

    /* --- 上位タブ --- */
    var tt = top.querySelectorAll('.rc-ttab');
    for(var t2=0;t2<tt.length;t2++){
      tt[t2].classList.toggle('on', tt[t2].getAttribute('data-top') === curTop);
    }
    top.onclick = function(e){
      var b = e.target.closest ? e.target.closest('.rc-ttab') : null;
      if(!b) return;
      go(slug, mid, dayNum, raceNo, b.getAttribute('data-top'));
    };

    /* --- 出走表サブタブ --- */
    var tb = tabs.querySelectorAll('.rc-tab');
    for(var t=0;t<tb.length;t++){
      tb[t].classList.toggle('on', tb[t].getAttribute('data-tab') === curTab);
    }
    tabs.onclick = function(e){
      var b = e.target.closest ? e.target.closest('.rc-tab') : null;
      if(!b) return;
      curTab = b.getAttribute('data-tab');
      renderRace(slug, mid, dayNum, raceNo);
    };

    /* --- オッズの券種・軸 --- */
    var bets = $('rcBets');
    if(bets) bets.onclick = function(e){
      var b = e.target.closest ? e.target.closest('.rc-bet') : null;
      if(!b) return;
      curBet = b.getAttribute('data-bet');
      curAxis = 1;
      renderRace(slug, mid, dayNum, raceNo);
    };
    var ax = $('rcAxis');
    if(ax) ax.onclick = function(e){
      var b = e.target.closest ? e.target.closest('.rc-ax') : null;
      if(!b) return;
      curAxis = Number(b.getAttribute('data-ax'));
      renderRace(slug, mid, dayNum, raceNo);
    };
  }

  function go(slug, mid, dayNum, raceNo, tab){
    location.hash = '#/race/' + slug + '/' + mid + '/' + dayNum + '/' + raceNo +
                    (tab && tab !== 'card' ? '/' + tab : '');
  }

  /* =========================================================
     ルーター（ハッシュ方式。静的ホスティングで直リンクが壊れない）
     ========================================================= */
  var vHome = $('viewHome'), vRace = $('viewRace');

  function showHome(){
    vRace.classList.remove('shown');
    vRace.hidden = true;
    vHome.hidden = false;
    vHome.classList.remove('leaving');
    window.scrollTo(0, 0);
    /* 出走表表示中にリサイズされていた場合、ステージが0幅で計測されている
       可能性があるためスパークル側に再計測を促す */
    try{ window.dispatchEvent(new Event('resize')); }catch(e){}

    /* タップ演出で退避したカードを元に戻す。
       これを忘れるとホームに戻ったとき他カードが消えたままになる */
    var cs = document.querySelectorAll('.g1-card');
    for(var i=0;i<cs.length;i++){
      cs[i].classList.remove('slide-out','shimmer','tapped');
    }
    isTransitioning = false;
  }
  function showRace(parts){
    vHome.hidden = true;
    vRace.hidden = false;
    window.scrollTo(0, 0);
    renderRace(parts[0], parts[1], parts[2], parts[3]);
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ vRace.classList.add('shown'); });
    });
  }
  function route(){
    var h = location.hash || '';
    var m = h.match(/^#\/race\/([^/]+)\/([^/]+)\/([^/]+)\/([^/]+)(?:\/(card|odds|result))?$/);
    if(m){
      curTop = m[5] || 'card';
      showRace([m[1], m[2], m[3], m[4]]);
    }else{
      showHome();
    }
  }

  var back = $('rcBack');
  if(back) back.addEventListener('click', function(){
    /* ラベルが「開催一覧」なので必ずホームへ戻す。
       history.back() だとレース番号を切り替えた後に前のレースへ戻ってしまう */
    location.hash = '#/';
  });

  /* カードのタップ（イベント委譲。カードは再描画されるため） */
  var cardBox = $('g1Cards');
  if(cardBox) cardBox.addEventListener('click', function(e){
    var c = e.target.closest ? e.target.closest('.g1-card') : null;
    if(c) selectMeeting(c, e);
  });

  window.addEventListener('hashchange', route);
  route();
  loadMeetings();
})();
</script>

</body>
</html>
