<!-- ===== リンクプレビュー（2026-08-11）=====
     画像は GitHub のリポジトリ直下に kaime-ogp.jpg として置くこと。
     ファイル名を変える場合は下の3箇所すべてを直す。 -->

<style>
/* =========================================================
   厳選予想屋買い目TL  /kaime
   2026-08-08

   ★配色・タイポは app.html の :root / .rt-header から取得。
     独自に決めていない。app系に揃えるという指示に基づく。

   ★X Display Requirements 準拠のため、以下は変更しないこと：
     ・本文は改変しない（抜粋・強調・再構成すべて不可）
     ・アイコン／表示名／@username を必ず表示しプロフィールへリンク
     ・タイムスタンプを表示し permalink へリンク
     ・「Xで見る」をタイムスタンプ横に置く
     ・Xロゴをタイムライン先頭に常時表示
     ・投稿カードに自前のアクション（お気に入り等）を付けない
   ========================================================= */

:root{
  --bg:#f2f3f5;
  --bg2:#ffffff;
  --bg3:#f7f8fa;
  --border:#e0e2e8;
  --border2:#c8cad4;
  --text:#3a3d4a;
  --sub:#5a5f78;
  --sub2:#9095aa;
  --accent:#1a6fff;
  --rose:#c0446e;
  --head:#0f0f0f;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{margin:0;padding:0;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Noto Sans JP',sans-serif;
  min-height:100vh;
  overflow-x:clip;
  overscroll-behavior-y:none;
  padding-top:calc(52px + env(safe-area-inset-top,0px));
}

/* PWA時のステータスバー塗り（app.html と同じ手当て） */
body::before{
  content:'';position:fixed;top:0;left:0;right:0;
  height:env(safe-area-inset-top,0px);
  background:var(--head);z-index:200;pointer-events:none;
}

/* ---------- ヘッダー ---------- */
.hd{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:var(--head);
  padding:0 8px;
  padding-top:env(safe-area-inset-top,0px);
  min-height:calc(52px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:4px;
}
/* ★画像モードは横幅いっぱいに敷く。左右の padding と gap を殺す。 */
.hd.has-img{padding-left:0;padding-right:0;gap:0;}
.hd-back{
  width:40px;height:40px;flex:0 0 40px;
  align-items:center;justify-content:center;
  background:none;border:0;cursor:pointer;
  color:rgba(255,255,255,.75);
}
.hd-back:active{color:#fff;}
/* ★2026-08-30：デモ期間の非表示を解除し、Brain へ戻るボタンを復活させた。
   （旧：.hd-back{display:none;} で殺していた） */
.hd-back{display:flex;}
.hd-title{
  color:#fff;font-size:16px;font-weight:400;
  letter-spacing:.06em;flex:1;min-width:0;
  text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* ヘッダー画像（2026-08-16：横幅いっぱいに敷き直し）
   ・width:100% で端から端まで使う
   ・元画像は 4.38:1 の横長。ヘッダーの実効比率（画面幅÷52px）は
     たいていそれより横長になるため、object-fit:cover で高さを埋め、
     はみ出す左右をトリミングする。ロゴは中央にあるので切れない。
   ・元画像は上下に黒の余白があるので、多少切れても見た目は変わらない。 */
.hd-img{
  display:none;
  width:100%;height:52px;
  object-fit:cover;
  object-position:center;
}
.hd.has-img .hd-title{display:none;}
.hd.has-img .hd-img{display:block;}
/* ★画像モードではヘッダー画像の上に重ねて出す（左端・最前面）。
   ★.hd が position:fixed なので、ここの absolute は .hd 基準になる。
     .hd の position を変えるとボタンが飛ぶので注意。
   ★ヘッダー画像が明るめのときでも見えるよう影を入れてある。 */
.hd.has-img .hd-back{
  position:absolute;left:2px;top:env(safe-area-inset-top,0px);
  z-index:5;
  color:#fff;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.9));
}

.hd-reload{
  height:40px;flex:0 0 auto;
  display:flex;align-items:center;gap:3px;
  padding:0 6px 0 4px;
  background:none;border:0;cursor:pointer;
  color:rgba(255,255,255,.75);
  font-family:inherit;font-size:11px;letter-spacing:.04em;
}
.hd-reload span{line-height:1;}
.hd-reload:active{color:#fff;}
.hd-reload.spin svg{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- タブ ---------- */
.tabs{
  position:sticky;
  top:calc(52px + env(safe-area-inset-top,0px));
  z-index:90;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  display:flex;
}
.tab{
  flex:1;
  padding:13px 4px 11px;
  text-align:center;
  font-size:14px;font-weight:500;
  color:var(--sub2);
  background:none;border:0;cursor:pointer;
  position:relative;
  transition:color .18s;
}
.tab[aria-selected="true"]{color:var(--text);font-weight:700;}
.tab::after{
  content:'';position:absolute;left:50%;right:50%;bottom:0;height:3px;
  background:var(--rose);border-radius:2px 2px 0 0;
  transition:left .22s cubic-bezier(.4,0,.2,1),right .22s cubic-bezier(.4,0,.2,1);
}
.tab[aria-selected="true"]::after{left:24%;right:24%;}
.tab-n{
  font-size:11px;color:var(--sub2);margin-left:4px;font-weight:400;
}

/* ---------- 予想屋フィルタ ---------- */
/* ヘッダ直下の明るめライトグレー帯。左詰めでアイコンが並ぶ。
   未選択＝全員表示。タップで薄緑＋チェック、他はわずかにグレーへ。 */
.who{
  background:#eceef1;
  border-bottom:1px solid var(--border);
  padding:9px 10px 7px;
}
/* ★、2026-08-25：横1列（横スクロール）→ 上下2段の6列グリッドに変更。
   上段6人・下段5人。下段は6列グリッドのまま左詰めなので、上下で列が揃う。
   アイコンは 36px → clamp(40px, 13.2vw, 48px)。
     幅320px（iPhone SE）：1セル＝(320−20−5×2)÷6 ≒ 48.3px → アイコン 42.2px
     幅390px（iPhone 14）：アイコン 48px（上限）
   ★人数を変えるときは WHO_ROWS（JS側）と --pv-cols の両方を直すこと。 */
.who-row{
  --pv-cols:6;
  display:grid;
  grid-template-columns:repeat(var(--pv-cols),1fr);
  gap:2px;
  justify-items:center;
}
.who-row + .who-row{margin-top:7px;}

.pv{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  width:100%;min-width:0;
  background:none;border:0;padding:0;cursor:pointer;
  font-family:inherit;
}
.pv-ic{
  position:relative;
  width:clamp(40px,13.2vw,48px);
  height:clamp(40px,13.2vw,48px);
}
.pv-ic img{
  width:100%;height:100%;border-radius:50%;display:block;
  background:var(--bg3);object-fit:cover;
  border:2px solid transparent;
  transition:border-color .18s,filter .18s,opacity .18s,transform .12s;
}
.pv-nm{
  font-size:9px;line-height:1.25;color:var(--sub2);
  max-width:100%;text-align:center;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;word-break:break-all;
  transition:color .18s;
}
/* チェックマーク */
.pv-ck{
  position:absolute;right:-2px;bottom:-2px;
  width:17px;height:17px;border-radius:50%;
  background:#4aa96c;border:2px solid #eceef1;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.4);
  transition:opacity .18s,transform .22s cubic-bezier(.3,1.4,.5,1);
}
.pv-ck svg{width:9px;height:9px;}

/* 選択中 */
.pv[aria-pressed="true"] .pv-ic img{
  border-color:#4aa96c;
  box-shadow:0 0 0 3px rgba(126,200,150,.38);
}
.pv[aria-pressed="true"] .pv-ck{opacity:1;transform:scale(1);}
.pv[aria-pressed="true"] .pv-nm{color:var(--text);font-weight:500;}
.pv:active .pv-ic img{transform:scale(.93);}

/* 誰かが選択されているとき、選ばれていない側をほんの少し落とす */
.who.picking .pv[aria-pressed="false"] .pv-ic img{
  filter:grayscale(.55);opacity:.55;
}
.who.picking .pv[aria-pressed="false"] .pv-nm{opacity:.6;}

.who-hint{
  margin-top:6px;
  font-size:9.5px;color:var(--sub2);letter-spacing:.02em;
}

/* ---------- タイムライン ---------- */
.tl{padding-bottom:48px;}

/* Xロゴ：表示要件でタイムライン先頭に常時表示 */
.tl-attr{
  display:flex;align-items:center;gap:7px;
  padding:9px 12px 9px 16px;
  color:var(--sub2);font-size:11.5px;
  border-bottom:1px solid var(--border);
  background:var(--bg2);
}
.tl-attr svg{flex:0 0 13px;}
.tl-attr .sp{flex:1;}

/* 更新ボタン（2026-08-15：ヘッダーからこの行の右端へ移動） */
.tl-reload{
  flex:0 0 auto;
  display:flex;align-items:center;gap:4px;
  padding:5px 9px;
  border:1px solid var(--border);border-radius:999px;
  background:var(--bg3);color:var(--sub);
  font-family:inherit;font-size:11px;letter-spacing:.03em;
  cursor:pointer;
  transition:border-color .16s,background .16s;
}
.tl-reload:active{border-color:var(--border2);background:var(--bg2);}
.tl-reload svg{flex:0 0 13px;}
.tl-reload.spin svg{animation:spin .8s linear infinite;}

.card{
  display:flex;gap:11px;
  padding:14px 16px 12px;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  position:relative;
}
.card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--rose);
  transform:scaleX(0);transform-origin:left;
  transition:transform .3s ease;
}
.card.is-new::before{transform:scaleX(1);}

@keyframes slidein{
  from{opacity:0;transform:translateY(-8px);}
  to{opacity:1;transform:none;}
}
.card.enter{animation:slidein .32s cubic-bezier(.2,.8,.3,1) both;}

.av{
  flex:0 0 42px;width:42px;height:42px;
  border-radius:50%;display:block;
  background:var(--bg3);
  object-fit:cover;
}
.bd{flex:1;min-width:0;}

.nm{
  display:flex;align-items:baseline;gap:5px;
  flex-wrap:wrap;
  margin-bottom:3px;
}
.nm a.who-link{
  color:var(--text);font-weight:700;font-size:14px;
  text-decoration:none;
}
.nm a.who-link:active{text-decoration:underline;}
.nm .at{color:var(--sub2);font-size:12.5px;text-decoration:none;}
.badge{
  font-size:10.5px;font-weight:700;letter-spacing:.04em;
  padding:1.5px 6px;border-radius:4px;
  line-height:1.5;
}
.badge.buy{background:rgba(192,68,110,.1);color:var(--rose);}
.badge.note{background:rgba(26,111,255,.09);color:var(--accent);}
.badge.live{background:rgba(232,44,44,.1);color:#e82c2c;}
.badge.edited{background:var(--bg3);color:var(--sub2);font-weight:400;}

/* 本文：ここが主役。改変せず全文を出す */
.tx{
  font-size:15.5px;
  line-height:1.72;
  color:var(--text);
  white-space:pre-wrap;
  word-break:break-word;
  letter-spacing:.005em;
}
.tx a{color:var(--accent);text-decoration:none;}
.tx a:active{text-decoration:underline;}

.mt{
  display:flex;align-items:center;gap:9px;
  margin-top:9px;
  font-size:12px;color:var(--sub2);
}
.mt a{color:var(--sub2);text-decoration:none;}
.mt a:active{color:var(--sub);}
.mt .sep{opacity:.45;}
.mt .onx{
  display:inline-flex;align-items:center;gap:4px;
}

/* ---------- noteカード ---------- */
/* リンク先は本文中のURLと同一。X自身も同じ形でリンクカードを描画する。
   「いいね」等のアクションを付け足すものではないため表示要件に抵触しない。 */
.nc{
  display:block;
  margin-top:11px;
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  background:var(--bg3);
  text-decoration:none;
  color:inherit;
  transition:border-color .16s,transform .12s;
}
.nc:active{border-color:var(--border2);transform:scale(.995);}
.nc-img{
  display:block;width:100%;aspect-ratio:1200/630;
  object-fit:cover;background:var(--border);
  border-bottom:1px solid var(--border);
}
.nc-b{padding:9px 12px 11px;}
.nc-t{
  font-size:13.5px;font-weight:700;color:var(--text);
  line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.nc-d{
  font-size:12px;color:var(--sub2);line-height:1.6;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.nc-h{
  font-size:11px;color:var(--sub2);margin-top:6px;
  display:flex;align-items:center;gap:4px;
}

/* ---------- 状態表示 ---------- */
.state{
  padding:56px 28px;
  text-align:center;
  color:var(--sub2);
  font-size:13.5px;
  line-height:1.9;
}
.state b{display:block;color:var(--sub);font-size:15px;font-weight:700;margin-bottom:6px;}
.state button{
  margin-top:16px;padding:9px 20px;
  border:1px solid var(--border2);border-radius:8px;
  background:var(--bg2);color:var(--sub);
  font-family:inherit;font-size:13px;cursor:pointer;
}

.sk{
  display:flex;gap:11px;padding:14px 16px;
  background:var(--bg2);border-bottom:1px solid var(--border);
}
.sk i{display:block;background:var(--border);border-radius:6px;animation:pulse 1.3s ease-in-out infinite;}
.sk .a{flex:0 0 42px;width:42px;height:42px;border-radius:50%;}
.sk .l{flex:1;}
.sk .l i{height:11px;margin-bottom:9px;}
.sk .l i:nth-child(1){width:38%;}
.sk .l i:nth-child(2){width:92%;}
.sk .l i:nth-child(3){width:64%;margin-bottom:0;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.45;}}

.dev{
  background:#3a3d4a;color:#fff;letter-spacing:.02em;
  font-size:11.5px;text-align:center;
  padding:8px 12px;line-height:1.75;
}
/* ★2026-08-30：稼働スケジュールの2段表示 */
.dev-l1{display:block;font-weight:600;}
.dev-l2{display:block;font-variant-numeric:tabular-nums;opacity:.85;}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;}
}
</style>
</head>
<body>

<header class="hd has-img" id="hd">
  <button class="hd-back" id="backBtn" aria-label="戻る">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <!-- ★ヘッダー画像。リポジトリ直下に kaime-header.jpg として置く。
       worker.js の PUBLIC_ASSETS にも登録が必要（無いと認証で弾かれる）。 -->
  <img class="hd-img" id="hdImg" src="/kaime-header.jpg" alt="Brain 競輪買い目だけTL">
  <span class="hd-title">Brain 競輪買い目だけTL</span>

<div class="dev" id="devNote"><span class="dev-l1">タイムライン稼働スケジュール</span><span class="dev-l2">（8:30～13:30 / 17:00～20:30）</span></div>

<nav class="tabs" role="tablist">
  <button class="tab" role="tab" data-kind="all"  aria-selected="false">すべて<span class="tab-n" id="nAll"></span></button>
  <button class="tab" role="tab" data-kind="buy"  aria-selected="true">買い目<span class="tab-n" id="nBuy"></span></button>

<div class="who" id="who"></div>

<main class="tl" id="tl"></main>

<script>
'use strict';

/* =========================================================
   設定
   ========================================================= */

/** ★開発用。実APIに切り替えるときは false にする。
    false にすると .dev のバナーも自動で消える。 */
const MOCK = false;

/** 配信APIのパス。
    brainkeirin.jp/api/timeline* を brain-timeline Worker に割り当てている。
    同一オリジンなのでCORSは不要。 */
const API = '/api/timeline';

/** 自動更新の間隔（ミリ秒）。0で無効。 */
const AUTO_MS = 60000;

/* =========================================================
   予想屋チップの並び順（2026-08-25）
   ★ここは【表示の並べ替えだけ】。予想屋の追加・削除・@の変更は
     brain-timeline Worker 側（D1 の authors テーブル）でしかできない。
     このファイルだけを直しても人は増えない。

   各スロットは文字列か配列。配列の場合は先頭から順に探し、最初に見つかった人を当てる。
   照合は username → chip_name → display_name の順。大文字小文字は無視。
   ここに無い予想屋は末尾に自動で回る（取りこぼし防止）。

   ★username で書くのが正。表示名は本人がいつでも変えられるため、
     表示名だけのスロットは将来壊れる（壊れても末尾に回るだけで消えはしない）。
     username が分かり次第差し替えること。
   ========================================================= */
const WHO_ROWS = [
  /* 上段 */
  [
    'ikkaku_mankin',              // パウ社長
    'asilogkeirin',               // 脚ログ
    'kAmodaira',                  // カモ（2026-08-25 新アカ。旧 x4thm は凍結のため削除済）
    'rikabariy33',                // 上のやまだ
    'meimeimiomei',               // メイメイ
    'shu7878shu'                  // shu（2026-08-25 新規）
  ],
  /* 下段 */
  [
    'hamucharichari',             // はむたろう
    'mentos777kei_r',             // めんとす
    'shinomaru_ngt',              // しのまる
    'mimimi777569791',            // みみみ
    'oretatiyume39'               // もち（2026-08-25 新規）
  ]
];
/* 2026-08-25：D1 の authors を実物確認し、全員を username 照合に統一した。
   以前は表示名照合のスロットがあり、本人が表示名を変えると並びが崩れた。
   username は本人も変えられるが、変われば D1 側の修正が必須になるので気づける。 */

/* チップのラベル上書き。キーは username（小文字で照合）。
   ★原則空にしておくこと。チップ名の正は D1 の chip_name 。
     ここに書くと D1 を直しても反映されず、二重管理になる。
     D1 をすぐに触れない場合の応急処置としてのみ使う。
   例：{ 'shu7878shu':'shu' } */
const WHO_CHIP_NAME = {};

/* =========================================================
   モックデータ
   ★架空の投稿は作らない。X上に実在するポストのみを使う。
     （存在しない投稿のモックアップ表示は表示要件で禁じられている）
   ========================================================= */
const MOCK_AUTHORS = [{
  username:'ikkaku_mankin',

/* =========================================================
   本文の組み立て
   ★本文は一切改変しない。entities に沿ってリンクを張るだけ。
     コードポイント単位で扱う（絵文字で位置がずれるため）。
   ========================================================= */
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function buildText(post){
  const cp = Array.from(post.text || '');
  const e  = post.entities || {};
  const marks = [];

  (e.urls || []).forEach(u=>marks.push({
    s:u.start, e:u.end,
    html:'<a href="'+esc(u.url||u.expanded_url||'')+'" target="_blank" rel="noopener nofollow">'+esc(u.display_url||u.expanded_url||u.url||'')+'</a>'
  }));
  (e.mentions || []).forEach(m=>marks.push({
    s:m.start, e:m.end,
    html:'<a href="https://x.com/'+encodeURIComponent(m.username)+'" target="_blank" rel="noopener">@'+esc(m.username)+'</a>'
  }));
  (e.hashtags || []).forEach(h=>marks.push({
    s:h.start, e:h.end,
    html:'<a href="https://x.com/hashtag/'+encodeURIComponent(h.tag)+'" target="_blank" rel="noopener">#'+esc(h.tag)+'</a>'
  }));
  (e.cashtags || []).forEach(c=>marks.push({
    s:c.start, e:c.end,
    html:'<a href="https://x.com/search?q=%24'+encodeURIComponent(c.tag)+'" target="_blank" rel="noopener">$'+esc(c.tag)+'</a>'
  }));

  marks.sort((a,b)=>a.s-b.s);

  let out = '', cur = 0;
  for(const m of marks){
    if(m.s < cur || m.s > cp.length) continue;   // 範囲外・重複は捨てる
    out += esc(cp.slice(cur, m.s).join(''));
    out += m.html;
    cur = Math.min(m.e, cp.length);
  }
  out += esc(cp.slice(cur).join(''));
  return out;
}

/* =========================================================
   時刻
   ★表示要件：タイムスタンプを表示し permalink へリンクする
   ========================================================= */
function when(iso){
  const t = new Date(iso), now = Date.now();
  const sec = Math.floor((now - t.getTime())/1000);
  if(sec < 60)    return 'たった今';
  if(sec < 3600)  return Math.floor(sec/60)+'分前';
  if(sec < 86400) return Math.floor(sec/3600)+'時間前';
  const m = t.getMonth()+1, d = t.getDate();
  const hh = String(t.getHours()).padStart(2,'0');
  const mm = String(t.getMinutes()).padStart(2,'0');
  return m+'/'+d+' '+hh+':'+mm;
}

function whenFull(iso){
  const t = new Date(iso);
  return t.getFullYear()+'/'+(t.getMonth()+1)+'/'+t.getDate()+' '
       + String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
}

function cardLink(p){

  const c = p.card;
  const host = (function(){
    try{ return new URL(p.note_url).hostname.replace(/^www\./,''); }
    catch(e){ return 'note.com'; }
  })();
  return ''
  + '<a class="nc" href="' + esc(p.note_url) + '" target="_blank" rel="noopener nofollow">'
  +   (c.image ? '<img class="nc-img" src="' + esc(c.image) + '" alt="" loading="lazy">' : '')
  +   '<div class="nc-b">'
  +     (c.title ? '<div class="nc-t">' + esc(c.title) + '</div>' : '')
  +     (c.desc  ? '<div class="nc-d">' + esc(c.desc)  + '</div>' : '')
  +     '<div class="nc-h">' + esc(host) + '</div>'
  +   '</div>'
  + '</a>';
}

function cardHTML(p, isNew){

  +       '<a class="onx" href="' + esc(p.permalink) + '" target="_blank" rel="noopener">' + X_LOGO + 'Xで見る</a>'
  +     '</div>'
  +   '</div>'
  + '</article>';
}

function visible(){
  return S.posts.filter(p=>{
    if(S.who.size > 0 && !S.who.has(p.username)) return false;
    if(S.kind === 'buy')  return p.kind === 'buy' || p.kind === 'note';
    if(S.kind === 'note') return p.kind === 'note';
    return true;
  });
}

function render(){
  const list = visible();
  const tl = $('tl');

  const attr = '<div class="tl-attr">' + X_LOGO + 'Xの投稿を表示しています'
             + '<span class="sp"></span>'
             + '<button class="tl-reload" id="reloadBtn" aria-label="最新に更新">'
             +   '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>'
             +   '更新'
             + '</button>'
             + '</div>';

  if(list.length === 0){
    tl.innerHTML = attr
      + '<div class="state"><b>表示できる投稿がありません</b>'
      + (S.who.size > 0 || S.kind !== 'all'
          ? '絞り込みを外すと他の投稿が見られます。'
          : '新しい投稿が届くとここに並びます。')
      + '</div>';
    counts();
    return;
  }

  let html = attr;
  for(const p of list){
    const isNew = !S.first && !S.seen.has(p.id);
    html += cardHTML(p, isNew);
  }
  tl.innerHTML = html;

  list.forEach(p=>S.seen.add(p.id));
  S.first = false;
  counts();
}

function counts(){
  const base = S.posts.filter(p=>S.who.size === 0 || S.who.has(p.username));
  const n = k => base.filter(p=>{
    if(k === 'buy')  return p.kind === 'buy' || p.kind === 'note';
    if(k === 'note') return p.kind === 'note';
    return true;
  }).length;
  $('nAll').textContent  = n('all')  || '';
  $('nBuy').textContent  = n('buy')  || '';
  $('nNote').textContent = n('note') || '';
}

/* チップに出す名前。WHO_CHIP_NAME の上書きが最優先。 */
function chipName(u){
  const a = S.authors[u] || {};
  return WHO_CHIP_NAME[String(u).toLowerCase()] || a.chip_name || a.display_name || u;
}

/* WHO_ROWS の1スロットを username に解決する。
   username → chip_name → display_name の順で探す（大文字小文字無視）。
   見つからなければ null。used に入っている人は重複を避けて飛ばす。 */
function resolveWho(slot, pool, used){
  const keys = Array.isArray(slot) ? slot : [slot];
  for(const k of keys){
    const key = String(k).toLowerCase();
    for(const u of pool){
      if(used.has(u)) continue;
      const a = S.authors[u] || {};
      if(String(u).toLowerCase() === key)                           return u;
      if(a.chip_name    && String(a.chip_name).toLowerCase()    === key) return u;
      if(a.display_name && String(a.display_name).toLowerCase() === key) return u;
    }
  }
  return null;
}

function renderWho(){
  const el = $('who');
  const pool = Object.keys(S.authors);
  if(pool.length === 0){ el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.classList.toggle('picking', S.who.size > 0);

  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

  /* WHO_ROWS の順に並べる。解決できなかったスロットは詰める（空枠は作らない）。 */
  const used = new Set();
  const rows = WHO_ROWS.map(r=>{
    const out = [];
    for(const slot of r){
      const u = resolveWho(slot, pool, used);
      if(u){ used.add(u); out.push(u); }
    }
    return out;
  });

  /* WHO_ROWS に無い予想屋は末尾の段へ。人が増えても消えないようにする。 */
  const rest = pool.filter(u=>!used.has(u));
  if(rest.length){
    if(rows.length === 0) rows.push([]);
    rows[rows.length - 1] = rows[rows.length - 1].concat(rest);
  }

  const pvHTML = u => {
    const a = S.authors[u] || {};
    const on = S.who.has(u);
    return '<button class="pv" data-who="' + esc(u) + '" aria-pressed="' + on + '">'
         +   '<span class="pv-ic">'
         +     '<img src="' + esc(a.profile_image_url || '') + '" alt="">'
         +     '<span class="pv-ck">' + CHECK + '</span>'
         +   '</span>'
         +   '<span class="pv-nm">' + esc(chipName(u)) + '</span>'
         + '</button>';
  };

  /* 列数は一番人数の多い段に合わせる。上下で列位置を揃えるため、
     全段で同じ値を使う（下段が5人なら左詰めになる）。 */
  const cols = Math.max(1, ...rows.map(r=>r.length));

  const html = rows
    .filter(r=>r.length > 0)
    .map(r=>'<div class="who-row" style="--pv-cols:' + cols + '">' + r.map(pvHTML).join('') + '</div>')
    .join('');

  el.innerHTML = html
               + '<div class="who-hint">アイコンをタップで絞り込み（複数選択可）</div>';
}

function skeleton(){
  let h = '';
  for(let i=0;i<4;i++){
    h += '<div class="sk"><i class="a"></i><div class="l"><i></i><i></i><i></i></div></div>';
  }
  $('tl').innerHTML = h;
}

/* =========================================================
   取得
   ========================================================= */
/* 更新ボタンの回転表示。ボタンが未描画の瞬間があるので存在確認する。 */
function spin(on){
  const b = $('reloadBtn');
  if(!b) return;
  b.classList.toggle('spin', !!on);
}

async function load(){
  if(S.loading) return;
  S.loading = true;
  spin(true);

  try{
    if(MOCK){
      MOCK_AUTHORS.forEach(a=>S.authors[a.username] = a);
      S.posts = MOCK_POSTS.slice();
    }else{
      const r = await fetch(API + '?kind=all&limit=200', {credentials:'same-origin'});
      if(!r.ok) throw new Error('status ' + r.status);
      const d = await r.json();
      (d.authors || []).forEach(a=>S.authors[a.username] = a);
      S.posts = d.posts || [];
    }
    renderWho();
    render();
  }catch(err){
    $('tl').innerHTML =
      '<div class="state"><b>投稿を読み込めませんでした</b>'
      + '通信が不安定な可能性があります。もう一度お試しください。'
      + '<br><span style="font-size:11.5px;opacity:.7">' + esc(String(err.message || err)) + '</span>'
      + '<br><button id="retryBtn">再読み込み</button></div>';
    const rb = $('retryBtn');
    if(rb) rb.addEventListener('click', load);
  }finally{
    S.loading = false;
    spin(false);
  }
}

   ========================================================= */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    if(t.getAttribute('aria-selected') === 'true') return;
    document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected','false'));
    t.setAttribute('aria-selected','true');
    S.kind = t.dataset.kind;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  });
});

$('who').addEventListener('click', e=>{
  const c = e.target.closest('.pv');
  if(!c) return;
  const u = c.dataset.who;
  if(S.who.has(u)) S.who.delete(u); else S.who.add(u);
  renderWho();
  render();
});

$('tl').addEventListener('click', e => {

});

load();
