<style>
/* =========================================================
   厳選予想屋買い目TL  /kaime
   2026-08-08

   ★配色・タイポは app.html の :root / .rt-header から取得。
     独自に決めていない。app系に揃えるという指示に基づく。

   ★X Display Requirements 準拠のため、以下は変更しないこと：
     ・本文は改変しない（抜粋・強調・再構成すべて不可）
     ・アイコン／表示名／@username を必ず表示しプロフィールへリンク
     ・タイムスタンプを表示し permalink へリンク
     ・「Xで見る」をタイムスタンプ横に置く
     ・Xロゴをタイムライン先頭に常時表示
     ・投稿カードに自前のアクション（お気に入り等）を付けない
   ========================================================= */

:root{
  --bg:#f2f3f5;
  --bg2:#ffffff;
  --bg3:#f7f8fa;
  --border:#e0e2e8;
  --border2:#c8cad4;
  --text:#3a3d4a;
  --sub:#5a5f78;
  --sub2:#9095aa;
  --accent:#1a6fff;
  --rose:#c0446e;
  --head:#0f0f0f;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{margin:0;padding:0;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Noto Sans JP',sans-serif;
  min-height:100vh;
  overflow-x:clip;
  overscroll-behavior-y:none;
  padding-top:calc(52px + env(safe-area-inset-top,0px));
}

/* PWA時のステータスバー塗り（app.html と同じ手当て） */
body::before{
  content:'';position:fixed;top:0;left:0;right:0;
  height:env(safe-area-inset-top,0px);
  background:var(--head);z-index:200;pointer-events:none;
}

/* ---------- ヘッダー ---------- */
.hd{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:var(--head);
  padding:0 8px;
  padding-top:env(safe-area-inset-top,0px);
  min-height:calc(52px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:4px;
}
.hd-back{
  width:40px;height:40px;flex:0 0 40px;
  display:flex;align-items:center;justify-content:center;
  background:none;border:0;cursor:pointer;
  color:rgba(255,255,255,.75);
}
.hd-back:active{color:#fff;}
.hd-title{
  color:#fff;font-size:16px;font-weight:700;
  letter-spacing:.02em;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* ヘッダー画像は後日差し替え。img を入れれば .hd-title は隠れる */
.hd-img{display:none;height:28px;width:auto;}
.hd.has-img .hd-title{display:none;}
.hd.has-img .hd-img{display:block;}

.hd-reload{
  width:40px;height:40px;flex:0 0 40px;
  display:flex;align-items:center;justify-content:center;
  background:none;border:0;cursor:pointer;
  color:rgba(255,255,255,.75);
}
.hd-reload:active{color:#fff;}
.hd-reload.spin svg{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- タブ ---------- */
.tabs{
  position:sticky;
  top:calc(52px + env(safe-area-inset-top,0px));
  z-index:90;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  display:flex;
}
.tab{
  flex:1;
  padding:13px 4px 11px;
  text-align:center;
  font-size:14px;font-weight:500;
  color:var(--sub2);
  background:none;border:0;cursor:pointer;
  position:relative;
  transition:color .18s;
}
.tab[aria-selected="true"]{color:var(--text);font-weight:700;}
.tab::after{
  content:'';position:absolute;left:50%;right:50%;bottom:0;height:3px;
  background:var(--rose);border-radius:2px 2px 0 0;
  transition:left .22s cubic-bezier(.4,0,.2,1),right .22s cubic-bezier(.4,0,.2,1);
}
.tab[aria-selected="true"]::after{left:24%;right:24%;}
.tab-n{
  font-size:11px;color:var(--sub2);margin-left:4px;font-weight:400;
}

/* ---------- 予想屋フィルタ ---------- */
.who{
  display:flex;gap:8px;
  padding:10px 12px;
  overflow-x:auto;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  scrollbar-width:none;
}
.who::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto;
  display:flex;align-items:center;gap:6px;
  padding:6px 12px 6px 6px;
  border:1px solid var(--border);
  border-radius:999px;
  background:var(--bg3);
  font-size:13px;color:var(--sub);
  font-family:inherit;cursor:pointer;
  transition:border-color .16s,background .16s,color .16s;
}
.chip.all{padding-left:12px;}
.chip img{width:22px;height:22px;border-radius:50%;display:block;}
.chip[aria-pressed="true"]{
  border-color:var(--rose);
  background:rgba(192,68,110,.07);
  color:var(--text);
  font-weight:500;
}

/* ---------- タイムライン ---------- */
.tl{padding-bottom:48px;}

/* Xロゴ：表示要件でタイムライン先頭に常時表示 */
.tl-attr{
  display:flex;align-items:center;gap:7px;
  padding:11px 16px;
  color:var(--sub2);font-size:11.5px;
  border-bottom:1px solid var(--border);
  background:var(--bg2);
}
.tl-attr svg{flex:0 0 13px;}

.card{
  display:flex;gap:11px;
  padding:14px 16px 12px;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  position:relative;
}
.card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--rose);
  transform:scaleX(0);transform-origin:left;
  transition:transform .3s ease;
}
.card.is-new::before{transform:scaleX(1);}

@keyframes slidein{
  from{opacity:0;transform:translateY(-8px);}
  to{opacity:1;transform:none;}
}
.card.enter{animation:slidein .32s cubic-bezier(.2,.8,.3,1) both;}

.av{
  flex:0 0 42px;width:42px;height:42px;
  border-radius:50%;display:block;
  background:var(--bg3);
  object-fit:cover;
}
.bd{flex:1;min-width:0;}

.nm{
  display:flex;align-items:baseline;gap:5px;
  flex-wrap:wrap;
  margin-bottom:3px;
}
.nm a.who-link{
  color:var(--text);font-weight:700;font-size:14px;
  text-decoration:none;
}
.nm a.who-link:active{text-decoration:underline;}
.nm .at{color:var(--sub2);font-size:12.5px;text-decoration:none;}
.badge{
  font-size:10.5px;font-weight:700;letter-spacing:.04em;
  padding:1.5px 6px;border-radius:4px;
  line-height:1.5;
}
.badge.buy{background:rgba(192,68,110,.1);color:var(--rose);}
.badge.note{background:rgba(26,111,255,.09);color:var(--accent);}
.badge.edited{background:var(--bg3);color:var(--sub2);font-weight:400;}

/* 本文：ここが主役。改変せず全文を出す */
.tx{
  font-size:15.5px;
  line-height:1.72;
  color:var(--text);
  white-space:pre-wrap;
  word-break:break-word;
  letter-spacing:.005em;
}
.tx a{color:var(--accent);text-decoration:none;}
.tx a:active{text-decoration:underline;}

.mt{
  display:flex;align-items:center;gap:9px;
  margin-top:9px;
  font-size:12px;color:var(--sub2);
}
.mt a{color:var(--sub2);text-decoration:none;}
.mt a:active{color:var(--sub);}
.mt .sep{opacity:.45;}
.mt .onx{
  display:inline-flex;align-items:center;gap:4px;
}

/* ---------- noteカード ---------- */
/* リンク先は本文中のURLと同一。X自身も同じ形でリンクカードを描画する。
   「いいね」等のアクションを付け足すものではないため表示要件に抵触しない。 */
.nc{
  display:block;
  margin-top:11px;
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  background:var(--bg3);
  text-decoration:none;
  color:inherit;
  transition:border-color .16s,transform .12s;
}
.nc:active{border-color:var(--border2);transform:scale(.995);}
.nc-img{
  display:block;width:100%;aspect-ratio:1200/630;
  object-fit:cover;background:var(--border);
  border-bottom:1px solid var(--border);
}
.nc-b{padding:9px 12px 11px;}
.nc-t{
  font-size:13.5px;font-weight:700;color:var(--text);
  line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.nc-d{
  font-size:12px;color:var(--sub2);line-height:1.6;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.nc-h{
  font-size:11px;color:var(--sub2);margin-top:6px;
  display:flex;align-items:center;gap:4px;
}

/* ---------- 状態表示 ---------- */
.state{
  padding:56px 28px;
  text-align:center;
  color:var(--sub2);
  font-size:13.5px;
  line-height:1.9;
}
.state b{display:block;color:var(--sub);font-size:15px;font-weight:700;margin-bottom:6px;}
.state button{
  margin-top:16px;padding:9px 20px;
  border:1px solid var(--border2);border-radius:8px;
  background:var(--bg2);color:var(--sub);
  font-family:inherit;font-size:13px;cursor:pointer;
}

.sk{
  display:flex;gap:11px;padding:14px 16px;
  background:var(--bg2);border-bottom:1px solid var(--border);
}
.sk i{display:block;background:var(--border);border-radius:6px;animation:pulse 1.3s ease-in-out infinite;}
.sk .a{flex:0 0 42px;width:42px;height:42px;border-radius:50%;}
.sk .l{flex:1;}
.sk .l i{height:11px;margin-bottom:9px;}
.sk .l i:nth-child(1){width:38%;}
.sk .l i:nth-child(2){width:92%;}
.sk .l i:nth-child(3){width:64%;margin-bottom:0;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.45;}}

.dev{
  background:#3a3d4a;color:#fff;
  font-size:11.5px;text-align:center;
  padding:7px 12px;line-height:1.6;
}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;}
}
</style>
</head>

<script>
'use strict';

/* =========================================================
   設定
   ========================================================= */

/** ★開発用。実APIに切り替えるときは false にする。
    false にすると .dev のバナーも自動で消える。 */
const MOCK = true;

/** 配信APIのパス。worker.js 側でルートを張る。 */
const API = '/api/timeline';

/** 自動更新の間隔（ミリ秒）。0で無効。 */
const AUTO_MS = 60000;

/* =========================================================
   モックデータ
   ★架空の投稿は作らない。X上に実在するポストのみを使う。
     （存在しない投稿のモックアップ表示は表示要件で禁じられている）
   ========================================================= */
const MOCK_AUTHORS = [{
  username:'ikkaku_mankin',
  display_name:'パウ社長',
  profile_image_url:'https://pbs.twimg.com/profile_images/2077014116892651520/Ek1XmUAk_normal.jpg'
}];

const MOCK_POSTS = [
  {id:'2085934320007708923',created_at:'2026-08-08T03:41:11.000Z',kind:'buy',
   text:'和歌山6R 12-12-369 1-9-238'},
  {id:'2085930735584858353',created_at:'2026-08-08T03:26:56.000Z',kind:'other',

  {id:'2085926650131448241',created_at:'2026-08-08T03:10:42.000Z',kind:'buy',
   text:'立川5R 37-347-3427 236箱'},
  {id:'2085917115455066274',created_at:'2026-08-08T02:32:49.000Z',kind:'other',
   text:'名古屋/白華楼 汁なし。有言実行。\nまず最初に来た人は普通の中華そば頼んで旨みを知って欲しいね'},
  {id:'2085912907595018625',created_at:'2026-08-08T02:16:06.000Z',kind:'other',
   text:'あんだけ突っ張ったら 9-3 or 9-1まで見ちゃう'},
  {id:'2085898395538145465',created_at:'2026-08-08T01:18:26.000Z',kind:'note',
   note_url:'https://note.com/pawpawpaw_paw/n/nd8fc3a44fb51',
   card:{
     title:'和歌山1R〜5R｜パウ社長',
     desc:'本日1本目。 よろしくお願いします。  パーフェクト目指していきます。',
     image:'https://assets.st-note.com/production/uploads/images/301453314/rectangle_large_type_2_f3ede60ec7f8fd52669bbd6630fc8006.jpg?fit=bounds&quality=85&width=1280'
   },
   text:'1本目\n和歌山パーフェクト目指していけます。\n気が合えば。\n\n和歌山1R〜5R｜パウ社長 https://t.co/b0KMf34jow',
   entities:{urls:[{start:44,end:67,url:'https://t.co/b0KMf34jow',expanded_url:'https://note.com/pawpawpaw_paw/n/nd8fc3a44fb51',display_url:'note.com/pawpawpaw_paw/…'}]}},
  {id:'2085895358954307994',created_at:'2026-08-08T01:06:22.000Z',kind:'buy',
   text:'岐阜6R 36-36-257 567箱'},
  {id:'2085728365521277264',created_at:'2026-08-07T14:02:47.000Z',kind:'buy',
   text:'伊東8R 野上舐められすぎだろ\n25-235-135'},
  {id:'2085719796071731330',created_at:'2026-08-07T13:28:44.000Z',kind:'buy',
   text:'宇都宮7R 17-127-1267'}
];
MOCK_POSTS.forEach(p=>{
  p.username='ikkaku_mankin';
  p.permalink='https://x.com/ikkaku_mankin/status/'+p.id;
});

/* =========================================================
   状態
   ========================================================= */
const S = {
  kind:'all',
  who:'',
  posts:[],
  authors:{},
  seen:new Set(),
  first:true,
  loading:false
};

const $ = id => document.getElementById(id);

/* =========================================================
   本文の組み立て
   ★本文は一切改変しない。entities に沿ってリンクを張るだけ。
     コードポイント単位で扱う（絵文字で位置がずれるため）。
   ========================================================= */
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function buildText(post){
  const cp = Array.from(post.text || '');
  const e  = post.entities || {};
  const marks = [];

  (e.urls || []).forEach(u=>marks.push({
    s:u.start, e:u.end,
    html:'<a href="'+esc(u.url||u.expanded_url||'')+'" target="_blank" rel="noopener nofollow">'+esc(u.display_url||u.expanded_url||u.url||'')+'</a>'
  }));
  (e.mentions || []).forEach(m=>marks.push({
    s:m.start, e:m.end,
    html:'<a href="https://x.com/'+encodeURIComponent(m.username)+'" target="_blank" rel="noopener">@'+esc(m.username)+'</a>'
  }));
  (e.hashtags || []).forEach(h=>marks.push({
    s:h.start, e:h.end,
    html:'<a href="https://x.com/hashtag/'+encodeURIComponent(h.tag)+'" target="_blank" rel="noopener">#'+esc(h.tag)+'</a>'
  }));
  (e.cashtags || []).forEach(c=>marks.push({
    s:c.start, e:c.end,
    html:'<a href="https://x.com/search?q=%24'+encodeURIComponent(c.tag)+'" target="_blank" rel="noopener">$'+esc(c.tag)+'</a>'
  }));

  marks.sort((a,b)=>a.s-b.s);

  let out = '', cur = 0;
  for(const m of marks){
    if(m.s < cur || m.s > cp.length) continue;   // 範囲外・重複は捨てる
    out += esc(cp.slice(cur, m.s).join(''));
    out += m.html;
    cur = Math.min(m.e, cp.length);
  }
  out += esc(cp.slice(cur).join(''));
  return out;
}

/* =========================================================
   時刻
   ★表示要件：タイムスタンプを表示し permalink へリンクする
   ========================================================= */
function when(iso){
  const t = new Date(iso), now = Date.now();
  const sec = Math.floor((now - t.getTime())/1000);
  if(sec < 60)    return 'たった今';
  if(sec < 3600)  return Math.floor(sec/60)+'分前';
  if(sec < 86400) return Math.floor(sec/3600)+'時間前';
  const m = t.getMonth()+1, d = t.getDate();
  const hh = String(t.getHours()).padStart(2,'0');
  const mm = String(t.getMinutes()).padStart(2,'0');
  return m+'/'+d+' '+hh+':'+mm;
}

function whenFull(iso){
  const t = new Date(iso);
  return t.getFullYear()+'/'+(t.getMonth()+1)+'/'+t.getDate()+' '
       + String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
}

/* =========================================================
   描画
   ========================================================= */
const X_LOGO = '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>';

function cardLink(p){
  if(!p.card || !p.note_url) return '';
  const c = p.card;
  const host = (function(){
    try{ return new URL(p.note_url).hostname.replace(/^www\./,''); }
    catch(e){ return 'note.com'; }
  })();
  return ''
  + '<a class="nc" href="' + esc(p.note_url) + '" target="_blank" rel="noopener nofollow">'
  +   (c.image ? '<img class="nc-img" src="' + esc(c.image) + '" alt="" loading="lazy">' : '')
  +   '<div class="nc-b">'
  +     (c.title ? '<div class="nc-t">' + esc(c.title) + '</div>' : '')
  +     (c.desc  ? '<div class="nc-d">' + esc(c.desc)  + '</div>' : '')
  +     '<div class="nc-h">' + esc(host) + '</div>'
  +   '</div>'
  + '</a>';
}

function cardHTML(p, isNew){
  const a = S.authors[p.username] || {};
  const name = a.display_name || p.username;
  const av = a.profile_image_url || '';
  const prof = 'https://x.com/' + encodeURIComponent(p.username);

  let badge = '';
  if(p.kind === 'buy')  badge = '<span class="badge buy">買い目</span>';
  if(p.kind === 'note') badge = '<span class="badge note">note</span>';
  const edited = p.edited ? '<span class="badge edited">編集済み</span>' : '';

  return ''
  + '<article class="card' + (isNew ? ' is-new enter' : '') + '">'
  +   '<a href="' + prof + '" target="_blank" rel="noopener">'
  +     '<img class="av" src="' + esc(av) + '" alt="' + esc(name) + '" loading="lazy">'
  +   '</a>'
  +   '<div class="bd">'
  +     '<div class="nm">'
  +       '<a class="who-link" href="' + prof + '" target="_blank" rel="noopener">' + esc(name) + '</a>'
  +       '<a class="at" href="' + prof + '" target="_blank" rel="noopener">@' + esc(p.username) + '</a>'
  +       badge + edited
  +     '</div>'
  +     '<div class="tx">' + buildText(p) + '</div>'
  +     cardLink(p)
  +     '<div class="mt">'
  +       '<a href="' + esc(p.permalink) + '" target="_blank" rel="noopener" title="' + whenFull(p.created_at) + '">' + when(p.created_at) + '</a>'
  +       '<span class="sep">·</span>'
  +       '<a class="onx" href="' + esc(p.permalink) + '" target="_blank" rel="noopener">' + X_LOGO + 'Xで見る</a>'
  +     '</div>'
  +   '</div>'
  + '</article>';
}

function visible(){
  return S.posts.filter(p=>{
    if(S.who && p.username !== S.who) return false;
    if(S.kind === 'buy')  return p.kind === 'buy' || p.kind === 'note';
    if(S.kind === 'note') return p.kind === 'note';
    return true;
  });
}

function render(){
  const list = visible();
  const tl = $('tl');

  const attr = '<div class="tl-attr">' + X_LOGO + 'Xの投稿を表示しています</div>';

  if(list.length === 0){
    tl.innerHTML = attr
      + '<div class="state"><b>表示できる投稿がありません</b>'
      + (S.who || S.kind !== 'all'
          ? '絞り込みを外すと他の投稿が見られます。'
          : '新しい投稿が届くとここに並びます。')
      + '</div>';
    counts();
    return;
  }

  let html = attr;
  for(const p of list){
    const isNew = !S.first && !S.seen.has(p.id);
    html += cardHTML(p, isNew);
  }
  tl.innerHTML = html;

  list.forEach(p=>S.seen.add(p.id));
  S.first = false;
  counts();
}

function counts(){
  const base = S.posts.filter(p=>!S.who || p.username === S.who);
  const n = k => base.filter(p=>{
    if(k === 'buy')  return p.kind === 'buy' || p.kind === 'note';
    if(k === 'note') return p.kind === 'note';
    return true;
  }).length;
  $('nAll').textContent  = n('all')  || '';
  $('nBuy').textContent  = n('buy')  || '';
  $('nNote').textContent = n('note') || '';
}

function renderWho(){
  const el = $('who');
  const names = Object.keys(S.authors);
  if(names.length <= 1){ el.style.display = 'none'; return; }
  el.style.display = 'flex';

  let html = '<button class="chip all" data-who="" aria-pressed="' + (S.who === '' ) + '">すべての予想屋</button>';
  for(const u of names){
    const a = S.authors[u];
    html += '<button class="chip" data-who="' + esc(u) + '" aria-pressed="' + (S.who === u) + '">'
          + '<img src="' + esc(a.profile_image_url || '') + '" alt="">'
          + esc(a.display_name || u) + '</button>';
  }
  el.innerHTML = html;
}

function skeleton(){
  let h = '';
  for(let i=0;i<4;i++){
    h += '<div class="sk"><i class="a"></i><div class="l"><i></i><i></i><i></i></div></div>';
  }
  $('tl').innerHTML = h;
}

/* =========================================================
   取得
   ========================================================= */
async function load(){
  if(S.loading) return;
  S.loading = true;
  $('reloadBtn').classList.add('spin');

  try{
    if(MOCK){
      MOCK_AUTHORS.forEach(a=>S.authors[a.username] = a);
      S.posts = MOCK_POSTS.slice();
    }else{
      const r = await fetch(API + '?kind=all&limit=200', {credentials:'same-origin'});
      if(!r.ok) throw new Error('status ' + r.status);
      const d = await r.json();
      (d.authors || []).forEach(a=>S.authors[a.username] = a);
      S.posts = d.posts || [];
    }
    renderWho();
    render();
  }catch(err){
    $('tl').innerHTML =
      '<div class="state"><b>投稿を読み込めませんでした</b>'
      + '通信が不安定な可能性があります。もう一度お試しください。'
      + '<br><span style="font-size:11.5px;opacity:.7">' + esc(String(err.message || err)) + '</span>'
      + '<br><button id="retryBtn">再読み込み</button></div>';
    const rb = $('retryBtn');
    if(rb) rb.addEventListener('click', load);
  }finally{
    S.loading = false;
    $('reloadBtn').classList.remove('spin');
  }
}

/* =========================================================
   操作
   ========================================================= */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    if(t.getAttribute('aria-selected') === 'true') return;
    document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected','false'));
    t.setAttribute('aria-selected','true');
    S.kind = t.dataset.kind;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  });
});

$('who').addEventListener('click', e=>{
  const c = e.target.closest('.chip');
  if(!c) return;
  S.who = c.dataset.who || '';
  renderWho();
  render();
});

$('reloadBtn').addEventListener('click', load);

$('backBtn').addEventListener('click', ()=>{
  if(history.length > 1) history.back();
  else location.href = '/';
});

if(!MOCK) $('devNote').style.display = 'none';

document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && !MOCK) load();
});

load();
if(AUTO_MS > 0 && !MOCK){
  setInterval(()=>{ if(!document.hidden) load(); }, AUTO_MS);
}
</script>
</body>
</html>
